<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyper Fights</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080d; --bg2:#0a111b; --panel:#0c1420; --line:#1d2b40;
  --cy:#7df9ff; --gr:#54f0c8; --am:#ffd166; --rd:#ff5a5a; --tx:#d7e5f2; --dim:#7f93a8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%,#10213a 0%,transparent 60%),
    linear-gradient(180deg,#060a11,#04070c 60%);
  color:var(--tx);font-family:var(--mono);-webkit-font-smoothing:antialiased;
  letter-spacing:.02em;overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 8px 20px;gap:8px}
h1,h2,h3,b,button{letter-spacing:.06em}
button{
  font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:#041018;background:linear-gradient(180deg,var(--cy),#49c9d8);
  border:1px solid #9bfaff;border-radius:3px;padding:10px 12px;cursor:pointer;
  box-shadow:0 0 0 1px #05121c,0 2px 0 #0b3a46,0 0 14px rgba(125,249,255,.22);
}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;filter:grayscale(1);cursor:default}
button.ghost{background:transparent;color:var(--cy);border:1px solid #2d4a63;box-shadow:none}
button.mini{padding:6px 8px;font-size:10px;background:transparent;color:var(--cy);border:1px solid #2d4a63;box-shadow:none}

/* ---------- title ---------- */
#title-screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:760px}
.tbox{width:100%;text-align:center;padding:14px 4px 10px}
h1{font-size:clamp(30px,10vw,58px);line-height:.95;color:#eaf6ff;
  text-shadow:0 0 18px rgba(125,249,255,.55),0 3px 0 #0a2130}
h1 span{display:block;font-size:.42em;color:var(--cy);letter-spacing:.44em;margin-top:6px;text-shadow:0 0 12px rgba(125,249,255,.8)}
.tag2{margin-top:10px;font-size:10px;letter-spacing:.34em;color:var(--dim)}
.tdesc{margin:14px auto 0;max-width:46ch;font-size:12px;line-height:1.7;color:#a9bfd4}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 8px}
.tbest{font-size:10px;color:var(--am);letter-spacing:.2em}
.tros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px;text-align:left}
.tr{background:linear-gradient(180deg,#0d1725,#0a1118);border:1px solid var(--line);border-radius:4px;padding:10px;position:relative}
.tr canvas{width:40px;height:40px;image-rendering:pixelated;display:block;margin-bottom:4px}
.tr b{display:block;font-size:13px;color:var(--cy)}
.tr span{display:block;font-size:9px;color:var(--dim);letter-spacing:.16em;margin-bottom:6px}
.tsg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:6px 0 4px}
.tsc{background:#070e18;border:1px solid #16243a;border-radius:2px;padding:3px 1px;text-align:center}
.tsc b{display:block;font-size:7px;color:#5f7d96;letter-spacing:.06em}
.tsc span{display:block;font-size:12px;color:#eaf6ff;margin:0}
.tsc em{display:block;font-size:7px;color:var(--gr);font-style:normal}
.tr u{display:block;text-decoration:none;font-size:7px;letter-spacing:.14em;color:var(--am);margin-bottom:4px}
.tr i{display:block;font-size:10px;color:#6f8699;line-height:1.5;font-style:normal;margin-top:6px}

/* ---------- game ---------- */
#game-screen{display:none;flex-direction:column;width:100%;max-width:760px;gap:6px}
#hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:10px}
.hleft,.hmid{display:flex;flex-direction:column;gap:1px;min-width:0}
.hleft b{color:var(--cy);font-size:12px}
.hmid{flex:1;min-width:90px}
.hmid b{color:var(--am);font-size:11px}
.hleft span,.hmid span{color:var(--dim);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:9px;color:var(--dim);white-space:nowrap}
.pill.ply{color:#041018;background:var(--gr);border-color:var(--gr);font-weight:700}
.pill.foe{color:#190608;background:var(--rd);border-color:var(--rd);font-weight:700}

#cvwrap{position:relative;border:1px solid #22354b;border-radius:4px;overflow:hidden;
  background:#070b11;box-shadow:inset 0 0 50px rgba(0,0,0,.7),0 0 24px rgba(0,0,0,.6)}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}

#panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:92px}
.hint{font-size:10px;color:var(--dim);line-height:1.55;padding:3px 2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.acts button{flex:1 1 auto;min-width:86px}

.ucard{font-size:11px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.unm{color:var(--cy);font-weight:700;font-size:13px}
.ucls{color:var(--dim);font-size:9px;letter-spacing:.14em}
.urow{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.urow.small{font-size:9px;color:#9ab0c6;letter-spacing:.08em}
.urow.dim{color:var(--dim)}
.bar{flex:1;min-width:60px;height:7px;background:#060b12;border:1px solid #1b2a3c;display:block;position:relative}
.bar i{display:block;height:100%}
.hpn{font-size:10px;color:#b9cde0}
.tag{font-size:8px;border:1px solid #58381c;background:#241307;color:var(--am);padding:2px 5px;border-radius:2px;letter-spacing:.1em}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:8px}
.sc{background:#091120;border:1px solid #17263a;border-radius:2px;padding:3px 2px;text-align:center}
.sc b{display:block;font-size:8px;color:var(--dim);letter-spacing:.1em}
.sc span{display:block;font-size:12px;color:#eaf6ff}
.sc em{display:block;font-size:10px;color:var(--gr);font-style:normal;font-weight:700;margin-top:3px}
.stat-sheet-label{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--dim);font-size:9px;letter-spacing:.08em}
.stat-sheet-label strong{color:var(--gr);font-weight:700}
.sc .grow-label{display:block;font-size:8px;letter-spacing:.04em;color:#8fa7bd;margin-top:2px}
.tsc em{font-size:9px;font-weight:700}
.tsc .grow-label{display:block;font-size:7px;color:#8fa7bd;margin-top:2px}

.fcast{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}
.fcol{flex:1;background:#091120;border:1px solid #17263a;border-radius:3px;padding:7px}
.fcol b{display:block;font-size:11px;color:var(--cy);margin-bottom:5px}
.frow{display:flex;justify-content:space-between;font-size:10px;padding:1px 0}
.frow i{color:var(--dim);font-style:normal}
.frow s{text-decoration:none;color:#eaf6ff}
.fvs{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);gap:4px;padding:0 2px}
.no{font-size:9px;color:var(--dim)}
.adv{color:#041018;background:var(--gr);padding:2px 4px;border-radius:2px;font-size:8px;font-weight:700}
.dis{color:#190608;background:var(--rd);padding:2px 4px;border-radius:2px;font-size:8px;font-weight:700}

#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.rchip{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:6px;text-align:left}
.rchip.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.3)}
.rchip.done{opacity:.45}
.rnm{font-size:10px;color:var(--cy)}
.rlv{font-size:8px;color:var(--dim)}

#log{width:100%;max-width:760px;font-size:9px;color:#5f7489;line-height:1.7;max-height:60px;overflow:hidden}

/* ---------- overlay ---------- */
#overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(3,6,11,.9);
  align-items:center;justify-content:center;padding:14px;overflow:auto}
.obox{width:100%;max-width:560px;background:linear-gradient(180deg,#0c1724,#080e16);
  border:1px solid #27425c;border-radius:5px;padding:16px;box-shadow:0 0 40px rgba(125,249,255,.12)}
.obox h2{font-size:20px;color:var(--cy);text-shadow:0 0 14px rgba(125,249,255,.5)}
.obox h2.dead{color:var(--rd);text-shadow:0 0 14px rgba(255,90,90,.5)}
.osub{font-size:11px;color:var(--dim);margin:8px 0 12px;line-height:1.6}
.lvs{display:grid;gap:5px;margin:12px 0}
.lv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#091120;border:1px solid #17263a;padding:6px 8px;border-radius:3px;font-size:10px}
.lv b{color:var(--cy);font-size:11px;min-width:70px}
.lv span{color:var(--dim);font-size:9px}
.gn{color:#041018!important;background:var(--gr);padding:2px 5px;border-radius:2px;font-weight:700}
.promo{color:#190c02!important;background:var(--am);padding:2px 5px;border-radius:2px;font-weight:700}
.dim{color:var(--dim)}
.rews{display:grid;gap:7px}
.rew{display:block;text-align:left;background:#0b1626;border:1px solid #27425c;color:var(--tx);box-shadow:none;padding:11px}
.rew:hover{border-color:var(--cy)}
.rew b{display:block;color:var(--am);font-size:12px;margin-bottom:3px}
.rew span{display:block;font-size:10px;color:#9ab0c6;letter-spacing:.02em;text-transform:none;font-weight:400;line-height:1.5}
ul.help{display:grid;gap:8px;margin:12px 0;padding-left:16px}
ul.help li{font-size:11px;line-height:1.65;color:#a9bfd4}
ul.help b{color:var(--cy)}
@media(max-width:420px){
  .sgrid{grid-template-columns:repeat(4,1fr)}
  .acts button{min-width:70px;padding:9px 6px;font-size:11px}
  .hmid{flex:1 1 100%;order:3}
}

/* ---------- title extras ---------- */
.tmini{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tmini canvas{width:34px;height:34px;image-rendering:pixelated;
  background:#0b1422;border:1px solid var(--line);border-radius:3px}
.tfoot{margin-top:10px;font-size:9px;letter-spacing:.18em;color:var(--dim)}

/* ---------- squad select ---------- */
#squad-screen{display:none;flex-direction:column;width:100%;max-width:860px}
.sqbox{width:100%;padding-bottom:70px}
.sqhead h2{font-size:20px;color:var(--cy);text-shadow:0 0 14px rgba(125,249,255,.45);text-align:center}
.sqhead .osub{text-align:center;max-width:52ch;margin:8px auto 14px}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:8px}
.sqc{background:linear-gradient(180deg,#0d1725,#0a1118);border:1px solid var(--line);border-radius:4px;padding:10px;
  display:flex;flex-direction:column;gap:6px}
.sqc.on{border-color:var(--cy);box-shadow:0 0 14px rgba(125,249,255,.18)}
.sqtop{display:flex;gap:9px;align-items:flex-start}
.sqtop canvas{width:42px;height:42px;image-rendering:pixelated;flex:none;
  background:#070e18;border:1px solid #16243a;border-radius:3px}
.sqid{min-width:0}
.sqid b{display:block;font-size:14px;color:var(--cy)}
.sqid span{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em}
.sqid i{display:block;font-size:8px;color:#8fa7bd;font-style:normal;margin-top:3px;line-height:1.5}
.sqbio{font-size:9px;color:#6f8699;line-height:1.55}
.sqbtns{display:flex;gap:5px;margin-top:auto}
.sqbtns button{flex:1;padding:8px 4px;font-size:10px}
.sqbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:7px;align-items:center;justify-content:center;
  padding:9px 10px;background:rgba(5,9,15,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.sqcount{font-size:11px;color:var(--dim);letter-spacing:.14em;margin-right:auto}
.sqcount b{color:var(--cy);font-size:15px}

/* ---------- appearance ---------- */
.skinbox{max-width:600px}
.skprev{display:flex;gap:12px;align-items:center;margin:10px 0 4px}
.skprev canvas.big{width:74px;height:74px;image-rendering:pixelated;flex:none;
  background:#070e18;border:1px solid #1d2b40;border-radius:4px}
.skname{display:block;font-size:17px;color:var(--cy)}
.skprev span{font-size:9px;letter-spacing:.14em}
.skprev p{font-size:9px;line-height:1.6;margin-top:6px}
.sklab{display:block;font-size:9px;letter-spacing:.2em;color:var(--dim);margin:14px 0 6px}
#skinname{width:100%;font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cy);background:#070e18;border:1px solid #27425c;border-radius:3px;padding:9px 10px}
#skinname:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.2)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:5px}
.sw{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sw.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.25)}
.sw i{display:inline-block;width:14px;height:8px;border:1px solid #05080d}
.sw i+i{margin-left:-1px}
.sw span{font-size:7px;letter-spacing:.1em;color:var(--dim)}
.sw.on span{color:var(--cy)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:5px}
.ch{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ch.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.25)}
.ch canvas{width:38px;height:38px;image-rendering:pixelated}
.ch span{font-size:7px;letter-spacing:.06em;color:var(--dim)}
.ch.on span{color:var(--cy)}

/* ---------- legend ---------- */
.lgh{font-size:11px;color:var(--am);letter-spacing:.18em;margin:14px 0 8px}
.legend{display:grid;gap:5px}
.lg{display:flex;gap:9px;align-items:center;background:#091120;border:1px solid #17263a;border-radius:3px;padding:6px 8px}
.lg canvas{width:34px;height:34px;image-rendering:pixelated;flex:none;border:1px solid #16243a}
.lg b{display:block;font-size:10px;color:var(--cy);letter-spacing:.1em}
.lg span{display:block;font-size:9px;color:#8fa7bd;line-height:1.5}
@media(max-width:420px){
  .sqgrid{grid-template-columns:1fr}
  .swgrid{grid-template-columns:repeat(4,1fr)}
  .chgrid{grid-template-columns:repeat(4,1fr)}
}

/* ---------- online ---------- */
.netform{max-width:420px;margin:0 auto}
.netform input{width:100%;font-family:var(--mono);font-size:18px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cy);background:#070e18;border:1px solid #27425c;border-radius:3px;padding:11px 12px;text-align:center}
.netform input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.2)}
.neterr{font-size:10px;color:var(--rd);margin-top:10px;text-align:center;letter-spacing:.08em}
.plrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.plr{background:#0b1626;border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.plr.you{border-color:var(--cy)}
.plr b{display:block;font-size:13px;color:var(--cy)}
.plr span{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em}
.plr .rdy{color:var(--gr)}
.vsmenu{display:grid;gap:8px;max-width:460px;margin:0 auto}
.vopt{display:block;text-align:left;background:#0b1626;border:1px solid #27425c;color:var(--tx);box-shadow:none;padding:13px}
.vopt:hover{border-color:var(--cy)}
.vopt b{display:block;color:var(--cy);font-size:14px;margin-bottom:4px}
.vopt span{display:block;font-size:10px;color:#9ab0c6;letter-spacing:.02em;text-transform:none;font-weight:400;line-height:1.5}
.codebig{font-size:34px;letter-spacing:.3em;color:var(--cy);text-align:center;padding:14px 8px 10px;
  background:#070e18;border:1px solid #27425c;border-radius:4px;text-shadow:0 0 16px rgba(125,249,255,.45)}
.netnote{font-size:9px;color:var(--dim);line-height:1.6;margin-top:12px;text-align:center}
.handoff{text-align:center;padding:10px 6px}
.handoff b{display:block;font-size:20px;color:var(--cy);letter-spacing:.14em;margin-bottom:6px}
.handoff span{display:block;font-size:10px;color:var(--dim);margin-bottom:12px}
.sqc.taken{opacity:.5}
.sqc.taken .sqid b{color:#7f93a8}
.owner-legend{display:flex;flex-wrap:wrap;gap:5px 14px;padding:6px 8px;background:#0c1420;border:1px solid #1d2b40;border-radius:4px;font-size:10px}
#owner-legend:empty{display:none}

.route-wallet{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:8px;padding:9px;background:#151c29;border:1px solid #675735;border-radius:6px;color:#ffd166;font-size:12px}.route-wallet span{font-size:9px;color:#c6b181}.route-map{padding:14px 8px;background:radial-gradient(ellipse at top,#19334b,#070e17);border:1px solid #34526b;border-radius:8px;text-align:center}.route-start{display:inline-block;padding:9px 12px;border:1px solid #54f0c8;border-radius:20px;color:#54f0c8;font-size:10px;font-weight:bold}.route-start.next{color:#7df9ff;border-color:#7df9ff}.route-branch,.route-merge{height:28px;width:50%;margin:auto;border:1px dashed #69869d;border-bottom:0;border-radius:10px 10px 0 0;position:relative}.route-merge{transform:rotate(180deg)}.route-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.route-choices .rew{text-align:center;min-width:0;padding:12px 7px;border-color:#527993;background:linear-gradient(#142b3e,#0b1524)}.route-choices i{font-style:normal;font-size:28px;color:#7df9ff;display:block;margin-bottom:7px}.route-all,.wheel-key{font-size:9px;line-height:1.7;color:#a9bfd4;text-align:center;margin:12px 0}.route-title{color:#ffd166;margin:12px 0 0}.route-result{padding:12px;border:1px solid #3d846c;background:#0c2822;color:#b8ffdb;border-radius:6px;font-size:12px;margin:10px 0;line-height:1.6}.route-item{border:1px solid #27425c;border-radius:5px;padding:9px;margin:6px 0;background:#091120;font-size:11px}.route-item>b{color:#54f0c8;display:block}.route-item>span{display:block;color:#ffd166;font-size:10px;margin:5px 0}.route-buy{display:flex;flex-wrap:wrap;gap:4px}.route-buy .rew{padding:6px;font-size:9px}.obox>.rew{width:100%;margin:4px 0}.route-inventory{margin-top:12px;color:#9ab0c6;font-size:10px;line-height:1.7}.route-inventory summary{cursor:pointer;color:#7df9ff}.fortune-wheel{margin:18px auto;width:145px;height:145px;border:5px solid #dfba70;border-radius:50%;background:conic-gradient(#b74150 0deg 54deg,#7058ba 54deg 72deg,#c5a245 72deg 252deg,#289c76 252deg 306deg,#427db1 306deg 324deg,#687585 324deg 360deg);display:grid;place-items:center;box-shadow:0 0 20px #dfba7040;position:relative}.fortune-wheel-wrap{position:relative;width:145px;margin:18px auto}.fortune-wheel-wrap .fortune-wheel{margin:0}.fortune-wheel-wrap::before{content:"▼";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;z-index:2}.fortune-wheel span{font-size:30px;color:#fff;text-shadow:0 2px 3px #000}.fortune-wheel.landed{animation:route-spin .9s ease-out both}@keyframes route-spin{to{transform:rotate(var(--spin))}}.route-chest{text-align:center;color:#ffd166;font-size:75px;text-shadow:0 0 24px #ffd16655;margin:12px}
/* High-detail customization */
.skinbox{max-width:660px;max-height:calc(100dvh - 28px);overflow:auto;overscroll-behavior:contain}
.skprev{align-items:center;gap:16px}
.skprev canvas.big{width:144px;height:144px;background:radial-gradient(ellipse at center,#21344b,#080e18 76%);border-color:#27425c;box-shadow:inset 0 0 24px #03060c}
.skname{overflow-wrap:anywhere;font-size:19px}.sqid b,.unm,.rnm{overflow-wrap:anywhere}.sqtop canvas{width:54px;height:54px}.ch canvas{width:48px;height:48px}

.partpick{display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;align-items:center;gap:3px 7px;background:#091120;border:1px solid #24354b;padding:7px;border-radius:4px;cursor:pointer;min-width:0}

function mkUnit(def, side, lvl, opt) {
  opt = opt || {};
  var look;
  if (opt.look) look = safeLook(opt.look,def);
  else if (side === 'ply' && !opt.fair) look = lookOf(def.key || def.name, def);
  else look = { name: def.name, spr: def.spr, pal: def.pal };
  var u = {
    id: S.uid++, key: def.key || def.name, name: look.name, cls: def.cls || def.name,
    promo: def.promo || null, spr: look.spr, pal: look.pal, side: side, mark: opt.mark || 0,
    mov: def.mov, lvl: 1, exp: 0, x: 0, y: 0, px: 0, py: 0,
    stats: {}, grow: {}, bio: def.bio || '', acted: false, promoted: false,
    wpn: mkWpn(def.wpn, opt.plus || 0), traits: [], boss: !!opt.boss,
    ai: def.ai || 'hunt', flash: 0
  };
  for (var i = 0; i < STATK.length; i++) { u.stats[STATK[i]] = def.base[STATK[i]]; u.grow[STATK[i]] = def.grow[STATK[i]]; }
  /* deterministic scaling to a target level: expected growth, accumulated */
  var target = Math.max(1, lvl || 1);
  if (target > 1) {
    var steps = target - 1, fac = (side === 'foe' && !opt.fair) ? 0.95 : 1;
    for (var j = 0; j < STATK.length; j++) {
      var k = STATK[j];
      u.stats[k] += Math.round(u.grow[k] / 100 * steps * fac);
    }
    u.lvl = target;
  }
  /* past the level cap, hostiles escalate in marks instead of levels */
  if (u.mark > 0) {
    /* marks make hostiles deadlier faster than they make them unkillable,
       so player damage stays meaningful however deep the run goes */
    var MKG = { hp: 6, str: 2, mag: 2, skl: 2, spd: 2, def: 1, res: 1, lck: 1 };
    for (var m = 0; m < STATK.length; m++) {
      var mk = STATK[m];
      u.stats[mk] += u.mark * MKG[mk];
    }
    u.name = u.name + ' MK-' + roman(u.mark + 1);
  }
  if (opt.boss) { u.stats.hp = Math.round(u.stats.hp * (opt.bossHp || 1.35)); }
  u.chp = u.stats.hp;
  return u;
}

function roman(n) {
  var map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']], out = '';
  if (n > 39) return '' + n;
  while (n > 0) for (var i = 0; i < map.length; i++) if (n >= map[i][0]) { out += map[i][1]; n -= map[i][0]; break; }
  return out;
}

function unitAt(x, y) {
  for (var i = 0; i < S.units.length; i++) { var u = S.units[i]; if (u.chp > 0 && u.x === x && u.y === y) return u; }
  return null;
}
function allies(side) { return S.units.filter(function (u) { return u.chp > 0 && u.side === side; }); }
function foesOf(side) { return S.units.filter(function (u) { return u.chp > 0 && u.side !== side; }); }

function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

/* ================= MAP GEN ================= */
/* ---- layout bag: no layout repeats until its terrain's ten are all used ---- */
function shuffled(n) {
  var a = [], i, j, t;
  for (i = 0; i < n; i++) a.push(i);
  for (i = n - 1; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function drawLayout(ti) {
  if (!S.bags) S.bags = [];
  if (!S.bags[ti] || !S.bags[ti].length) S.bags[ti] = shuffled(LAYOUTS[ti].length);
  return S.bags[ti].pop();
}
function buildGrid(ti, li) {
  var rows = LAYOUTS[ti][li], g = [], x, y;
  for (y = 0; y < MAPH; y++) {
    g[y] = [];
    for (x = 0; x < MAPW; x++) g[y][x] = LCH[rows[y].charAt(x)] || 'floor';
  }

}
function genMap(ch) {
  var ti = themeIdx(ch);
  var li = (S.resumeLayout !== null && S.resumeLayout !== undefined) ? S.resumeLayout : drawLayout(ti);
  S.resumeLayout = null;
  S.layout = li; S.terrain = ti;

}

function openTiles(fromX, fromY) {
  var seen = {}, q = [[fromX, fromY]];
  seen[fromX + ',' + fromY] = 1;
  while (q.length) {
    var c = q.shift(), d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = 0; i < 4; i++) {
      var nx = c[0] + d[i][0], ny = c[1] + d[i][1], k = nx + ',' + ny;
      if (inBounds(nx, ny) && !seen[k] && !ter(nx, ny).block) { seen[k] = 1; q.push([nx, ny]); }
    }
  }
  return seen;
}

/* ================= PATHFINDING ================= */
function reachable(u) {
  var best = {}, start = u.x + ',' + u.y;
  best[start] = 0;
  var frontier = [{ x: u.x, y: u.y, c: 0 }];
  while (frontier.length) {
    frontier.sort(function (a, b) { return a.c - b.c; });
    var n = frontier.shift();
    var d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = 0; i < 4; i++) {
      var nx = n.x + d[i][0], ny = n.y + d[i][1];
      if (!inBounds(nx, ny)) continue;
      var t = ter(nx, ny); if (t.block) continue;
      var occ = unitAt(nx, ny);
      if (occ && occ.side !== u.side) continue;
      var nc = n.c + t.cost;
      if (nc > u.mov) continue;
      var k = nx + ',' + ny;
      if (best[k] === undefined || nc < best[k]) { best[k] = nc; frontier.push({ x: nx, y: ny, c: nc }); }
    }
  }
  /* strip tiles occupied by allies (can pass, cannot stop) */
  var out = {};
  for (var k2 in best) {
    var p = k2.split(','), ox = +p[0], oy = +p[1];
    if (ox === u.x && oy === u.y) { out[k2] = best[k2]; continue; }
    if (!unitAt(ox, oy)) out[k2] = best[k2];
  }
  return out;
}

function pathTo(u, tx, ty) {
  var prev = {}, best = {}, start = u.x + ',' + u.y;
  best[start] = 0;
  var frontier = [{ x: u.x, y: u.y, c: 0 }];
  while (frontier.length) {
    frontier.sort(function (a, b) { return a.c - b.c; });
    var n = frontier.shift();
    if (n.x === tx && n.y === ty) break;
    var d = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    for (var i = 0; i < 4; i++) {
      var nx = n.x + d[i][0], ny = n.y + d[i][1];
      if (!inBounds(nx, ny)) continue;
      var t = ter(nx, ny); if (t.block) continue;
      var occ = unitAt(nx, ny); if (occ && occ.side !== u.side) continue;
      var nc = n.c + t.cost;
      if (nc > u.mov) continue;
      var k = nx + ',' + ny;
      if (best[k] === undefined || nc < best[k]) { best[k] = nc; prev[k] = n.x + ',' + n.y; frontier.push({ x: nx, y: ny, c: nc }); }
    }
  }
  var key = tx + ',' + ty;

  var path = [], cur = key;
  while (cur !== start) { var pp = cur.split(','); path.unshift({ x: +pp[0], y: +pp[1] }); cur = prev[cur]; }
  return path;
}

/* distance field over terrain from one tile, ignoring units.
   greedy Manhattan approach gets enemies wedged behind bulkheads forever,
   so navigation uses real path cost instead. */
function distField(tx, ty) {
  var best = {}, frontier = [{ x: tx, y: ty, c: 0 }];
  best[tx + ',' + ty] = 0;
  while (frontier.length) {
    frontier.sort(function (a, b) { return a.c - b.c; });
    var n = frontier.shift();
    var d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = 0; i < 4; i++) {
      var nx = n.x + d[i][0], ny = n.y + d[i][1];
      if (!inBounds(nx, ny)) continue;
      var t = ter(nx, ny); if (t.block) continue;
      var nc = n.c + t.cost, k = nx + ',' + ny;
      if (best[k] === undefined || nc < best[k]) { best[k] = nc; frontier.push({ x: nx, y: ny, c: nc }); }
    }
  }
  return best;
}

/* tiles a unit may attack from any reachable tile */
function attackTiles(u, reach) {
  var w = u.wpn, out = {};
  for (var k in reach) {
    var p = k.split(','), ox = +p[0], oy = +p[1];
    for (var dx = -w.rmax; dx <= w.rmax; dx++) {
      for (var dy = -w.rmax; dy <= w.rmax; dy++) {
        var d = Math.abs(dx) + Math.abs(dy);
        if (d < w.rmin || d > wRange(u)) continue;
        var tx = ox + dx, ty = oy + dy;
        if (inBounds(tx, ty)) out[tx + ',' + ty] = 1;
      }
    }
  }
  return out;
}
function wRange(u) { return u.wpn.rmax + (u.traits.indexOf('marksman') >= 0 && u.wpn.rmax > 1 ? 1 : 0); }
function canReachTarget(u, t) {
  var d = dist(u, t);
  return d >= u.wpn.rmin && d <= wRange(u);
}

/* ================= COMBAT MATH ================= */
function spdOf(u) { return u.stats.spd + (u.traits.indexOf('overclock') >= 0 ? 3 : 0); }
function avoidOf(u) {
  var t = ter(u.x, u.y);
  return spdOf(u) * 2 + u.stats.lck + t.avo + (shrineBonus(u,'focus')?10:0) + (u.traits.indexOf('overclock') >= 0 ? 10 : 0);
}
function forecast(a, d) {
  var w = a.wpn, mag = w.mag;
  var atk = (mag ? a.stats.mag : a.stats.str) + w.mt + (shrineBonus(a,'power')?2:0);
  var tt = ter(d.x, d.y);
  var dv = (mag ? d.stats.res : d.stats.def + tt.def)+(shrineBonus(d,'guard')?2:0);
  var tri = triangle(w.type, d.wpn.type);
  var dmg = Math.max(0, atk + tri.dmg - dv - (d.traits.indexOf('shield') >= 0 ? 3 : 0));
  /* accuracy from a compressed skill-vs-evasion gap, so the curve stays sane
     forever instead of saturating at 100 / decaying to nothing */
  var off = a.stats.skl * 2 + Math.floor(a.stats.lck / 2);
  var gap = off - avoidOf(d);
  var comp = Math.round(42 * gap / (Math.abs(gap) + 26));
  var hit = clamp(w.hit + comp + tri.hit + (shrineBonus(a,'focus')?15:0) + (a.traits.indexOf('marksman') >= 0 ? 15 : 0), 5, 100);
  var crit = clamp(w.crit + Math.floor(a.stats.skl / 2) - d.stats.lck, 0, 60);
  var dbl = spdOf(a) >= spdOf(d) + 4;
  return { dmg: dmg, hit: Math.round(hit), crit: Math.round(crit), dbl: dbl, tri: tri };
}
function canCounter(d, a) {
  if (d.chp <= 0) return false;
  if (d.wpn.heal) return false;
  var dd = dist(a, d);
  return dd >= d.wpn.rmin && dd <= wRange(d);
}

function strike(a, d) {
  var f = forecast(a, d);
  if (rnd() * 100 >= f.hit) { fxText(d, 'MISS', '#9fb0c4'); return { hit: false }; }
  var crit = rnd() * 100 < f.crit;
  var dmg = crit ? f.dmg * 3 : f.dmg;
  d.chp = Math.max(0, d.chp - dmg);
  d.flash = 1;
  S.shake = Math.max(S.shake, crit ? 7 : 3);
  fxText(d, (crit ? '!' : '') + dmg, crit ? '#ffe066' : (d.side === 'ply' ? '#ff6a6a' : '#ffffff'));
  fxHit(d);
  return { hit: true, crit: crit, dmg: dmg, dead: d.chp <= 0 };
}

function doCombat(a, d) {
  var expA = 0, kills = 0;
  var fa = forecast(a, d);
  var r = strike(a, d);
  expA += r.hit ? 10 : 2;
  if (d.chp <= 0) { kills++; }
  else {
    if (canCounter(d, a)) {
      var r2 = strike(d, a);
      if (a.chp <= 0) { onDeath(a, d); return finishCombat(a, d, expA, kills); }
      if (!r2.hit) { } // nothing
      var fd = forecast(d, a);
      if (fd.dbl && a.chp > 0) { strike(d, a); if (a.chp <= 0) { onDeath(a, d); return finishCombat(a, d, expA, kills); } }
    }
    if (fa.dbl && d.chp > 0 && a.chp > 0) {
      var r3 = strike(a, d);
      expA += r3.hit ? 8 : 2;
      if (d.chp <= 0) kills++;
    }
  }
  if (d.chp <= 0) onDeath(d, a);
  return finishCombat(a, d, expA, kills);
}
function finishCombat(a, d, expA, kills) {
  if (a.side !== 'ply') return true;
  var lvlDiff = Math.max(0, d.lvl - a.lvl);
  var gain = 0;
  if (a.chp > 0) {
    gain = expA + lvlDiff * 3 + (kills ? 48 + lvlDiff * 8 : 0);
    if (kills && d.boss) gain += 70;
    grantExp(a, Math.round(gain));
  }
  /* the rest of the squad learns from the engagement too, so the roster
     levels together instead of one carry outpacing everyone */
  if (kills) {
    var share = Math.round((48 + lvlDiff * 8 + (d.boss ? 70 : 0)) * 0.4);
    var mates = allies('ply');
    for (var i = 0; i < mates.length; i++) if (mates[i].id !== a.id) grantExp(mates[i], share);
  }
  return true;
}

function onDeath(u, killer) {
  say(u.name + (u.side === 'ply' ? ' is DOWN.' : ' destroyed.'));
  fxBoom(u);
  S.shake = 9;
  if (u.traits.indexOf('volatile') >= 0) {
    var d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (var i = 0; i < 4; i++) {
      var t = unitAt(u.x + d[i][0], u.y + d[i][1]);
      if (t && t.chp > 0) {
        var dmg = 6 + Math.floor(S.chapter / 2);
        t.chp = Math.max(0, t.chp - dmg); fxText(t, dmg, '#ff8a3a');
        if (t.chp <= 0) onDeath(t, u);
      }
    }
  }
  if (u.side === 'ply') S.dead.push({ name: u.name, cls: u.cls, lvl: u.lvl, def: u.key,
    chapter: S.chapter, owner: u.owner || '' });
}

/* ================= EXP / LEVELS ================= */
function atMax(u) { return u.lvl >= MAXLVL; }
/* at the cap, combat experience no longer buys levels: it is spent on single
   stat points instead, still weighted by the growths that define the unit */
function overdrive(u, amt) {
  u.over = (u.over || 0) + amt;
  while (u.over >= 120) {
    u.over -= 120;
    var total = 0, i, k;
    for (i = 0; i < STATK.length; i++) total += u.grow[STATK[i]];
    if (total <= 0) return;
    var roll = rnd() * total, acc = 0, pickK = STATK[0];
    for (i = 0; i < STATK.length; i++) { k = STATK[i]; acc += u.grow[k]; if (roll <= acc) { pickK = k; break; } }
    u.stats[pickK] += 1;
    if (pickK === 'hp') u.chp += 1;
    S.levelups.push({ name: u.name, lvl: u.lvl, gains: {}, over: pickK, pal: u.pal, spr: u.spr });
    fxText(u, 'OVERDRIVE', '#ffd166');
  }
}
function grantExp(u, amt) {
  if (atMax(u)) { u.exp = 0; overdrive(u, amt); return; }
  u.exp += amt;
  while (u.exp >= 100) {
    u.exp -= 100;
    levelUp(u);
    if (atMax(u)) { u.exp = 0; break; }
  }
}
function levelUp(u) {
  if (atMax(u)) return;
  u.lvl++;
  var gains = {};
  for (var i = 0; i < STATK.length; i++) {
    var k = STATK[i], g = u.grow[k];
    var n = 0;
    while (g >= 100) { n++; g -= 100; }
    if (rnd() * 100 < g) n++;
    if (n) { u.stats[k] += n; gains[k] = n; }
  }
  if (gains.hp) u.chp += gains.hp;
  if (!Object.keys(gains).length) gains.none = 1;
  if (u.lvl >= PROMOLVL && !u.promoted && u.promo) {
    u.promoted = true; u.cls = u.promo; u.mov += 1;
    u.stats.hp += 4; u.chp += 4;
    var bst = STATK.slice(1).sort(function (a, b) { return u.grow[b] - u.grow[a]; });
    u.stats[bst[0]] += 2; u.stats[bst[1]] += 2;
    gains.promo = u.promo;
  }
  S.levelups.push({ name: u.name, lvl: u.lvl, gains: gains, pal: u.pal, spr: u.spr });
  fxText(u, 'LV UP', '#b6ff6a');
  say(u.name + ' reached level ' + u.lvl + '.');
}

/* ================= FX ================= */
function fxPush(o) { if (HEADLESS) return; if (S.fx.length > 40) S.fx.splice(0, S.fx.length - 40); S.fx.push(o); }
function fxText(u, txt, col) { fxPush({ k: 'txt', x: u.x, y: u.y, t: 0, dur: 0.85, txt: '' + txt, col: col }); }
function fxHit(u) { fxPush({ k: 'hit', x: u.x, y: u.y, t: 0, dur: 0.3 }); }
function fxBoom(u) { fxPush({ k: 'boom', x: u.x, y: u.y, t: 0, dur: 0.5, pal: u.pal }); }
function fxHeal(u) { fxPush({ k: 'heal', x: u.x, y: u.y, t: 0, dur: 0.6 }); }

/* ================= ACTIONS ================= */
function healPower(u) { return u.stats.mag + 8 + u.wpn.plus * 2; }

function doHeal(a, t) {
  var amt = Math.min(healPower(a), t.stats.hp - t.chp);
  t.chp += amt;
  fxText(t, '+' + amt, '#54f0c8'); fxHeal(t);
  say(a.name + ' repaired ' + t.name + ' for ' + amt + '.');
  grantExp(a, Math.max(20, 26 + Math.floor(amt / 2)));
}
function useKit(u) {
  if (S.kits <= 0) return;
  S.kits--;
  var amt = Math.min(20, u.stats.hp - u.chp);
  u.chp += amt; fxText(u, '+' + amt, '#54f0c8'); fxHeal(u);
  say(u.name + ' used a repair kit (+' + amt + ').');
}

function moveUnit(u, path, cb) {
  if (!path || !path.length) { if (cb) cb(); return; }
  var last = path[path.length - 1];
  if (HEADLESS) { u.x = last.x; u.y = last.y; u.px = last.x; u.py = last.y; if (cb) cb(); return; }
  S.busy++;
  S.movers.push({ u: u, path: path, i: 0, t: 0, fx: u.x, fy: u.y, cb: function () { S.busy--; if (cb) cb(); } });
}

/* ================= AI ================= */
function aiScore(u, tile, t) {
  var save = { x: u.x, y: u.y };
  u.x = tile.x; u.y = tile.y;
  var f = forecast(u, t);
  var hits = (f.dbl ? 2 : 1);
  var expect = Math.min(t.chp, f.dmg * hits) * (f.hit / 100);
  var sc = expect * 3;
  if (expect >= t.chp) sc += 60;
  /* machines learn to hunt the medic, but not from the very first skirmish */
  if (t.wpn && t.wpn.heal) sc += Math.min(12, 2 + S.chapter * 0.8);
  if (canCounter(t, u)) {
    var fc = forecast(t, u);
    sc -= Math.min(u.chp, fc.dmg * (fc.dbl ? 2 : 1)) * (fc.hit / 100) * 1.6;
    if (fc.dmg * (fc.dbl ? 2 : 1) >= u.chp) sc -= 45;
  }
  var tt = ter(tile.x, tile.y);
  sc += tt.def * 2 + tt.avo * 0.1;
  if (tt.burn) sc -= 14;
  u.x = save.x; u.y = save.y;
  return sc;
}

function aiAct(u, done) {
  if (u.chp <= 0) { done(); return; }
  var reach = reachable(u);
  var enemies = foesOf(u.side);
  var isHealer = !!u.wpn.heal;

  /* healer logic first */
  if (isHealer) {
    var hurt = allies(u.side).filter(function (a) { return a.id !== u.id && a.chp < a.stats.hp * 0.75; })
      .sort(function (a, b) { return (a.chp / a.stats.hp) - (b.chp / b.stats.hp); });
    if (hurt.length) {
      var tgt = hurt[0], bestT = null, bestD = 1e9;
      for (var k in reach) {
        var p = k.split(','), ox = +p[0], oy = +p[1];
        var d = Math.abs(ox - tgt.x) + Math.abs(oy - tgt.y);
        if (d >= u.wpn.rmin && d <= wRange(u)) {
          if (d < bestD) { bestD = d; bestT = { x: ox, y: oy }; }
        }
      }
      if (bestT) {
        moveUnit(u, pathTo(u, bestT.x, bestT.y), function () { doHeal(u, tgt); u.acted = true; done(); });
        return;
      }
    }
  }

  /* best attack */
  var best = null;
  for (var kk in reach) {
    var pp = kk.split(','), tx = +pp[0], ty = +pp[1];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      var dd = Math.abs(tx - e.x) + Math.abs(ty - e.y);
      if (dd < u.wpn.rmin || dd > wRange(u)) continue;
      if (u.wpn.heal) continue;
      var sc = aiScore(u, { x: tx, y: ty }, e);
      if (!best || sc > best.sc) best = { sc: sc, x: tx, y: ty, e: e };
    }
  }
  function engage() {
    moveUnit(u, pathTo(u, best.x, best.y), function () {
      if (best.e.chp > 0 && u.chp > 0) doCombat(u, best.e);
      u.acted = true; done();
    });
  }
  /* machines trade willingly, and grow less patient as the fight drags on.
     without this a wounded enemy would decline every attack and freeze the map. */
  if (best && best.sc > (-30 - S.turn * 6)) { engage(); return; }

  /* guard behaviour: stay unless someone is close */
  var nearest = null, nd = 1e9;
  for (var j = 0; j < enemies.length; j++) { var d2 = dist(u, enemies[j]); if (d2 < nd) { nd = d2; nearest = enemies[j]; } }
  if (!nearest) { u.acted = true; done(); return; }
  /* commanders hold position early, then come for you: no endless standoffs */
  if (u.ai === 'guard' && nd > 5 && S.turn < 8) { u.acted = true; done(); return; }

  /* approach along real path cost, so walls are routed around, not into */
  var fld = distField(nearest.x, nearest.y);
  var pick = null, pd = 1e9;
  for (var k3 in reach) {
    var p3 = k3.split(','), ax = +p3[0], ay = +p3[1];
    var d3 = fld[k3];
    if (d3 === undefined) d3 = Math.abs(ax - nearest.x) + Math.abs(ay - nearest.y) + 50;
    var t3 = ter(ax, ay);
    var pen = (t3.burn ? 4 : 0) - t3.def * 0.3;
    if (d3 + pen < pd) { pd = d3 + pen; pick = { x: ax, y: ay }; }
  }
  if (pick && (pick.x !== u.x || pick.y !== u.y)) {
    moveUnit(u, pathTo(u, pick.x, pick.y), function () { u.acted = true; done(); });
    return;
  }
  /* nowhere better to stand: if anything is in reach, swing at it */
  if (best) { engage(); return; }
  u.acted = true; done();
}

/* ================= CHAPTER SETUP ================= */
var OBJS = {
  wipe:   { name: 'PURGE', desc: 'Destroy every hostile.' },
  boss:   { name: 'DECAPITATE', desc: 'Destroy the commander.' },
  hold:   { name: 'HOLD', desc: 'Survive the assault.' }
};
var SITES = ['ORBITAL DOCK', 'COOLANT SPINE', 'RELAY VAULT', 'ASH FOUNDRY', 'SIGNAL GARDEN', 'CARRIER HULK',
  'MAG-RAIL YARD', 'DEEP ARCHIVE', 'SLAG TERRACE', 'BLACK CHAPEL', 'DRIFT NURSERY', 'VOID SPILLWAY'];

function foeLevel(ch) { return Math.min(MAXLVL, 1 + Math.floor((ch - 1) * 1.3)); }
/* once hostiles hit the level cap they escalate in marks instead */
function foeMark(ch) { var over = ch - 15; return over <= 0 ? 0 : Math.ceil(over / 4); }
/* Threat budget uses the original deployed unit count, not the current survivors.
   Every extra starting operative adds at least one hostile in every chapter. */
function startingSquadSize() {
  return Math.max(1, Math.min(8, Math.floor(Number(S.squadSize) || 1)));
}
function foeCount(ch, squadSize) {
  var sq = squadSize === undefined ? startingSquadSize() : Math.max(1, Math.min(8, Math.floor(Number(squadSize) || 1)));
  var escalation = Math.min(9, Math.max(0, Math.floor((ch - 1) * 0.55)));
  return sq + 1 + Math.round(escalation * (0.45 + 0.11 * sq));
}
function reinforcementCount(ch) {
  return Math.min(12, 1 + Math.floor((startingSquadSize() - 1) / 2) + Math.floor(ch / 7));
}
function wpnPlus(ch) { return Math.min(14, Math.floor((ch - 1) / 2.5)); }
function traitChance(ch) { return ch < 9 ? 0 : Math.min(0.65, (ch - 8) * 0.07); }

function foePool(ch) {
  var pool = [];
  for (var k in FOES) if (FOES[k].from <= ch) pool.push(k);
  return pool;
}

function placeNear(x, y, used) {
  for (var r = 0; r < 9; r++) {
    for (var dx = -r; dx <= r; dx++) for (var dy = -r; dy <= r; dy++) {
      var nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (!inBounds(nx, ny) || used[k]) continue;
      if (ter(nx, ny).block) continue;
      if (unitAt(nx, ny)) continue;
      used[k] = 1; return { x: nx, y: ny };
    }
  }
  return { x: x, y: y };
}

function startChapter() {
  var ch = S.chapter;
  S.grid = genMap(ch);
  RNG.seed(Math.floor(rnd() * 2000000000) + 1);
  S.turn = 1; S.phase = 'player'; S.sel = null; S.mode = 'idle';
  S.fx = []; S.movers = []; S.busy = 0; S.levelups = []; S.rewards = null; S.inspect = null;
  S.obj = ch % 5 === 0 ? 'boss' : (ch > 3 && RNG.chance(0.22) ? 'hold' : 'wipe');
  S.objTurns = 4 + Math.floor(ch / 4);
  var th = themeOf(ch);
  S.site = th.name + ' / ' + th.sites[S.layout % th.sites.length];
  S.reinforce = [];

  /* keep survivors, clear foes */
  S.units = S.units.filter(function (u) { return u.side === 'ply' && u.chp > 0; });
  var used = {};
  /* player spawn: left edge, reachable column */
  var slots = [];
  for (var y = 0; y < MAPH; y++) for (var x = 0; x < 3; x++) if (!ter(x, y).block) slots.push({ x: x, y: y });
  for (var i = 0; i < S.units.length; i++) {
    var sp = slots[(i * 3 + 1) % slots.length];
    var pos = placeNear(sp.x, sp.y, used);
    var u = S.units[i];
    u.x = pos.x; u.y = pos.y; u.px = pos.x; u.py = pos.y; u.acted = false; u.flash = 0;
    if (ch > 1) u.chp = Math.min(u.stats.hp, u.chp + Math.ceil(u.stats.hp * 0.6));
  }
  var anchor = { x: 1, y: Math.floor(MAPH / 2) };
  var open = openTiles(S.units.length ? S.units[0].x : anchor.x, S.units.length ? S.units[0].y : anchor.y);

  /* foes */
  var pool = foePool(ch), lvl = foeLevel(ch), n = foeCount(ch), plus = wpnPlus(ch), tc = traitChance(ch);
  var mark = foeMark(ch);
  if (S.obj === 'boss') n = Math.max(1, n - 2); /* one commander joins the escorts */
  var tkeys = Object.keys(TRAITS);
  function spawnFoe(def, isBoss, lv) {
    var f = mkUnit(def, 'foe', lv, { plus: plus, boss: isBoss, mark: mark > 0 ? mark + (isBoss ? 1 : 0) : 0,
      bossHp: isBoss ? (1.1 + Math.min(0.5, ch * 0.012)) : 1 });
    if (tc > 0 && RNG.chance(isBoss ? Math.min(0.9, tc + 0.3) : tc)) {
      f.traits.push(tkeys[RNG.int(tkeys.length)]);
      if (isBoss && RNG.chance(0.4)) { var t2 = tkeys[RNG.int(tkeys.length)]; if (f.traits.indexOf(t2) < 0) f.traits.push(t2); }
    }
    if (f.traits.indexOf('marksman') >= 0 && f.wpn.rmax < 2) f.traits.splice(f.traits.indexOf('marksman'), 1);
    /* early on the machines hold their ground, so there is room to learn to bait
       and pick fights. from chapter four they come for you. */
    if (!isBoss && ch <= 3) f.ai = 'guard';
    /* find a spot on the far side that the squad can actually reach */
    for (var t = 0; t < 400; t++) {
      var sx = RNG.range(Math.floor(MAPW * 0.45), MAPW - 1), sy = RNG.range(0, MAPH - 1);
      var k = sx + ',' + sy;
      if (used[k] || ter(sx, sy).block || !open[k] || unitAt(sx, sy)) continue;
      used[k] = 1; f.x = sx; f.y = sy; f.px = sx; f.py = sy;
      S.units.push(f); return f;
    }
    /* Crowded boards: use any reachable free tile, farthest from the squad first. */
    var free = Object.keys(open).map(function (k) {
      var a = k.split(','); return { x: +a[0], y: +a[1], k: k };
    }).filter(function (p) { return !used[p.k] && !ter(p.x, p.y).block && !unitAt(p.x, p.y); });
    free.sort(function (a, b) { return b.x - a.x || Math.abs(a.y - MAPH / 2) - Math.abs(b.y - MAPH / 2); });
    if (!free.length) return null;
    var p = free[0]; used[p.k] = 1;
    f.x = p.x; f.y = p.y; f.px = p.x; f.py = p.y; S.units.push(f); return f;
  }
  if (S.obj === 'boss') {
    var bd = BOSSES[(Math.floor(ch / 5) - 1) % BOSSES.length];
    var b = spawnFoe(bd, true, Math.min(MAXLVL, lvl + 1 + Math.floor(ch / 10)));
    if (b) { b.boss = true; S.bossId = b.id; say('Commander detected: ' + b.name + '.'); }
    else { S.obj = 'wipe'; S.bossId = null; }
  } else S.bossId = null;
  var magPool = pool.filter(function (p) { return WPN[FOES[p].wpn].mag; });
  var magWant = magPool.length ? Math.max(1, Math.round(n * 0.28)) : 0;
  for (var j = 0; j < n; j++) {
    var pick;
    if (j < magWant) pick = magPool[RNG.int(magPool.length)];
    else pick = pool[RNG.int(pool.length)];
    spawnFoe(FOES[pick], false, lvl);
  }
  if (S.obj === 'hold') {
    var waves = 1 + Math.floor(ch / 8);
    for (var w = 1; w <= waves; w++) S.reinforce.push({ turn: 1 + w * 2, n: reinforcementCount(ch) });
  }

  S.screen = 'map'; S.gameover = false;
  S.banner = 'CHAPTER ' + ch; S.bannerT = 1.6;
  say('--- CHAPTER ' + ch + ': ' + S.site + ' / ' + OBJS[S.obj].name + ' ---');
  if (NET.local) { NET.localActive = 0; S.handoff = localOwners().length > 1; }
  saveGame();
  netSync();
}

function spawnReinforcements(n) {
  var pool = foePool(S.chapter), lvl = foeLevel(S.chapter), plus = wpnPlus(S.chapter);
  var players = allies('ply'), spawned = 0;
  if (!players.length) return;
  var open = openTiles(players[0].x, players[0].y), free = [];
  for (var y = 0; y < MAPH; y++) for (var x = MAPW - 3; x < MAPW; x++) {
    if (!ter(x, y).block && !unitAt(x, y) && open[x + ',' + y]) free.push({ x:x, y:y });
  }
  while (spawned < n && free.length) {
    var pos = free.splice(RNG.int(free.length), 1)[0];
    var f = mkUnit(FOES[pool[RNG.int(pool.length)]], 'foe', lvl, { plus: plus, mark: foeMark(S.chapter) });
    f.x = pos.x; f.y = pos.y; f.px = pos.x; f.py = pos.y; S.units.push(f); spawned++;
  }
  if (spawned) {
    say('Reinforcements inbound (' + spawned + ').');
    S.banner = 'REINFORCEMENTS'; S.bannerT = 1.2;
  }
}

/* ================= TURN FLOW ================= */
function phaseStart(side) {
  var list = allies(side);
  for (var i = 0; i < list.length; i++) {
    var u = list[i]; u.acted = false;
    var t = ter(u.x, u.y);
    if (t.heal && u.chp < u.stats.hp) {
      var h = Math.max(1, Math.round(u.stats.hp * t.heal));
      u.chp = Math.min(u.stats.hp, u.chp + h); fxText(u, '+' + h, '#54f0c8');
    }
    if (t.burn) {
      var d = Math.max(1, Math.round(u.stats.hp * t.burn));
      u.chp = Math.max(0, u.chp - d); fxText(u, d, '#ff8a3a');
      if (u.chp <= 0) onDeath(u, null);
    }
    if (u.chp > 0 && u.traits.indexOf('regen') >= 0) {
      var r = Math.max(1, Math.round(u.stats.hp * 0.15));
      u.chp = Math.min(u.stats.hp, u.chp + r); fxText(u, '+' + r, '#8affd8');
    }
  }
}

function checkEnd() {
  if (S.screen !== 'map') return true;
  if (!allies('ply').length) { gameOver(); return true; }
  var foesLeft = allies('foe').length;
  if (S.obj === 'wipe' && foesLeft === 0) { chapterClear(); return true; }
  if (S.obj === 'boss') {
    var boss = S.units.filter(function (u) { return u.id === S.bossId; })[0];
    if (!boss || boss.chp <= 0) { chapterClear(); return true; }
  }
  if (S.obj === 'hold' && S.turn > S.objTurns) { chapterClear(); return true; }
  return false;
}

function endPlayerPhase() {
  if (S.busy) return;
  S.phase = 'foe'; S.sel = null; S.mode = 'idle'; S.reach = null; S.atkTiles = null;
  if (checkEnd()) return;
  phaseStart('foe');
  if (checkEnd()) return;
  S.banner = 'ENEMY PHASE'; S.bannerT = 0.9;
  var queue = allies('foe').slice().sort(function (a, b) { return (b.boss ? 1 : 0) - (a.boss ? 1 : 0); });
  var qi = 0;
  function step() {
    if (S.screen !== 'map') return;
    while (qi < queue.length && queue[qi].chp <= 0) qi++;
    if (qi >= queue.length) { endFoePhase(); return; }
    var u = queue[qi++];
    aiAct(u, function () {
      netSync();
      if (checkEnd()) return;
      schedule(step, 110);
    });
  }
  schedule(step, HEADLESS ? 0 : 420);
}
function endFoePhase() {
  S.turn++;
  S.phase = 'player';
  if (checkEnd()) return;
  for (var i = 0; i < S.reinforce.length; i++) {
    if (S.reinforce[i].turn === S.turn) { spawnReinforcements(S.reinforce[i].n); }
  }
  phaseStart('ply');
  if (checkEnd()) return;
  S.banner = 'PLAYER PHASE'; S.bannerT = 0.9;
  if (NET.local) { NET.localActive = 0; if (localOwners().length > 1) S.handoff = true; }
  netSync();
  if (typeof refreshUI === 'function') refreshUI();
}
function schedule(fn, ms) { if (HEADLESS) { fn(); } else { setTimeout(fn, ms); } }

/* ================= BETWEEN-BATTLE ROUTES ================= */
var ROUTES = {
  wheel: {name:'FORTUNE WHEEL', icon:'◈', desc:'Spin once: win or lose gold, gain a permanent stat, find or lose an item.'},
  shop: {name:'GROWTH MARKET', icon:'▣', desc:'Spend shared gold on growth modules for your operatives.'},
  chest: {name:'SALVAGE CHEST', icon:'▤', desc:'Open a sealed crate. Gold, a growth item, or nothing.'},
  forge: {name:'WEAPON FORGE', icon:'⚒', desc:'Upgrade a weapon: +1 might and +3 percentage points to every growth, max 3 levels.'},
  shrine: {name:'SIGNAL SHRINE', icon:'✧', desc:'Bless the whole squad for the next battle only.'},
  camp: {name:'RECOVERY CAMP', icon:'✚', desc:'Heal, recruit a new operative, or recover a fallen ally.'}
};
var ROUTE_ITEMS = ['Vital Core','Power Coil','Hex Prism','Targeting Lens','Armor Matrix','Ward Circuit','Reflex Chip','Fortune Relic'];
function resetRoute(){ S.gold=60; S.route=null; S.shrine=null; }
function routeRandom(a){return a[Math.floor(rnd()*a.length)];}
/* Growth module rarity is rolled only after an item has been awarded. */
var ITEM_RARITIES = [
  {id:'common',name:'Common',chance:50,bonus:5,color:'#b9c7d4',prefix:'Standard'},
  {id:'uncommon',name:'Uncommon',chance:28,bonus:10,color:'#54f0a0',prefix:'Refined'},
  {id:'rare',name:'Rare',chance:15,bonus:15,color:'#64b5ff',prefix:'Advanced'},
  {id:'epic',name:'Epic',chance:6,bonus:20,color:'#c18aff',prefix:'Exalted'},
  {id:'legendary',name:'Legendary',chance:1,bonus:25,color:'#ffd166',prefix:'Mythic'}
];
var ITEM_ICONS={hp:'✚',str:'⚡',mag:'✧',skl:'◎',def:'⬟',res:'◈',spd:'➤',lck:'✦'};
function itemRarity(it){return ITEM_RARITIES.filter(function(t){return t.id===it.rarity;})[0] || ITEM_RARITIES.filter(function(t){return t.bonus===it.bonus;})[0] || ITEM_RARITIES[0];}
function routeItem(){var k=Math.floor(rnd()*STATK.length),roll=rnd()*100,t=ITEM_RARITIES[0];for(var j=0;j<ITEM_RARITIES.length;j++){t=ITEM_RARITIES[j];if(roll<t.chance)break;roll-=t.chance;}return {s:STATK[k],name:t.prefix+' '+ROUTE_ITEMS[k],bonus:t.bonus,rarity:t.id};}
function itemLabel(it){var t=itemRarity(it);return '<span class="item-rarity" style="color:'+t.color+'">'+t.name.toUpperCase()+'</span> '+esc(it.name)+' · +'+it.bonus+'% '+STATN[it.s]+' growth';}
function itemOdds(){return '<div class="item-odds"><b>GROWTH ITEM RARITIES</b>'+ITEM_RARITIES.map(function(t){return '<span style="color:'+t.color+'">'+t.name+' '+t.chance+'% · +'+t.bonus+'%</span>';}).join('')+'</div>';}
/* Camp has a 10% chance of appearing anywhere on a two-choice map. */
function routeChoices(){var keys=Object.keys(ROUTES).filter(function(k){return k!=='camp';}),camp=rnd()<0.10,a=keys.splice(Math.floor(rnd()*keys.length),1)[0],b=camp?'camp':routeRandom(keys);return rnd()<0.5?[a,b]:[b,a];}
function routeGold(n){var prev=S.gold;S.gold=Math.max(0,S.gold+n);return S.gold-prev;}
function routeUnit(id){return allies('ply').filter(function(u){return u.id===id;})[0];}
function routeGrant(u,item){if(!u.items)u.items=[];u.items.push({s:item.s,name:item.name,bonus:item.bonus,rarity:itemRarity(item).id});u.grow[item.s]+=item.bonus;return u.name+' received '+item.name+' ['+itemRarity(item).name+'] (+'+item.bonus+'% '+STATN[item.s]+' growth).';}
function routeLoss(){var pairs=[];allies('ply').forEach(function(u){(u.items||[]).forEach(function(it,i){pairs.push({u:u,i:i});});});if(!pairs.length)return 'No growth items to lose. Nothing was taken.';var p=routeRandom(pairs),it=p.u.items.splice(p.i,1)[0];p.u.grow[it.s]-=it.bonus;return p.u.name+' lost '+it.name+' (-'+it.bonus+'% '+STATN[it.s]+' growth).';}
function routeFinish(msg){S.route.stage='result';S.route.message=msg;say(msg);}
function beginRoute(){var choices=routeChoices();var earn=20+S.chapter*3+Math.min(20,(S.squadSize||1)*2);routeGold(earn);S.route={ch:S.chapter,rev:0,stage:'choose',choices:choices,node:null,earn:earn,stock:[],message:''};}
function routeAction(cmd,arg,id,rev,ch,who){
  var r=S.route;if(S.screen!=='clear'||!r||r.rev!==rev||r.ch!==ch)return false;
  var live=allies('ply'),u=routeUnit(id),cost,it,msg;
  if(!live.length)return false;
  if(cmd==='choose'&&r.stage==='choose'&&r.choices.indexOf(arg)>=0){r.node=arg;r.stage='visit';if(arg==='shop'){for(var j=0;j<4;j++){it=routeItem();it.price=it.bonus*3+10;it.sold=false;r.stock.push(it);}}}
  else if(cmd==='spin'&&r.stage==='visit'&&r.node==='wheel'){
    var chance=rnd()*100,roll=chance<15?0:chance<20?1:chance<70?2:chance<85?3:chance<90?4:5,v=routeRandom(live),k=routeRandom(STATK);r.roll=roll;
    if(roll===0)msg='Lost '+(-routeGold(-(25+Math.floor(rnd()*31))))+' gold.';
    if(roll===1){v.stats[k]++;if(k==='hp')v.chp++;msg=v.name+' gained +1 '+STATN[k]+' permanently.';}
    if(roll===2)msg='Won '+routeGold(30+Math.floor(rnd()*51))+' gold!';
    if(roll===3)msg=routeGrant(v,routeItem());
    if(roll===4)msg=routeLoss();
    if(roll===5)msg="Nothing happens. No gold, items or stats changed.";
    routeFinish(msg);
  }else if(cmd==='open'&&r.stage==='visit'&&r.node==='chest'){
    var q=rnd();routeFinish(q<0.65?'Found '+routeGold(25+Math.floor(rnd()*41))+' gold!':q<0.85?routeGrant(routeRandom(live),routeItem()):'The chest was empty.');
  }else if(cmd==='buy'&&r.stage==='visit'&&r.node==='shop'&&u){
    it=r.stock[Number(arg)];if(!it||it.sold||S.gold<it.price)return false;routeGold(-it.price);it.sold=true;r.message=routeGrant(u,it);say(r.message);
  }else if(cmd==='forge'&&r.stage==='visit'&&r.node==='forge'&&u){
    var lv=u.forgeLv||0;cost=35+lv*20;if(lv>=3||S.gold<cost)return false;routeGold(-cost);u.forgeLv=lv+1;u.wpn.plus++;u.wpn.mt++;STATK.forEach(function(k){u.grow[k]+=3;});routeFinish(u.name+' weapon Lv '+u.forgeLv+'/3: +1 might, +3% all growth rates.');
  }else if(cmd==='bless'&&r.stage==='visit'&&r.node==='shrine'&&['power','guard','focus'].indexOf(arg)>=0){
    S.shrine={kind:arg,ch:S.chapter+1};routeFinish(({power:'Power: +2 attack',guard:'Guard: +2 defense and resistance',focus:'Focus: +15 hit and +10 avoid'})[arg]+' for the next fight.');
  }else if(cmd==='camp'&&r.stage==='visit'&&r.node==='camp'){
    if(arg==='heal'){live.forEach(function(v){v.chp=v.stats.hp;});S.kits+=2;routeFinish('Squad fully healed. Received 2 repair kits.');}
    else if(arg==='revive'&&S.dead.length&&live.length<SQUAD_CAP){var f=S.dead.pop(),def=charByKey(f.def);if(!def)return false;var nu=mkUnit(def,'ply',1,{});while(nu.lvl<f.lvl&&!atMax(nu))levelUp(nu);nu.owner=f.owner||who||'';nu.chp=nu.stats.hp;S.units.push(nu);routeFinish(nu.name+' returned to the squad.');}
    else if(arg==='recruit'&&live.length<SQUAD_CAP){var pool=ALLCHARS.filter(function(d){return !live.some(function(v){return v.key===d.key;});});if(!pool.length)return false;var nu=mkUnit(routeRandom(pool),'ply',1,{});while(nu.lvl<Math.max(1,Math.floor(avgLevel()*0.85))&&!atMax(nu))levelUp(nu);nu.owner=who||'';nu.chp=nu.stats.hp;S.units.push(nu);routeFinish(nu.name+' joined the squad.');}else return false;
  }else if(cmd==='next'&&(r.stage==='result'||(r.stage==='visit'&&['shop','forge'].indexOf(r.node)>=0))){S.route=null;S.rewards=null;S.chapter++;startChapter();refreshUI();return true;}
  else return false;
  r.rev++;saveGame();netSync();refreshUI();return true;
}

function routeBtn(cmd,arg,id,label,disabled){return '<button class="rew" data-act="route" data-cmd="'+cmd+'" data-v="'+arg+'" data-id="'+(id||0)+'"'+(disabled?' disabled':'')+'>'+label+'</button>';}

      if(left!==ch) dot(x,y+1,1,SC-1,light[ch]);
      if(bottom!==ch) dot(x,y+SC-1,SC,1,dark[ch]);

        if(ch==='H') dot(x+1,y+1,1,1,glint[ch]);

      if((ch==='A'||ch==='C') && (r===7||r===11) && (q===4||q===11)) dot(x+1,y+1,1,1,glint[ch]);

  var c = bgCanvas.getContext('2d');

}

function computeDanger() {
  var tiles = {};
  var foes = allies('foe');
  for (var i = 0; i < foes.length; i++) {
    var f = foes[i];
    var r = reachable(f);
    r[f.x + ',' + f.y] = 0;
    var at = attackTiles(f, r);
    for (var k in at) tiles[k] = 1;
  }
  S.dangerTiles = tiles;
}

/* ================= DRAW ================= */
var lastT = 0;
function frame(ts) {
  var dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function update(dt) {
  if (typeof netTick === 'function') netTick();
  /* movers */
  for (var i = S.movers.length - 1; i >= 0; i--) {
    var m = S.movers[i];
    m.t += dt / 0.09;
    while (m.t >= 1 && m.i < m.path.length) {
      m.fx = m.path[m.i].x; m.fy = m.path[m.i].y; m.i++; m.t -= 1;
    }
    if (m.i >= m.path.length) {
      m.u.x = m.fx; m.u.y = m.fy; m.u.px = m.fx; m.u.py = m.fy;
      S.movers.splice(i, 1);
      m.cb();
      continue;
    }
    var nx = m.path[m.i];
    m.u.px = m.fx + (nx.x - m.fx) * m.t;
    m.u.py = m.fy + (nx.y - m.fy) * m.t;
  }
  for (var j = S.fx.length - 1; j >= 0; j--) { S.fx[j].t += dt; if (S.fx[j].t > S.fx[j].dur) S.fx.splice(j, 1); }
  for (var k = 0; k < S.units.length; k++) if (S.units[k].flash > 0) S.units[k].flash -= dt * 4;
  if (S.bannerT > 0) S.bannerT -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
}

function draw() {
  if (!ctx) return;
  var sx = 0, sy = 0;
  if (S.shake > 0) { sx = (rnd() - 0.5) * S.shake; sy = (rnd() - 0.5) * S.shake; }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.clearRect(-20, -20, cv.width + 40, cv.height + 40);
  if (S.screen !== 'map' && S.screen !== 'clear' && S.screen !== 'over') { ctx.restore(); return; }
  if (!S.grid) { ctx.restore(); return; }
  if (!bgCanvas || bgCh !== S.chapter || bgLayout !== S.layout) buildBG();
  ctx.drawImage(bgCanvas, 0, 0);

  var i, k, p, u;
  /* danger zone */
  if (S.danger && S.dangerTiles) {
    ctx.fillStyle = 'rgba(255,70,70,0.20)';
    for (k in S.dangerTiles) { p = k.split(','); ctx.fillRect(+p[0] * TP, +p[1] * TP, TP, TP); }
  }
  /* move + attack range */
  if (S.sel && S.reach && (S.mode === 'move')) {
    ctx.fillStyle = 'rgba(80,160,255,0.26)';
    for (k in S.reach) { p = k.split(','); ctx.fillRect(+p[0] * TP, +p[1] * TP, TP, TP); }
    ctx.fillStyle = 'rgba(255,90,90,0.16)';
    for (k in S.atkTiles) { if (S.reach[k] !== undefined) continue; p = k.split(','); ctx.fillRect(+p[0] * TP, +p[1] * TP, TP, TP); }
  }
  if (S.sel && (S.mode === 'target' || S.mode === 'healt')) {
    var col = S.mode === 'target' ? 'rgba(255,90,90,0.28)' : 'rgba(84,240,200,0.28)';
    ctx.fillStyle = col;
    var w = S.sel;
    for (var dx = -wRange(w); dx <= wRange(w); dx++) for (var dy = -wRange(w); dy <= wRange(w); dy++) {
      var d = Math.abs(dx) + Math.abs(dy);
      if (d < w.wpn.rmin || d > wRange(w)) continue;
      var tx = w.x + dx, ty = w.y + dy;
      if (inBounds(tx, ty)) ctx.fillRect(tx * TP, ty * TP, TP, TP);
    }
  }
  /* selected highlight */
  if (S.sel) {
    ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 3;
    ctx.strokeRect(S.sel.px * TP + 2, S.sel.py * TP + 2, TP - 4, TP - 4);
  }
  if (S.inspect && S.inspect.chp > 0) {
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3;
    ctx.strokeRect(S.inspect.px * TP + 2, S.inspect.py * TP + 2, TP - 4, TP - 4);
  }
  /* units: back to front */
  var list = S.units.filter(function (u) { return u.chp > 0; }).sort(function (a, b) { return a.py - b.py; });
  for (i = 0; i < list.length; i++) {
    u = list[i];
    var ux = u.px * TP, uy = u.py * TP;
    /* shadow + side ring */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(ux + TP / 2, uy + TP - 7, TP * 0.3, TP * 0.12, 0, 0, 6.3); ctx.fill();
    /* yours, a team mate's, or the enemy: three different rings */
    var ally = u.side === 'ply';
    ctx.strokeStyle = onlineOwnerHP(u) ? ownerHpInfo(u.owner).color : isMine(u) ? 'rgba(125,249,255,0.8)'
      : (ally ? 'rgba(84,240,200,0.6)' : (u.boss ? 'rgba(255,224,102,0.9)' : 'rgba(255,90,90,0.7)'));
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ux + TP / 2, uy + TP - 7, TP * 0.32, TP * 0.14, 0, 0, 6.3); ctx.stroke();
    var img = getSpr(u.spr, u.pal);
    ctx.save();
    if (u.acted && ally) ctx.globalAlpha = 0.55;
    ctx.drawImage(img, Math.round(ux), Math.round(uy - 2));
    if (u.boss) ctx.drawImage(getSpr('crown', u.pal), Math.round(ux), Math.round(uy - 8));
    ctx.restore();
    if (u.flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = Math.min(0.8, u.flash);
      ctx.drawImage(img, Math.round(ux), Math.round(uy - 2));
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    /* hp bar */
    var bw = TP - 14, frac = u.chp / u.stats.hp;
    ctx.fillStyle = '#05080d'; ctx.fillRect(ux + 7, uy + TP - 5, bw, 5);
    ctx.fillStyle = unitHpColor(u, frac, true);
    ctx.fillRect(ux + 8, uy + TP - 4, Math.max(0, (bw - 2) * frac), 3);
    if (u.traits.length) { ctx.fillStyle = '#ff8a3a'; ctx.fillRect(ux + TP - 10, uy + 2, 5, 5); }
  }
  /* fx */
  for (i = 0; i < S.fx.length; i++) {
    var f = S.fx[i], pr = f.t / f.dur, cx = f.x * TP + TP / 2, cy = f.y * TP + TP / 2;
    if (f.k === 'txt') {
      ctx.globalAlpha = Math.max(0, 1 - pr * pr);
      ctx.font = 'bold 22px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = '#05080d';
      ctx.strokeText(f.txt, cx, cy - 10 - pr * 22);
      ctx.fillStyle = f.col; ctx.fillText(f.txt, cx, cy - 10 - pr * 22);
      ctx.globalAlpha = 1;
    } else if (f.k === 'hit') {
      ctx.globalAlpha = 1 - pr;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, 6 + pr * 26, 0, 6.3); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (f.k === 'boom') {
      ctx.globalAlpha = 1 - pr;
      var pp = paletteOf(f.pal);
      for (var b = 0; b < 8; b++) {
        var ang = b * 0.785, rr = pr * 40;
        ctx.fillStyle = b % 2 ? pp.V : pp.A;
        ctx.fillRect(cx + Math.cos(ang) * rr - 3, cy + Math.sin(ang) * rr - 3, 6, 6);
      }
      ctx.globalAlpha = 1;
    } else if (f.k === 'heal') {
      ctx.globalAlpha = 1 - pr;
      ctx.strokeStyle = '#54f0c8'; ctx.lineWidth = 3;
      ctx.strokeRect(cx - 18 + pr * 8, cy - 18 + pr * 8, 36 - pr * 16, 36 - pr * 16);
      ctx.globalAlpha = 1;
    }
  }
  /* banner */
  if (S.bannerT > 0 && S.banner) {
    var a = Math.min(1, S.bannerT * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,8,13,0.82)';
    ctx.fillRect(0, cv.height / 2 - 34, cv.width, 68);
    ctx.fillStyle = '#7df9ff';
    ctx.fillRect(0, cv.height / 2 - 34, cv.width, 2);
    ctx.fillRect(0, cv.height / 2 + 32, cv.width, 2);
    ctx.font = 'bold 34px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.fillStyle = '#eaf6ff';
    ctx.fillText(S.banner, cv.width / 2, cv.height / 2 + 12);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ================= ONLINE CO-OP =================
   One shared endless run. Everyone picks their own operatives and moves only
   those; the machines are the enemy. Host-authoritative: the host owns the
   rules and broadcasts the whole state, because messages drop and are never
   replayed, so every broadcast has to stand alone. */

var NET = {
  api: null, sub: null, available: false, tried: false,
  code: '', name: '', id: '', host: false, side: null,
  peers: [], lobby: {}, phase: 'idle',   /* idle | lobby | match | done */
  lastHeard: 0, lastSend: 0, err: '', pending: false, keys: [],
  localPlayers: [], localActive: 0, localCount: 2,
  mode: null,        /* null | 'create' | 'join' | 'local' */
  transport: null,   /* 'room' on the hosted artifact, 'p2p' anywhere else */
  isCreator: false, p2pLoading: false, p2pQueue: [], peer: null,
  local: false, localStep: 0, copied: '', ownerColors: null
};
var PER_PLAYER = 4, SQUAD_CAP = 8;

function netId() {
  var a = 'abcdefghijklmnopqrstuvwxyz0123456789', o = '';
  for (var i = 0; i < 12; i++) o += a.charAt(Math.floor(rnd() * a.length));
  return o;
}
function roomCode() {
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', o = '';
  for (var i = 0; i < 4; i++) o += a.charAt(Math.floor(rnd() * a.length));
  return o;
}
/* Online ownership colors: host assigns a stable slot and broadcasts it. */
var OWNER_HP_PALETTE = ['#54d9ff','#54f0a0','#b38aff','#ffd166','#ff9e42','#f78ed8','#b8e85c','#a9baff'];
function ownerSlotColor(slot) {
  return OWNER_HP_PALETTE[slot] || 'hsl(' + ((slot * 137.508) % 360).toFixed(1) + ',85%,72%)';
}
function readOwnerColors(raw) {
  var map = Object.create(null);
  if (!raw || typeof raw !== 'object') return map;
  Object.keys(raw).forEach(function (id) {
    var p = raw[id];
    if (p && Number.isInteger(p.slot) && p.slot >= 0 && p.slot < 10000)
      map[id] = {slot:p.slot, name:String(p.name || 'PLAYER').slice(0, 40)};
  });
  return map;
}
function assignOwnerColors(previous) {
  var map = readOwnerColors(previous), used = Object.create(null), host = String(netHostId());
  Object.keys(map).forEach(function (id) { used[map[id].slot] = true; });
  allPlayers().slice().sort(function (a,b) {
    return a.id === b.id ? 0 : a.id === host ? -1 : b.id === host ? 1 : a.id < b.id ? -1 : 1;
  }).forEach(function (p) {
    if (!map[p.id]) {
      var slot = 0; while (used[slot]) slot++;
      map[p.id] = {slot:slot, name:p.name}; used[slot] = true;
    } else map[p.id].name = p.name;
  });
  return map;
}
function ownerHpInfo(id) {
  var map = NET.ownerColors || assignOwnerColors(null), p = map[String(id)];
  return p ? {color:ownerSlotColor(p.slot), name:p.name} : {color:'#b0bac7',name:ownerName(id)};
}
function onlineOwnerHP(u) { return netOnline() && !NET.local && u.side === 'ply' && !!u.owner; }
function unitHpColor(u, f, mapView) {
  if (onlineOwnerHP(u)) return ownerHpInfo(u.owner).color;
  if (u.side !== 'ply' && (mapView || (netOnline() && !NET.local))) return u.boss ? '#ffb24a' : '#ff5a5a';
  return hpCol(f);
}
function ownerHpLegend() {
  if (!netOnline() || NET.local) return '';
  var map = NET.ownerColors || assignOwnerColors(null);
  var ids = Object.keys(map).filter(function(id) {
    return S.units.some(function(u) { return u.side === 'ply' && String(u.owner) === id; }) ||
      S.dead.some(function(u) { return String(u.owner) === id; });
  }).sort(function(a,b) { return map[a].slot - map[b].slot; });
  return '<div class="owner-legend" aria-label="Player health bar colors">' + ids.map(function(id) {
    var p = ownerHpInfo(id);
    return '<span style="color:' + p.color + '"><b>● ' + esc(p.name) + (id === String(NET.id) ? ' (YOU)' : '') + '</b></span>';
  }).join('') + '</div>';
}
function onOwnerColors(msg) {
  var d = msg && msg.data ? msg.data : msg;
  if (NET.local || NET.host || !d || String(d.host) !== String(netHostId()) || NET.phase !== 'lobby') return;
  NET.ownerColors = readOwnerColors(d.colors); refreshUI();
}
function netOnline() { return NET.phase === 'match' || NET.phase === 'done'; }
function turnSideNow() { return S.phase === 'player' ? 'ply' : 'foe'; }
function mySide() { return 'ply'; }
/* who is at the controls right now: online that is always you, on one
   shared device it is whoever the handoff last passed to */
function activeOwner() {
  if (NET.local) {
    var p = NET.localPlayers[NET.localActive];
    return p ? p.id : 'P1';
  }
  return NET.id;
}
function ownerName(id) {
  if (NET.local) {
    for (var j = 0; j < NET.localPlayers.length; j++)
      if (NET.localPlayers[j].id === id) return NET.localPlayers[j].name;
    return id;
  }
  for (var i = 0; i < NET.peers.length; i++)
    if (String(NET.peers[i].id) === String(id)) return NET.peers[i].name || 'PLAYER';
  return 'PLAYER';
}
function isMine(u) {
  if (!netOnline()) return u.side === 'ply';
  return u.side === 'ply' && String(u.owner || '') === String(activeOwner());
}
function canAct() {
  if (S.gameover || S.busy) return false;
  if (!netOnline()) return S.phase === 'player';
  if (S.screen !== 'map') return false;
  if (S.phase !== 'player') return false;
  if (NET.local) return !S.handoff;
  return !NET.pending;
}

/* ---------------- capability ---------------- */
function netInit() {
  if (NET.tried) return;
  NET.tried = true;
  NET.id = netId();
  try {
    if (typeof window !== 'undefined' && window.claude && window.claude.use) {
      window.claude.use('room').then(function (r) {
        if (r) {
          NET.api = r; NET.transport = 'room'; NET.available = true;
        } else {
          netTryP2P();
        }
        if (typeof refreshUI === 'function') refreshUI();
      }, function () { netTryP2P(); });
      return;
    }
  } catch (e) { }
  netTryP2P();
}

/* ---------------- peer to peer ----------------
   Off the hosted page there is no room service, so two browsers talk straight
   to each other over WebRTC. The only thing in the middle is a public broker
   that introduces them; the match itself never touches a server. */
var P2P_LIB = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
var P2P_PREFIX = 'hyperfights-v1-';

function netTryP2P() {
  if (typeof window === 'undefined' || !window.document) return;
  NET.transport = 'p2p';
  NET.available = true;        /* the library loads when a lobby is actually opened */
}

function p2pLoad(cb) {
  if (typeof window === 'undefined') { cb(false); return; }
  if (window.Peer) { cb(true); return; }
  NET.p2pQueue.push(cb);
  if (NET.p2pLoading) return;
  NET.p2pLoading = true;
  var done = function (ok) {
    NET.p2pLoading = false;
    var q = NET.p2pQueue; NET.p2pQueue = [];
    for (var i = 0; i < q.length; i++) { try { q[i](ok); } catch (e) { } }
  };
  try {
    var sc = document.createElement('script');
    sc.src = P2P_LIB;
    sc.onload = function () { done(!!window.Peer); };
    sc.onerror = function () { done(false); };
    document.body.appendChild(sc);
    setTimeout(function () { if (NET.p2pLoading) done(!!window.Peer); }, 12000);
  } catch (e) { done(false); }
}

/* an adapter with the same shape as the room capability, so the rest of the
   game does not care which one it is talking over */
function p2pSub(peer, isCreator) {
  var handlers = {}, peerCbs = [], conns = [], presences = Object.create(null), mine = null, hostRoster = null;
  function firePeers() {
    var list = [];
    if (mine) list.push(mine);
    if (!isCreator && hostRoster) {
      hostRoster.forEach(function(p) { if (p && p.id && (!mine || p.id !== mine.id)) list.push(p); });
    } else { for (var k in presences) list.push(presences[k]); }
    if (isCreator) conns.forEach(function(conn) { try { conn.send({tp:'__roster',dt:list}); } catch(e) {} });
    for (var i = 0; i < peerCbs.length; i++) { try { peerCbs[i](list); } catch (e) { } }
  }
  function dispatch(topic, data) {
    var hs = handlers[topic] || [];
    for (var i = 0; i < hs.length; i++) { try { hs[i]({ data: data }); } catch (e) { } }
  }
  function wire(conn, onOpen) {
    conn.on('open', function () {
      conns.push(conn);
      if (mine) { try { conn.send({ tp: '__pres', dt: mine }); } catch (e) { } }
      dispatch('hello', { id: conn.peer });
      firePeers();
      if (onOpen) { try { onOpen(); } catch (e) { } }
    });
    conn.on('data', function (msg) {
      if (!msg || !msg.tp) return;
      if (msg.tp === '__roster') {
        if (!isCreator && Array.isArray(msg.dt)) { hostRoster = msg.dt; firePeers(); }
        return;
      }
      if (msg.tp === '__pres') {
        if (msg.dt && msg.dt.id) { presences[msg.dt.id] = msg.dt; conn.__pid = msg.dt.id; firePeers(); }
        return;
      }
      dispatch(msg.tp, msg.dt);
    });
    var drop = function () {
      for (var i = conns.length - 1; i >= 0; i--) if (conns[i] === conn) conns.splice(i, 1);
      if (conn.__pid) delete presences[conn.__pid];
      if (!isCreator) hostRoster = null;
      firePeers();
      NET.err = 'Your opponent disconnected.';
      if (typeof refreshUI === 'function') refreshUI();
    };
    conn.on('close', drop);
    conn.on('error', drop);
  }
  if (isCreator) peer.on('connection', wire);
  return {
    __wire: wire,
    on: function (topic, fn) { (handlers[topic] = handlers[topic] || []).push(fn); },
    emit: function (topic, data) {
      for (var i = 0; i < conns.length; i++) {
        try { conns[i].send({ tp: topic, dt: data }); } catch (e) { }
      }
    },
    presence: function (patch) {
      mine = patch;
      for (var i = 0; i < conns.length; i++) { try { conns[i].send({ tp: '__pres', dt: patch }); } catch (e) { } }
      firePeers();
    },
    onPeers: function (fn) { peerCbs.push(fn); firePeers(); },
    leave: function () {
      for (var i = 0; i < conns.length; i++) { try { conns[i].close(); } catch (e) { } }

}

function p2pJoin(code, isCreator, cb) {
  p2pLoad(function (ok) {
    if (!ok || !window.Peer) {
      cb(null, 'Could not load the connection library. Check your internet and try again.');
      return;
    }
    var peer, settled = false;
    try {
      peer = isCreator ? new window.Peer(P2P_PREFIX + code) : new window.Peer();
    } catch (e) { cb(null, 'Could not start a connection.'); return; }
    NET.peer = peer;
    var sub = p2pSub(peer, isCreator);
    peer.on('error', function (err) {
      var t = (err && err.type) || '';
      if (t === 'unavailable-id') {
        if (!settled) { settled = true; cb(null, 'That code is already in use. Pick a new code.'); }
      } else if (t === 'peer-unavailable') {
        if (!settled) { settled = true; cb(null, 'No lobby found with that code. Check it and make sure your friend opened theirs first.'); }
      } else if (t === 'browser-incompatible') {
        if (!settled) { settled = true; cb(null, 'This browser cannot do peer-to-peer play.'); }
      } else if (!settled) {
        settled = true; cb(null, 'Could not reach the lobby. Some networks block this; try another connection.');
      }
    });
    peer.on('open', function () {
      if (isCreator) {
        /* the lobby exists as soon as the code is claimed */
        if (!settled) { settled = true; cb(sub, null); }
        return;
      }
      /* a joiner is only really in once the link to the host is open: settling
         on peer-open would report success for a code nobody is hosting */
      var conn;
      try { conn = peer.connect(P2P_PREFIX + code, { reliable: true }); } catch (e) {
        if (!settled) { settled = true; cb(null, 'Could not reach that lobby.'); }
        return;
      }
      sub.__wire(conn, function () {
        if (!settled) { settled = true; cb(sub, null); }
      });
    });
    setTimeout(function () {
      if (!settled) { settled = true; cb(null, 'Timed out reaching the lobby.'); }
    }, 15000);
  });
}

function netResolve(v, cb) {
  try {
    if (v && typeof v.then === 'function') { v.then(cb, function () { cb(null); }); return; }
    cb(v);
  } catch (e) { cb(null); }
}

function netJoin(code, name) {
  NET.code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  NET.name = String(name || '').toUpperCase().slice(0, 11) || 'PLAYER';
  if (!NET.code) { NET.err = 'Enter a room code.'; return; }
  if (!NET.transport) { NET.err = 'Online is not available on this page.'; return; }
  NET.isCreator = (NET.mode === 'create');
  NET.err = ''; NET.phase = 'joining';
  if (typeof refreshUI === 'function') refreshUI();

  if (NET.transport === 'p2p') {
    p2pJoin(NET.code, NET.isCreator, function (sub, err) {
      if (!sub) { NET.err = err || 'Could not open that lobby.'; NET.phase = 'idle'; refreshUI(); return; }
      netAttach(sub);
    });
    return;
  }
  var joined;
  try { joined = NET.api.join('hyperfights-' + NET.code); }
  catch (e) { NET.err = 'Could not open that room.'; NET.phase = 'idle'; refreshUI(); return; }
  netResolve(joined, function (sub) {
    if (!sub) { NET.err = 'Could not open that room.'; NET.phase = 'idle'; refreshUI(); return; }
    netAttach(sub);
  });
}

function netAttach(sub) {

/* peers: everyone with the page open in this room right now */
function onNetPeers(list) {
  var arr = [];

    if (Array.isArray(list)) arr = list;

  } catch (e) { }

  var me = false;

  NET.host = (NET.transport === 'p2p') ? !!NET.isCreator : (netHostId() === NET.id);
  if (NET.host && NET.phase === 'lobby' && !NET.local) {

function netHostId() {

    for (var i = 0; i < NET.peers.length; i++) if (NET.peers[i].creator) return String(NET.peers[i].id);
    return NET.isCreator ? NET.id : '';
  }
  var ids = NET.peers.map(function (p) { return String(p.id || ''); }).filter(Boolean).sort();

}

  }

}

/* ---------------- lobby: picks are exclusive ---------------- */
function allPlayers() {
  if (NET.local) return NET.localPlayers;
  return NET.peers.map(function (p) {
    var mine=String(p.id)===String(NET.id); return { id: String(p.id), name: p.name || 'PLAYER', keys: mine?NET.keys:(p.keys || []), looks: mine?netLooks(NET.keys):(p.looks || {}), ready: mine?!!NET.ready:!!p.ready };
  });
}

  var ps = allPlayers();
  for (var i = 0; i < ps.length; i++) {
    var ks = ps[i].keys || [];
    for (var j = 0; j < ks.length; j++) if (ks[j] === key) return ps[i];
  }
  return null;
}
function squadTotal() {
  var ps = allPlayers(), n = 0;
  for (var i = 0; i < ps.length; i++) n += (ps[i].keys || []).length;

}

  }

}

  if (at >= 0) { mine.splice(at, 1); if (!NET.local) { NET.ready = false; netPresence(); } return true; }
  var owner = takenBy(key);
  if (owner) return false;
  if (mine.length >= PER_PLAYER) return false;

/* ---------------- start the shared run (host only) ---------------- */
function buildSquad(players) {
  S.units = []; S.uid = 1;
  var total = 0;
  for (var i = 0; i < players.length; i++) {
    var p = players[i], ks = p.keys || [];
    for (var j = 0; j < ks.length; j++) {
      if (total >= SQUAD_CAP) break;
      var def = charByKey(ks[j]);
      if (!def) continue;
      var look = (p.looks && p.looks[ks[j]]) || ((NET.local || String(p.id)===String(NET.id)) ? lookOf(ks[j],def) : def);
      var u = mkUnit(def, 'ply', 1, { fair: true, look: look });
      u.owner = String(p.id);
      S.units.push(u);
      total++;
    }
  }
  S.squadSize = Math.max(1, total);
  return total;
}

function netStartRun() {
  if (!NET.host && !NET.local) return;
  var players = allPlayers().filter(function (p) { return (p.keys || []).length; });
  if (!players.length) { NET.err = 'Nobody has picked an operative yet.'; refreshUI(); return; }
  S.dead = []; S.kits = 3; S.log = []; S.levelups = []; S.bags = []; S.resumeLayout = null;
  resetRoute(); S.chapter = 1; S.gameover = false; S.rewards = null;

/* ---------------- wire format ---------------- */
function wireUnit(u) {
