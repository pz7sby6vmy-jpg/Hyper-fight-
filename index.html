<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hyper Fights</title>
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080d; --bg2:#0a111b; --panel:#0c1420; --line:#1d2b40;
  --cy:#7df9ff; --gr:#54f0c8; --am:#ffd166; --rd:#ff5a5a; --tx:#d7e5f2; --dim:#7f93a8;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%,#10213a 0%,transparent 60%),
    linear-gradient(180deg,#060a11,#04070c 60%);
  color:var(--tx);font-family:var(--mono);-webkit-font-smoothing:antialiased;
  letter-spacing:.02em;overflow-x:hidden;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;
}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 8px 20px;gap:8px}
h1,h2,h3,b,button{letter-spacing:.06em}
button{
  font-family:var(--mono);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:#041018;background:linear-gradient(180deg,var(--cy),#49c9d8);
  border:1px solid #9bfaff;border-radius:3px;padding:10px 12px;cursor:pointer;
  box-shadow:0 0 0 1px #05121c,0 2px 0 #0b3a46,0 0 14px rgba(125,249,255,.22);
}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;filter:grayscale(1);cursor:default}
button.ghost{background:transparent;color:var(--cy);border:1px solid #2d4a63;box-shadow:none}
button.mini{padding:6px 8px;font-size:10px;background:transparent;color:var(--cy);border:1px solid #2d4a63;box-shadow:none}

/* ---------- title ---------- */
#title-screen{display:none;flex-direction:column;align-items:center;width:100%;max-width:760px}
.tbox{width:100%;text-align:center;padding:14px 4px 10px}
h1{font-size:clamp(30px,10vw,58px);line-height:.95;color:#eaf6ff;
  text-shadow:0 0 18px rgba(125,249,255,.55),0 3px 0 #0a2130}
h1 span{display:block;font-size:.42em;color:var(--cy);letter-spacing:.44em;margin-top:6px;text-shadow:0 0 12px rgba(125,249,255,.8)}
.tag2{margin-top:10px;font-size:10px;letter-spacing:.34em;color:var(--dim)}
.tdesc{margin:14px auto 0;max-width:46ch;font-size:12px;line-height:1.7;color:#a9bfd4}
.tbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 8px}
.tbest{font-size:10px;color:var(--am);letter-spacing:.2em}
.tros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:16px;text-align:left}
.tr{background:linear-gradient(180deg,#0d1725,#0a1118);border:1px solid var(--line);border-radius:4px;padding:10px;position:relative}
.tr canvas{width:40px;height:40px;image-rendering:pixelated;display:block;margin-bottom:4px}
.tr b{display:block;font-size:13px;color:var(--cy)}
.tr span{display:block;font-size:9px;color:var(--dim);letter-spacing:.16em;margin-bottom:6px}
.tsg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:6px 0 4px}
.tsc{background:#070e18;border:1px solid #16243a;border-radius:2px;padding:3px 1px;text-align:center}
.tsc b{display:block;font-size:7px;color:#5f7d96;letter-spacing:.06em}
.tsc span{display:block;font-size:12px;color:#eaf6ff;margin:0}
.tsc em{display:block;font-size:7px;color:var(--gr);font-style:normal}
.tr u{display:block;text-decoration:none;font-size:7px;letter-spacing:.14em;color:var(--am);margin-bottom:4px}
.tr i{display:block;font-size:10px;color:#6f8699;line-height:1.5;font-style:normal;margin-top:6px}

/* ---------- game ---------- */
#game-screen{display:none;flex-direction:column;width:100%;max-width:760px;gap:6px}
#hud{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:10px}
.hleft,.hmid{display:flex;flex-direction:column;gap:1px;min-width:0}
.hleft b{color:var(--cy);font-size:12px}
.hmid{flex:1;min-width:90px}
.hmid b{color:var(--am);font-size:11px}
.hleft span,.hmid span{color:var(--dim);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:9px;color:var(--dim);white-space:nowrap}
.pill.ply{color:#041018;background:var(--gr);border-color:var(--gr);font-weight:700}
.pill.foe{color:#190608;background:var(--rd);border-color:var(--rd);font-weight:700}

#cvwrap{position:relative;border:1px solid #22354b;border-radius:4px;overflow:hidden;
  background:#070b11;box-shadow:inset 0 0 50px rgba(0,0,0,.7),0 0 24px rgba(0,0,0,.6)}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}

#panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:92px}
.hint{font-size:10px;color:var(--dim);line-height:1.55;padding:3px 2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.acts button{flex:1 1 auto;min-width:86px}

.ucard{font-size:11px}
.uhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.unm{color:var(--cy);font-weight:700;font-size:13px}
.ucls{color:var(--dim);font-size:9px;letter-spacing:.14em}
.urow{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.urow.small{font-size:9px;color:#9ab0c6;letter-spacing:.08em}
.urow.dim{color:var(--dim)}
.bar{flex:1;min-width:60px;height:7px;background:#060b12;border:1px solid #1b2a3c;display:block;position:relative}
.bar i{display:block;height:100%}
.hpn{font-size:10px;color:#b9cde0}
.tag{font-size:8px;border:1px solid #58381c;background:#241307;color:var(--am);padding:2px 5px;border-radius:2px;letter-spacing:.1em}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:8px}
.sc{background:#091120;border:1px solid #17263a;border-radius:2px;padding:3px 2px;text-align:center}
.sc b{display:block;font-size:8px;color:var(--dim);letter-spacing:.1em}
.sc span{display:block;font-size:12px;color:#eaf6ff}
.sc em{display:block;font-size:10px;color:var(--gr);font-style:normal;font-weight:700;margin-top:3px}
.stat-sheet-label{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:9px;color:var(--dim);font-size:9px;letter-spacing:.08em}
.stat-sheet-label strong{color:var(--gr);font-weight:700}
.sc .grow-label{display:block;font-size:8px;letter-spacing:.04em;color:#8fa7bd;margin-top:2px}
.tsc em{font-size:9px;font-weight:700}
.tsc .grow-label{display:block;font-size:7px;color:#8fa7bd;margin-top:2px}

.fcast{display:flex;align-items:stretch;gap:6px;margin-bottom:8px}
.fcol{flex:1;background:#091120;border:1px solid #17263a;border-radius:3px;padding:7px}
.fcol b{display:block;font-size:11px;color:var(--cy);margin-bottom:5px}
.frow{display:flex;justify-content:space-between;font-size:10px;padding:1px 0}
.frow i{color:var(--dim);font-style:normal}
.frow s{text-decoration:none;color:#eaf6ff}
.fvs{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);gap:4px;padding:0 2px}
.no{font-size:9px;color:var(--dim)}
.adv{color:#041018;background:var(--gr);padding:2px 4px;border-radius:2px;font-size:8px;font-weight:700}
.dis{color:#190608;background:var(--rd);padding:2px 4px;border-radius:2px;font-size:8px;font-weight:700}

#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.rchip{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:6px;text-align:left}
.rchip.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.3)}
.rchip.done{opacity:.45}
.rnm{font-size:10px;color:var(--cy)}
.rlv{font-size:8px;color:var(--dim)}

#log{width:100%;max-width:760px;font-size:9px;color:#5f7489;line-height:1.7;max-height:60px;overflow:hidden}

/* ---------- overlay ---------- */
#overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(3,6,11,.9);
  align-items:center;justify-content:center;padding:14px;overflow:auto}
.obox{width:100%;max-width:560px;background:linear-gradient(180deg,#0c1724,#080e16);
  border:1px solid #27425c;border-radius:5px;padding:16px;box-shadow:0 0 40px rgba(125,249,255,.12)}
.obox h2{font-size:20px;color:var(--cy);text-shadow:0 0 14px rgba(125,249,255,.5)}
.obox h2.dead{color:var(--rd);text-shadow:0 0 14px rgba(255,90,90,.5)}
.osub{font-size:11px;color:var(--dim);margin:8px 0 12px;line-height:1.6}
.lvs{display:grid;gap:5px;margin:12px 0}
.lv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#091120;border:1px solid #17263a;padding:6px 8px;border-radius:3px;font-size:10px}
.lv b{color:var(--cy);font-size:11px;min-width:70px}
.lv span{color:var(--dim);font-size:9px}
.gn{color:#041018!important;background:var(--gr);padding:2px 5px;border-radius:2px;font-weight:700}
.promo{color:#190c02!important;background:var(--am);padding:2px 5px;border-radius:2px;font-weight:700}
.dim{color:var(--dim)}
.rews{display:grid;gap:7px}
.rew{display:block;text-align:left;background:#0b1626;border:1px solid #27425c;color:var(--tx);box-shadow:none;padding:11px}
.rew:hover{border-color:var(--cy)}
.rew b{display:block;color:var(--am);font-size:12px;margin-bottom:3px}
.rew span{display:block;font-size:10px;color:#9ab0c6;letter-spacing:.02em;text-transform:none;font-weight:400;line-height:1.5}
ul.help{display:grid;gap:8px;margin:12px 0;padding-left:16px}
ul.help li{font-size:11px;line-height:1.65;color:#a9bfd4}
ul.help b{color:var(--cy)}
@media(max-width:420px){
  .sgrid{grid-template-columns:repeat(4,1fr)}
  .acts button{min-width:70px;padding:9px 6px;font-size:11px}
  .hmid{flex:1 1 100%;order:3}
}

/* ---------- title extras ---------- */
.tmini{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tmini canvas{width:34px;height:34px;image-rendering:pixelated;
  background:#0b1422;border:1px solid var(--line);border-radius:3px}
.tfoot{margin-top:10px;font-size:9px;letter-spacing:.18em;color:var(--dim)}

/* ---------- squad select ---------- */
#squad-screen{display:none;flex-direction:column;width:100%;max-width:860px}
.sqbox{width:100%;padding-bottom:70px}
.sqhead h2{font-size:20px;color:var(--cy);text-shadow:0 0 14px rgba(125,249,255,.45);text-align:center}
.sqhead .osub{text-align:center;max-width:52ch;margin:8px auto 14px}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:8px}
.sqc{background:linear-gradient(180deg,#0d1725,#0a1118);border:1px solid var(--line);border-radius:4px;padding:10px;
  display:flex;flex-direction:column;gap:6px}
.sqc.on{border-color:var(--cy);box-shadow:0 0 14px rgba(125,249,255,.18)}
.sqtop{display:flex;gap:9px;align-items:flex-start}
.sqtop canvas{width:42px;height:42px;image-rendering:pixelated;flex:none;
  background:#070e18;border:1px solid #16243a;border-radius:3px}
.sqid{min-width:0}
.sqid b{display:block;font-size:14px;color:var(--cy)}
.sqid span{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em}
.sqid i{display:block;font-size:8px;color:#8fa7bd;font-style:normal;margin-top:3px;line-height:1.5}
.sqbio{font-size:9px;color:#6f8699;line-height:1.55}
.sqbtns{display:flex;gap:5px;margin-top:auto}
.sqbtns button{flex:1;padding:8px 4px;font-size:10px}
.sqbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:7px;align-items:center;justify-content:center;
  padding:9px 10px;background:rgba(5,9,15,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.sqcount{font-size:11px;color:var(--dim);letter-spacing:.14em;margin-right:auto}
.sqcount b{color:var(--cy);font-size:15px}

/* ---------- appearance ---------- */
.skinbox{max-width:600px}
.skprev{display:flex;gap:12px;align-items:center;margin:10px 0 4px}
.skprev canvas.big{width:74px;height:74px;image-rendering:pixelated;flex:none;
  background:#070e18;border:1px solid #1d2b40;border-radius:4px}
.skname{display:block;font-size:17px;color:var(--cy)}
.skprev span{font-size:9px;letter-spacing:.14em}
.skprev p{font-size:9px;line-height:1.6;margin-top:6px}
.sklab{display:block;font-size:9px;letter-spacing:.2em;color:var(--dim);margin:14px 0 6px}
#skinname{width:100%;font-family:var(--mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--cy);background:#070e18;border:1px solid #27425c;border-radius:3px;padding:9px 10px}
#skinname:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.2)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:5px}
.sw{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.sw.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.25)}
.sw i{display:inline-block;width:14px;height:8px;border:1px solid #05080d}
.sw i+i{margin-left:-1px}
.sw span{font-size:7px;letter-spacing:.1em;color:var(--dim)}
.sw.on span{color:var(--cy)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:5px}
.ch{background:#0b1422;border:1px solid var(--line);box-shadow:none;color:var(--tx);
  padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.ch.on{border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.25)}
.ch canvas{width:38px;height:38px;image-rendering:pixelated}
.ch span{font-size:7px;letter-spacing:.06em;color:var(--dim)}
.ch.on span{color:var(--cy)}

/* ---------- legend ---------- */
.lgh{font-size:11px;color:var(--am);letter-spacing:.18em;margin:14px 0 8px}
.legend{display:grid;gap:5px}
.lg{display:flex;gap:9px;align-items:center;background:#091120;border:1px solid #17263a;border-radius:3px;padding:6px 8px}
.lg canvas{width:34px;height:34px;image-rendering:pixelated;flex:none;border:1px solid #16243a}
.lg b{display:block;font-size:10px;color:var(--cy);letter-spacing:.1em}
.lg span{display:block;font-size:9px;color:#8fa7bd;line-height:1.5}
@media(max-width:420px){
  .sqgrid{grid-template-columns:1fr}
  .swgrid{grid-template-columns:repeat(4,1fr)}
  .chgrid{grid-template-columns:repeat(4,1fr)}
}

/* ---------- online ---------- */
.netform{max-width:420px;margin:0 auto}
.netform input{width:100%;font-family:var(--mono);font-size:18px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cy);background:#070e18;border:1px solid #27425c;border-radius:3px;padding:11px 12px;text-align:center}
.netform input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 10px rgba(125,249,255,.2)}
.neterr{font-size:10px;color:var(--rd);margin-top:10px;text-align:center;letter-spacing:.08em}
.plrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:10px}
.plr{background:#0b1626;border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.plr.you{border-color:var(--cy)}
.plr b{display:block;font-size:13px;color:var(--cy)}
.plr span{display:block;font-size:9px;color:var(--dim);letter-spacing:.14em}
.plr .rdy{color:var(--gr)}
.vsmenu{display:grid;gap:8px;max-width:460px;margin:0 auto}
.vopt{display:block;text-align:left;background:#0b1626;border:1px solid #27425c;color:var(--tx);box-shadow:none;padding:13px}
.vopt:hover{border-color:var(--cy)}
.vopt b{display:block;color:var(--cy);font-size:14px;margin-bottom:4px}
.vopt span{display:block;font-size:10px;color:#9ab0c6;letter-spacing:.02em;text-transform:none;font-weight:400;line-height:1.5}
.codebig{font-size:34px;letter-spacing:.3em;color:var(--cy);text-align:center;padding:14px 8px 10px;
  background:#070e18;border:1px solid #27425c;border-radius:4px;text-shadow:0 0 16px rgba(125,249,255,.45)}
.netnote{font-size:9px;color:var(--dim);line-height:1.6;margin-top:12px;text-align:center}
.handoff{text-align:center;padding:10px 6px}
.handoff b{display:block;font-size:20px;color:var(--cy);letter-spacing:.14em;margin-bottom:6px}
.handoff span{display:block;font-size:10px;color:var(--dim);margin-bottom:12px}
.sqc.taken{opacity:.5}
.sqc.taken .sqid b{color:#7f93a8}
.owner-legend{display:flex;flex-wrap:wrap;gap:5px 14px;padding:6px 8px;background:#0c1420;border:1px solid #1d2b40;border-radius:4px;font-size:10px}
#owner-legend:empty{display:none}

.route-wallet{display:flex;justify-content:space-between;align-items:center;margin:12px 0;gap:8px;padding:9px;background:#151c29;border:1px solid #675735;border-radius:6px;color:#ffd166;font-size:12px}.route-wallet span{font-size:9px;color:#c6b181}.route-map{padding:14px 8px;background:radial-gradient(ellipse at top,#19334b,#070e17);border:1px solid #34526b;border-radius:8px;text-align:center}.route-start{display:inline-block;padding:9px 12px;border:1px solid #54f0c8;border-radius:20px;color:#54f0c8;font-size:10px;font-weight:bold}.route-start.next{color:#7df9ff;border-color:#7df9ff}.route-branch,.route-merge{height:28px;width:50%;margin:auto;border:1px dashed #69869d;border-bottom:0;border-radius:10px 10px 0 0;position:relative}.route-merge{transform:rotate(180deg)}.route-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.route-choices .rew{text-align:center;min-width:0;padding:12px 7px;border-color:#527993;background:linear-gradient(#142b3e,#0b1524)}.route-choices i{font-style:normal;font-size:28px;color:#7df9ff;display:block;margin-bottom:7px}.route-all,.wheel-key{font-size:9px;line-height:1.7;color:#a9bfd4;text-align:center;margin:12px 0}.route-title{color:#ffd166;margin:12px 0 0}.route-result{padding:12px;border:1px solid #3d846c;background:#0c2822;color:#b8ffdb;border-radius:6px;font-size:12px;margin:10px 0;line-height:1.6}.route-item{border:1px solid #27425c;border-radius:5px;padding:9px;margin:6px 0;background:#091120;font-size:11px}.route-item>b{color:#54f0c8;display:block}.route-item>span{display:block;color:#ffd166;font-size:10px;margin:5px 0}.route-buy{display:flex;flex-wrap:wrap;gap:4px}.route-buy .rew{padding:6px;font-size:9px}.obox>.rew{width:100%;margin:4px 0}.route-inventory{margin-top:12px;color:#9ab0c6;font-size:10px;line-height:1.7}.route-inventory summary{cursor:pointer;color:#7df9ff}.fortune-wheel{margin:18px auto;width:145px;height:145px;border:5px solid #dfba70;border-radius:50%;background:conic-gradient(#b74150 0deg 54deg,#7058ba 54deg 72deg,#c5a245 72deg 252deg,#289c76 252deg 270deg,#427db1 270deg 288deg,#687585 288deg 360deg);display:grid;place-items:center;box-shadow:0 0 20px #dfba7040;position:relative}.fortune-wheel-wrap{position:relative;width:145px;margin:18px auto}.fortune-wheel-wrap .fortune-wheel{margin:0}.fortune-wheel-wrap::before{content:"▼";position:absolute;top:-14px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;z-index:2}.fortune-wheel span{font-size:30px;color:#fff;text-shadow:0 2px 3px #000}.fortune-wheel.landed{animation:route-spin .9s ease-out both}@keyframes route-spin{to{transform:rotate(var(--spin))}}.route-chest{text-align:center;color:#ffd166;font-size:75px;text-shadow:0 0 24px #ffd16655;margin:12px}
/* High-detail customization */
.skinbox{max-width:660px;max-height:calc(100dvh - 28px);overflow:auto;overscroll-behavior:contain}
.skprev{align-items:center;gap:16px}
.skprev canvas.big{width:144px;height:144px;background:radial-gradient(ellipse at center,#21344b,#080e18 76%);border-color:#27425c;box-shadow:inset 0 0 24px #03060c}
.skname{overflow-wrap:anywhere;font-size:19px}.sqid b,.unm,.rnm{overflow-wrap:anywhere}.sqtop canvas{width:54px;height:54px}.ch canvas{width:48px;height:48px}

/* Independent appearance channels. Custom palettes travel as a compact, validated ID. */
var COLOR_PARTS = [['A','Primary armour'],['B','Secondary armour'],['C','Armour trim'],['V','Visor / eyes'],['S','Face / skin'],['W','Weapon body'],['X','Weapon grip'],['G','Energy lights'],['H','Energy core'],['K','Outline / joints']];
function validPal(id) { return typeof id === 'string' && (Object.prototype.hasOwnProperty.call(PALS,id) || /^custom_[0-9a-f]{60}$/.test(id)); }
function paletteOf(id) {
  if (typeof id === 'string' && /^custom_[0-9a-f]{60}$/.test(id)) {
    var p = {}; COLOR_PARTS.forEach(function(part,i){p[part[0]]='#'+id.slice(7+i*6,13+i*6);}); return p;
  }
  return validPal(id) ? PALS[id] : PALS.foe;
}
function paletteId(p) { return 'custom_'+COLOR_PARTS.map(function(part){return p[part[0]].slice(1).toLowerCase();}).join(''); }
function cleanName(n) { return String(n||'').replace(/[^a-zA-Z0-9 ._'\-]/g,'').slice(0,24).trim(); }
function safeLook(l,def) {
  l=l||{};
  return {pal:validPal(l.pal)?l.pal:def.pal,spr:CHASSIS.some(function(c){return c.id===l.spr;})?l.spr:def.spr,name:cleanName(l.name)||def.name};
}

}

function triangle(a, b) {
  if (a === 'tech' || b === 'tech') return { hit: 0, dmg: 0 };
  if (TRI[a] === b) return { hit: 15, dmg: 1 };
  if (TRI[b] === a) return { hit: -15, dmg: -1 };
  return { hit: 0, dmg: 0 };
}

    var free = Object.keys(open).map(function (k) {
      var a = k.split(','); return { x: +a[0], y: +a[1], k: k };
    }).filter(function (p) { return !used[p.k] && !ter(p.x, p.y).block && !unitAt(p.x, p.y); });
    free.sort(function (a, b) { return b.x - a.x || Math.abs(a.y - MAPH / 2) - Math.abs(b.y - MAPH / 2); });
    if (!free.length) return null;
    var p = free[0]; used[p.k] = 1;
    f.x = p.x; f.y = p.y; f.px = p.x; f.py = p.y; S.units.push(f); return f;
  }
  if (S.obj === 'boss') {
    var bd = BOSSES[RNG.int(Math.min(BOSSES.length,1+Math.floor((ch-5)/5)))];
    var b = spawnFoe(bd, true, Math.min(MAXLVL, lvl + 1 + Math.floor(ch / 10)));
    if (b) { b.boss = true; S.bossId = b.id; say('Commander detected: ' + b.name + '.'); }
    else { S.obj = 'wipe'; S.bossId = null; n++; }
  } else S.bossId = null;
  /* A varied random mix, with a chance of magic pressure rather than a forced counter to small teams. */
  for(var j=0;j<n;j++){
    var pick=pickFoe(ch,pickedFoes,j===0&&ch>=7&&n>=4&&RNG.chance(.65));
    if(spawnFoe(FOES[pick],false,lvl))pickedFoes.push(pick);
  }
  if (S.obj === 'hold') {
    var waves = Math.min(4,1 + Math.floor(ch / (startingSquadSize()<=2?14:9)));
    for (var w = 1; w <= waves; w++) S.reinforce.push({ turn: 1 + w * 2, n: reinforcementCount(ch) });
  }

  S.screen = 'map'; S.gameover = false;
  S.banner = 'CHAPTER ' + ch; S.bannerT = 1.6;
  say('--- CHAPTER ' + ch + ': ' + S.site + ' / ' + OBJS[S.obj].name + ' ---');
  if (NET.local) { NET.localActive = 0; S.handoff = localOwners().length > 1; }
  S.origin=null;S.reach=null;S.atkTiles=null;S.target=null;S.moveTrace=null;S.tileInfo=null;requestNextUnit();saveGame();
  netSync();
}

function spawnReinforcements(n) {
  var pool = foePool(S.chapter), lvl = foeLevel(S.chapter), plus = wpnPlus(S.chapter);
  var players = allies('ply'), spawned = 0;
  if (!players.length) return;
  var open = openTiles(players[0].x, players[0].y), free = [];
  for (var y = 0; y < MAPH; y++) for (var x = MAPW - 3; x < MAPW; x++) {
    if (!ter(x, y).block && !unitAt(x, y) && open[x + ',' + y]) free.push({ x:x, y:y });
  }
  var existing=allies("foe").map(function(u){return Object.keys(FOES).find(function(k){return FOES[k].name===u.key;});});
  while (spawned < n && free.length && allies("foe").length<foeCount(S.chapter)+reinforcementCount(S.chapter)) {
    var pos = free.splice(RNG.int(free.length), 1)[0];
    var pick=pickFoe(S.chapter,existing,false);existing.push(pick);
    var f = mkUnit(FOES[pick], 'foe', lvl, { plus: plus, mark: foeMark(S.chapter) });randomFoeTraits(f,S.chapter,false);
    f.x = pos.x; f.y = pos.y; f.px = pos.x; f.py = pos.y; S.units.push(f); spawned++;
  }
  if (spawned) {
    say('Reinforcements inbound (' + spawned + ').');
    S.banner = 'REINFORCEMENTS'; S.bannerT = 1.2;
  }
}

/* ================= TURN FLOW ================= */
function phaseStart(side) {
  var list = allies(side);
  for (var i = 0; i < list.length; i++) {
    var u = list[i]; u.acted = false; u.moved=false;
    var t = ter(u.x, u.y);
    if (t.heal && u.chp < u.stats.hp) {
      var h = Math.max(1, Math.round(u.stats.hp * t.heal));
      u.chp = Math.min(u.stats.hp, u.chp + h); fxText(u, '+' + h, '#54f0c8');
    }
    if (t.burn) {
      var d = Math.max(1, Math.round(u.stats.hp * t.burn));
      u.chp = Math.max(0, u.chp - d); fxText(u, d, '#ff8a3a');
      if (u.chp <= 0) onDeath(u, null);
    }
    if(u.chp>0&&side==='ply'&&perk(u,'regen')){var ph=Math.min(u.stats.hp-u.chp,Math.ceil(u.stats.hp*perk(u,'regen')));u.chp+=ph;if(ph)fxText(u,'+'+ph,'#54f0c8');}
    if (u.chp > 0 && u.traits.indexOf('regen') >= 0) {
      var r = Math.max(1, Math.round(u.stats.hp * 0.06));
      u.chp = Math.min(u.stats.hp, u.chp + r); fxText(u, '+' + r, '#8affd8');
    }
  }
}

function checkEnd() {
  if (S.screen !== 'map') return true;
  if (!allies('ply').some(function(u){return !u.autonomous;})) { gameOver(); return true; }
  var foesLeft = allies('foe').length;
  if (S.obj === 'wipe' && foesLeft === 0) { chapterClear(); return true; }
  if (S.obj === 'boss') {
    var boss = S.units.filter(function (u) { return u.id === S.bossId; })[0];
    if (!boss || boss.chp <= 0) { chapterClear(); return true; }
  }
  if (S.obj === 'hold' && S.turn > S.objTurns) { chapterClear(); return true; }
  return false;
}

function endPlayerPhase() {
  if(S.busy||S.screen!=='map'||S.phase!=='player')return;
  if(replayOpen()){schedule(endPlayerPhase,150);return;}
  S.phase='ally';S.sel=null;S.mode='idle';S.reach=null;S.atkTiles=null;
  var queue=aiOrder(allies('ply').filter(function(u){return u.autonomous;})),i=0;
  if(queue.length){S.banner='AI ALLY PHASE';S.bannerT=.9;netSync();refreshUI();}
  function next(){if(checkEnd())return;while(i<queue.length&&queue[i].chp<=0)i++;if(i>=queue.length){startEnemyPhase();return;}var u=queue[i++];function done(){netSync();if(checkEnd())return;if(!u.acted&&u.chp>0){aiAct(u,function(){u.acted=true;schedule(next,110);});}else schedule(next,110);}aiAct(u,done);}
  next();
}
function startEnemyPhase() {
  if (S.busy) return;
  S.phase = 'foe'; S.sel = null; S.mode = 'idle'; S.reach = null; S.atkTiles = null;
  if (checkEnd()) return;
  phaseStart('foe');
  if (checkEnd()) return;
  S.banner = 'ENEMY PHASE'; S.bannerT = 0.9;
  var queue = aiOrder(allies('foe'));
  var qi = 0;
  function step() {
    if (S.screen !== 'map') return;
    while (qi < queue.length && queue[qi].chp <= 0) qi++;
    if (qi >= queue.length) { endFoePhase(); return; }
    var u = queue[qi++];
    aiAct(u, function () {
      netSync();
      if (checkEnd()) return;
      schedule(step, 110);
    });
  }
  schedule(step, HEADLESS ? 0 : 420);
}
function endFoePhase() {
  S.turn++;
  S.phase = 'player';
  if (checkEnd()) return;
  for (var i = 0; i < S.reinforce.length; i++) {
    if (S.reinforce[i].turn === S.turn) { spawnReinforcements(S.reinforce[i].n); }
  }
  phaseStart('ply');
  if (checkEnd()) return;
  S.banner = 'PLAYER PHASE'; S.bannerT = 0.9;S.inspect=null;S.tileInfo=null;S.moveTrace=null;
  if (NET.local) { NET.localActive = 0; if (localOwners().length > 1) S.handoff = true; }
  requestNextUnit();saveGame();
  netSync();
  if (typeof refreshUI === 'function') refreshUI();
}

var ROUTE_ITEMS = ['Vital Core','Power Coil','Hex Prism','Targeting Lens','Armor Matrix','Ward Circuit','Reflex Chip','Fortune Relic'];
function resetRoute(){ S.gold=60; S.route=null; S.shrine=null; S.recruitOwners=null; S.combatReplay=null; }
function routeRandom(a){return a[Math.floor(rnd()*a.length)];}
/* Growth module rarity is rolled only after an item has been awarded. */
var ITEM_RARITIES = [
  {id:'common',name:'Common',chance:75,bonus:5,color:'#b9c7d4',prefix:'Standard'},
  {id:'uncommon',name:'Uncommon',chance:18,bonus:10,color:'#54f0a0',prefix:'Refined'},
  {id:'rare',name:'Rare',chance:5,bonus:15,color:'#64b5ff',prefix:'Advanced'},
  {id:'epic',name:'Epic',chance:1.8,bonus:20,color:'#c18aff',prefix:'Exalted'},
  {id:'legendary',name:'Legendary',chance:0.2,bonus:25,color:'#ffd166',prefix:'Mythic'}
];
var ITEM_ICONS={hp:'✚',str:'⚡',mag:'✧',skl:'◎',def:'⬟',res:'◈',spd:'➤',lck:'✦'};
function modulePrice(bonus){return 25+5*bonus;}
function itemRarity(it){return ITEM_RARITIES.filter(function(t){return t.id===it.rarity;})[0] || ITEM_RARITIES.filter(function(t){return t.bonus===it.bonus;})[0] || ITEM_RARITIES[0];}
function routeItem(){var k=Math.floor(rnd()*STATK.length),roll=rnd()*100,t=ITEM_RARITIES[0];for(var j=0;j<ITEM_RARITIES.length;j++){t=ITEM_RARITIES[j];if(roll<t.chance)break;roll-=t.chance;}return {s:STATK[k],name:t.prefix+' '+ROUTE_ITEMS[k],bonus:t.bonus,rarity:t.id};}
function itemLabel(it){var t=itemRarity(it);return '<span class="item-rarity" style="color:'+t.color+'">'+t.name.toUpperCase()+'</span> '+esc(it.name)+' · +'+it.bonus+'% '+STATN[it.s]+' growth';}
function itemOdds(){return '<div class="item-odds"><b>GROWTH ITEM RARITIES (PER MODULE ROLL)</b>'+ITEM_RARITIES.map(function(t){return '<span style="color:'+t.color+'">'+t.name+' '+t.chance+'% · +'+t.bonus+'%</span>';}).join('')+'</div>';}
/* Camp has a 10% chance of appearing anywhere on a two-choice map. */
function recruitParticipants(){
 if(!netOnline())return [{id:'',name:'YOU'}];
 if(Array.isArray(S.recruitOwners)&&S.recruitOwners.length)return S.recruitOwners;
 var ids=Array.from(new Set(S.units.filter(function(u){return u.side==='ply'&&u.owner;}).map(function(u){return String(u.owner);}).concat(S.dead.map(function(f){return String(f.owner||'');}).filter(Boolean))));
 return ids.map(function(id){return {id:id,name:ownerName(id)};});
}
function activeRecruit(owner){return allies('ply').find(function(u){return u.autonomous&&String(u.owner||'')===String(owner||'');});}
function recruitEligible(owner){return recruitParticipants().some(function(p){return String(p.id)===String(owner||'');})&&!activeRecruit(owner);}
/* Hire at the owner's rounded average career level, not their reset display level.
   Use their closest-level human unit as the reference for promotion rank. */
function recruitProfile(owner){
 var id=String(owner||''),humans=allies('ply').filter(function(u){return !u.autonomous;}),
     refs=humans.filter(function(u){return String(u.owner||'')===id;});
 if(!refs.length)refs=S.dead.filter(function(f){return !f.autonomous&&String(f.owner||'')===id;}).map(function(f){var p=f.progress||{};return {lvl:f.lvl||1,tier:p.tier||0,careerBase:p.careerBase||0};});
 if(!refs.length)refs=humans;
 var career=refs.length?Math.round(refs.reduce(function(t,u){return t+careerLevel(u);},0)/refs.length):1;
 career=Math.max(1,Math.min(MAXLVL+MAXTIER*(MAXLVL-1),career));
 var ref=refs.slice().sort(function(a,b){return Math.abs(careerLevel(a)-career)-Math.abs(careerLevel(b)-career);})[0]||{};
 var minTier=Math.max(0,Math.ceil((career-MAXLVL)/(MAXLVL-1))),maxTier=Math.min(MAXTIER,Math.floor((career-1)/(PROMOLVL-1)));
 var tier=Math.max(minTier,Math.min(maxTier,ref.tier||0));
 var base=Math.max(tier*(PROMOLVL-1),career-MAXLVL,Math.min(tier*(MAXLVL-1),career-1,ref.careerBase||0));
 var steps=[];for(var i=0;i<tier;i++){var n=Math.min(MAXLVL-1,base-(tier-i-1)*(PROMOLVL-1));steps.push(n);base-=n;}
 var spent=steps.reduce(function(t,n){return t+n;},0);
 return {career:career,tier:tier,level:career-spent,steps:steps,cost:60+8*(career-1)};
}
function recruitCost(owner){return recruitProfile(owner).cost;}
/* Grant expected growth for each stage using the growth rates active in that stage. */
function recruitTrain(u,level){var steps=level-u.lvl;STATK.forEach(function(k){u.stats[k]+=Math.round(u.grow[k]*steps/100);});u.lvl=level;u.chp=u.stats.hp;}
var RECRUIT_NAMES=['AXIOM','VECTOR','ION','CIPHER','ORBIT','PULSE','NEXUS','CHROME','QUILL','GHOST','EPOCH','DELTA'];
var RECRUIT_PALS=['sk_mono','sk_sea','sk_ember','sk_ice','sk_void','sk_toxic','sk_rose','sk_solar'];
function makeRecruit(key,owner){
 var def=ALLCHARS.find(function(c){return c.key===key;});if(!def||!recruitEligible(owner))return null;
 var profile=recruitProfile(owner),name=RECRUIT_NAMES[(S.uid-1)%RECRUIT_NAMES.length]+'-'+S.uid;
 var pal=RECRUIT_PALS[(S.uid-1)%RECRUIT_PALS.length];
 var u=mkUnit(def,'ply',1,{fair:true,look:{name:name,pal:pal,spr:"merc_"+key}});
 profile.steps.forEach(function(n){recruitTrain(u,n+1);promoteUnit(u,RNG.int(2));});
 recruitTrain(u,profile.level);
 u.autonomous=true;u.owner=String(owner||'');u.acted=true;S.units.push(u);return u;
}
function recruitStock(){var keys=ALLCHARS.map(function(c){return c.key;}),out=[];while(out.length<3&&keys.length)out.push(keys.splice(Math.floor(rnd()*keys.length),1)[0]);return out;}
function routeChoices(){var keys=Object.keys(ROUTES).filter(function(k){return k!=='camp'&&(k!=='recruit'||recruitParticipants().some(function(p){return recruitEligible(p.id);}));}),camp=rnd()<0.10,a=keys.splice(Math.floor(rnd()*keys.length),1)[0],b=camp?'camp':routeRandom(keys);return rnd()<0.5?[a,b]:[b,a];}
function routeGold(n){var prev=S.gold;S.gold=Math.max(0,S.gold+n);return S.gold-prev;}
function routeUnit(id){return allies('ply').filter(function(u){return u.id===id;})[0];}
function routeGrant(u,item){if(!u.items)u.items=[];u.items.push({s:item.s,name:item.name,bonus:item.bonus,rarity:itemRarity(item).id});u.grow[item.s]+=item.bonus;return u.name+' received '+item.name+' ['+itemRarity(item).name+'] (+'+item.bonus+'% '+STATN[item.s]+' growth).';}
function routeLoss(){var pairs=[];allies('ply').forEach(function(u){(u.items||[]).forEach(function(it,i){pairs.push({u:u,i:i});});});if(!pairs.length)return 'No growth items to lose. Nothing was taken.';var p=routeRandom(pairs),it=p.u.items.splice(p.i,1)[0];p.u.grow[it.s]-=it.bonus;return p.u.name+' lost '+it.name+' (-'+it.bonus+'% '+STATN[it.s]+' growth).';}
function routeFinish(msg){S.route.stage='result';S.route.message=msg;say(msg);}
function beginRoute(){var choices=routeChoices();var earn=20+S.chapter*3+Math.min(20,(S.squadSize||1)*2);routeGold(earn);S.route={ch:S.chapter,rev:0,stage:'choose',choices:choices,node:null,earn:earn,stock:[],message:''};}
function routeAction(cmd,arg,id,rev,ch,who){
  var r=S.route;if(S.screen!=='clear'||!r||r.rev!==rev||r.ch!==ch)return false;
  var live=allies('ply'),u=routeUnit(id),cost,it,msg;
  if(!live.length)return false;
  if(cmd==='promote'&&u&&!u.autonomous&&(!netOnline()||NET.local||String(u.owner)===String(who))){if(!promoteUnit(u,Number(arg)))return false;}
  else if(cmd==='choose'&&r.stage==='choose'&&r.choices.indexOf(arg)>=0){r.node=arg;r.stage='visit';if(arg==='recruit')r.recruits=recruitStock();if(arg==='shop'){for(var j=0,n=rnd()<0.65?1:2;j<n;j++){it=routeItem();it.price=modulePrice(it.bonus);it.sold=false;r.stock.push(it);}}}
  else if(cmd==='hire'&&r.stage==='visit'&&r.node==='recruit'){
    var parts=String(arg).split('|'),owner=NET.local?parts[0]:String(who||''),key=parts[1];
    cost=recruitCost(owner);
    if(parts.length!==2||(!NET.local&&parts[0]!==owner)||!r.recruits||r.recruits.indexOf(key)<0||S.gold<cost||!recruitEligible(owner))return false;
    var recruit=makeRecruit(key,owner);if(!recruit)return false;routeGold(-cost);r.message=recruit.name+' joined as '+recruit.cls+' · TIER '+(recruit.tier+1)+' LV '+recruit.lvl+' (career '+careerLevel(recruit)+') for '+cost+' gold.';say(r.message);
  }else if(cmd==='spin'&&r.stage==='visit'&&r.node==='wheel'){
    var chance=rnd()*100,roll=chance<15?0:chance<20?1:chance<70?2:chance<75?3:chance<80?4:5,v=routeRandom(live),k=routeRandom(STATK);r.roll=roll;
    if(roll===0)msg='Lost '+(-routeGold(-(25+Math.floor(rnd()*31))))+' gold.';
    if(roll===1){v.stats[k]++;if(k==='hp')v.chp++;msg=v.name+' gained +1 '+STATN[k]+' permanently.';}
    if(roll===2)msg='Won '+routeGold(30+Math.floor(rnd()*51))+' gold!';
    if(roll===3)msg=routeGrant(v,routeItem());
    if(roll===4)msg=routeLoss();
    if(roll===5)msg="Nothing happens. No gold, items or stats changed.";
    routeFinish(msg);
  }else if(cmd==='open'&&r.stage==='visit'&&r.node==='chest'){
    var q=rnd();routeFinish(q<0.65?'Found '+routeGold(25+Math.floor(rnd()*41))+' gold!':q<0.73?routeGrant(routeRandom(live),routeItem()):'The chest was empty.');
  }else if(cmd==='buy'&&r.stage==='visit'&&r.node==='shop'&&u){
    it=r.stock[Number(arg)];if(!it||it.sold||S.gold<it.price)return false;routeGold(-it.price);it.sold=true;r.message=routeGrant(u,it);say(r.message);
  }else if(cmd==='forge'&&r.stage==='visit'&&r.node==='forge'&&u){
    var lv=u.forgeLv||0;cost=35+lv*20;if(lv>=3||S.gold<cost)return false;routeGold(-cost);u.forgeLv=lv+1;u.wpn.plus++;u.wpn.mt++;STATK.forEach(function(k){u.grow[k]+=3;});routeFinish(u.name+' weapon Lv '+u.forgeLv+'/3: +1 might, +3% all growth rates.');
  }else if(cmd==='bless'&&r.stage==='visit'&&r.node==='shrine'&&['power','guard','focus'].indexOf(arg)>=0){
    S.shrine={kind:arg,ch:S.chapter+1};routeFinish(({power:'Power: +2 attack',guard:'Guard: +2 defense and resistance',focus:'Focus: +15 hit and +10 avoid'})[arg]+' for the next fight.');
  }else if(cmd==='camp'&&r.stage==='visit'&&r.node==='camp'){
    if(arg==='heal'){live.forEach(function(v){v.chp=v.stats.hp;});S.kits+=2;routeFinish('Squad fully healed. Received 2 repair kits.');}
    else if(arg==='revive'&&S.dead.length){var nu=reviveFallen(true,who);if(!nu)return false;routeFinish(nu.name+' returned to the squad with all recorded progression.');}
    else return false;
  }else if(cmd==='next'&&(r.stage==='result'||(r.stage==='visit'&&['shop','forge','recruit'].indexOf(r.node)>=0&&(!netOnline()||NET.local||r.node!=='recruit'||String(who)===String(NET.id))))){S.route=null;S.rewards=null;S.chapter++;startChapter();refreshUI();return true;}
  else return false;
  r.rev++;saveGame();netSync();refreshUI();return true;
}

    else if(r.node==='chest')h+='<div class="route-chest">▣</div>'+routeBtn('open','',0,'<b>OPEN CHEST</b><span>65% gold / 8% item / 27% empty</span>');

    else if(r.node==='recruit'){
      h+='<p class="hint">One AI operative per human player. Hire at your average career level (including promotions). Cost: 60 gold + 8 per career level above 1. Promoted recruits receive random promotion paths. Recruits move, attack and heal automatically.</p>';

function boardRead(){try{var a=JSON.parse(localStorage.getItem('hf_leaderboard_v1')||'[]');return Array.isArray(a)?a.filter(function(r){return r&&typeof r.id==='string'&&Number.isFinite(r.cleared);}):[];}catch(e){return [];}}
var BOARD_ENDPOINT_DEFAULT='', globalBoard={rows:[],status:'',scope:'global',request:0};
function boardEndpoint(){try{return localStorage.getItem('hf_global_endpoint')||BOARD_ENDPOINT_DEFAULT;}catch(e){return BOARD_ENDPOINT_DEFAULT;}}
function boardURL(v){try{var u=new URL(v);if(u.protocol!=='https:'&&!(u.protocol==='http:'&&['localhost','127.0.0.1'].indexOf(u.hostname)>=0))return '';if(u.username||u.password)return '';return u.href.replace(/\/$/,'');}catch(e){return '';}}

function takeReward(i) {
  var r = S.rewards[i];
  if (!r) return;
  var u = r.id ? S.units.filter(function (x) { return x.id === r.id; })[0] : null;
  if (r.k === 'wpn' && u) { var wa = r.amt || 2; u.wpn.plus += wa; u.wpn.mt += wa; }
  else if (r.k === 'stat' && u) { var sa = r.amt || 3; u.stats[r.s] += sa; if (r.s === 'hp') u.chp += sa; }
  else if (r.k === 'grow' && u) { u.grow[r.s] += 15; }
  else if (r.k === 'exp' && u) { grantExp(u, 60); }
  else if (r.k === 'kits') { S.kits += 3; }
  else if (r.k === 'heal') { allies('ply').forEach(function (x) { x.chp = x.stats.hp; }); }

    var nu = reviveFallen(false, r.owner);
    if (!nu) return;
    say(nu.name + ' is back online.');

    var rd = charByKey(r.key);

      say(ru.name + ' joined the echelon.');

}

function getSpr(spr, pal) {
  var key = spr + '|' + pal;
  if (sprCache[key]) return sprCache[key];
  var cnv = document.createElement('canvas');
  cnv.width = TILE * SC; cnv.height = TILE * SC;
  var c = cnv.getContext('2d');
  var rows = Object.prototype.hasOwnProperty.call(SPR,spr)?SPR[spr]:SPR.grunt, p = paletteOf(pal);
  var evolution=/^([a-z0-9_]+)~(vex|kestrel|nova|rampart|echo|glitch|sable|onyx|wisp)~([0-3])$/.exec(spr);
  if(evolution){c.drawImage(getSpr(evolution[1],pal),0,0);promotionArt(c,p,evolution[2],Number(evolution[3]));if(Object.keys(sprCache).length>=192)sprCache={};sprCache[key]=cnv;return cnv;}
  if(highDetailClass(c,p,spr)){if(Object.keys(sprCache).length>=192)sprCache={};sprCache[key]=cnv;return cnv;}
  var light={},dark={},glint={};
  Object.keys(p).forEach(function(k){light[k]=tintPart(p[k],.26);dark[k]=tintPart(p[k],-.29);glint[k]=tintPart(p[k],.58);});
  function at(x,y){return rows[y]&&rows[y][x]||'.';}
  function dot(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
  for (var r = 0; r < rows.length; r++) {
    for (var q = 0; q < rows[r].length; q++) {
      var ch = rows[r][q];
      if (ch === '.') continue;
      var col = p[ch]; if (!col) continue;
      var x=q*SC,y=r*SC;
      dot(x,y,SC,SC,col);
      if (spr==='crown' || ch==='K' || SC<3) continue;
      var top=at(q,r-1),left=at(q-1,r),bottom=at(q,r+1),right=at(q+1,r);
      /* Metallic bevels follow the silhouette instead of repeating a checkerboard. */
      if(top!==ch) dot(x,y,SC,1,light[ch]);
      if(left!==ch) dot(x,y+1,1,SC-1,light[ch]);
      if(bottom!==ch) dot(x,y+SC-1,SC,1,dark[ch]);
      if(right!==ch) dot(x+SC-1,y+1,1,SC-1,dark[ch]);
      if(ch==='V'||ch==='G'||ch==='H') {
        if(top!==ch) dot(x,y,SC,1,glint[ch]);
        if(ch==='H') dot(x+1,y+1,1,1,glint[ch]);
      }
      /* Rivets, armour grooves, and etched weapon sections. */
      if((ch==='A'||ch==='C') && (r===7||r===11) && (q===4||q===11)) dot(x+1,y+1,1,1,glint[ch]);
      if((ch==='A'||ch==='B') && r===10 && top===ch && bottom===ch) dot(x,y+SC-1,SC,1,dark[ch]);

  if(Object.keys(sprCache).length>=192) sprCache={};

  return cnv;
}

  if (NET.host) { netApply(intent, NET.id); return; }

  intent.from = NET.id;

function netApply(intent, who) {
  if (!netOnline()) return;
  if (intent.t === 'resync') { netSync(); return; }

  if (intent.t === 'route') {
    if(NET.local||String(who)===String(NET.id)||allPlayers().some(function(p){return String(p.id)===String(who);}))routeAction(intent.cmd,intent.arg,intent.id,intent.rev,intent.ch,who);
    netSync();return;
  }
  if (intent.t === 'reward') {
    if (S.screen !== 'clear' || !S.rewards) { netSync(); return; }
    var ri = intent.i | 0;
    if (ri < 0 || ri >= S.rewards.length) { netSync(); return; }
    var r = S.rewards[ri];
    if (r.k === 'recruit') r.owner = who;
    takeReward(ri);
    netSync();
    if (typeof refreshUI === 'function') refreshUI();
    return;
  }
  if (S.screen !== 'map' || S.phase !== 'player'||S.busy||replayOpen()) { netSync(); return; }

  if (intent.t === 'end') {
    if(!localHasMoves(who)){netSync();return;}
    allies('ply').forEach(function(u){if(!u.autonomous&&String(u.owner)===String(who)){u.acted=true;u.extraAction=false;}});
    S.sel=null;S.mode='idle';
    if(NET.local){if(!localAdvance())localEndRound();saveGame();}
    else if(!actionsRemaining())endPlayerPhase();
    netSync();refreshUI();return;
  }
  if (intent.t !== 'act' && intent.t !== 'move') return;
  if((intent.ch!==undefined&&intent.ch!==S.chapter)||(intent.turn!==undefined&&intent.turn!==S.turn)){netSync();return;}
  if(NET.local&&String(who)!==String(activeOwner()))return;
  if(S.sel&&S.origin&&String(who)!==String(activeOwner()))cancelPendingMove();

  var u = null, i;
  for (i = 0; i < S.units.length; i++) if (S.units[i].id === intent.uid) u = S.units[i];
  if (!u || u.chp <= 0 || u.side !== 'ply' || u.autonomous || u.acted) { netSync(); return; }
  if (String(u.owner || '') !== String(who)) { netSync(); return; }

  if(intent.t==='move'){
    if(u.moved||!Number.isInteger(intent.x)||!Number.isInteger(intent.y)){netSync();return;}
    var path=pathTo(u,intent.x,intent.y);if(!path||!path.length){netSync();return;}
    var own=String(who)===String(activeOwner());

    moveUnit(u,path,function(){if(own){deselect(true);selectUnit(u,true);}if(S.danger)computeDanger();if(NET.local)saveGame();netSync();refreshUI();});
    refreshUI();return;

  var tx = u.x, ty = u.y;
  if (intent.x !== undefined && intent.y !== undefined) {
    var reach = reachable(u);
    reach[u.x + ',' + u.y] = 0;
    if (reach[intent.x + ',' + intent.y] === undefined) { netSync(); return; }
    if(!Number.isInteger(intent.x)||!Number.isInteger(intent.y)){netSync();return;}
    tx = intent.x; ty = intent.y;
  }
  if(tx!==u.x||ty!==u.y)u.moved=true;
  u.x = tx; u.y = ty; u.px = tx; u.py = ty;

  if (intent.a === 'attack' || intent.a === 'repair') {
    var t = null;
    for (i = 0; i < S.units.length; i++) if (S.units[i].id === intent.tid) t = S.units[i];
    if (t && t.chp > 0 && canReachTarget(u, t)) {
      if (intent.a === 'attack' && t.side !== u.side) doCombat(u, t);
      else if (intent.a === 'repair' && t.side === u.side && t.id !== u.id) doHeal(u, t);
    }

  }
  actionComplete(u);
  if (!checkEnd()) {
    var left = S.units.filter(function (x) { return x.chp > 0 && x.side === 'ply' && !x.autonomous && !x.acted; });
    if (!left.length && !NET.local) {
      endPlayerPhase();
    } else if (NET.local && !localHasMoves(who)) {
      /* this player is spent: hand the device on, or close out the round */
      if (!localAdvance()) localEndRound();
    }
  }
  if(S.screen==='map'&&S.phase==='player'&&!S.handoff&&String(who)===String(activeOwner())){deselect(true);requestNextUnit(u.id);}
  if(NET.local)saveGame();
  netSync();
  if (typeof refreshUI === 'function') refreshUI();
}

/* ================= FORECAST CARD ================= */
function forecastCard(a, d) {
  var fa = forecast(a, d);
  var fd = canCounter(d, a) ? forecast(d, a) : null;
  function side(u, f, label) {
    if (!f) return '<div class="fcol"><b>' + esc(u.name) + '</b><span class="no">no counter</span></div>';
    return '<div class="fcol"><b>' + esc(u.name) + '</b>' +
      '<div class="frow"><i>DMG</i><s>' + f.dmg + (f.dbl ? ' + ' + f.follow : '') + '</s></div>' +
      '<div class="frow"><i>HIT</i><s>' + f.hit + '%</s></div>' +
      '<div class="frow"><i>CRIT</i><s>' + f.crit + '%</s></div>' + '<div class="frow"><i>CRIT DMG</i><s>'+f.critical+(f.dbl?' + '+f.followCrit:'')+'</s></div>' +
      '<div class="frow"><i>HP</i><s>' + u.chp + '</s></div>' + (u.shieldHP?'<div class="frow"><i>SHIELD</i><s>'+u.shieldHP+' next hit</s></div>':'')+'</div>';
  }
  var tri = fa.tri.dmg > 0 ? '<span class="adv">ADVANTAGE</span>' : fa.tri.dmg < 0 ? '<span class="dis">DISADVANTAGE</span>' : '';
  var lethal = fa.dmg+(fa.dbl?fa.follow:0)>=(d.chp+(d.shieldHP||0)) ? '<span class="adv">POTENTIAL KO</span>' : '';
  return '<div class="fcast">' + side(a, fa) + '<div class="fvs">VS ' + tri + lethal + '</div>' + side(d, fd) + '</div>';
}

      '<span class="rlv">L' + p.lvl + '</span>' + bar(fr, unitHpColor(p, fr, false)) + '</button>';

function squadOwners() {
  var seen = {}, out = [];

    var u = S.units[i];

function terCard(x, y) {
  var t = ter(x, y), bits = [];
  bits.push('MOVE COST ' + (t.block ? '&mdash;' : t.cost));
  if (t.def) bits.push('+' + t.def + ' DEF');
  if (t.avo) bits.push('+' + t.avo + ' AVOID');
  if (t.heal) bits.push('HEALS ' + Math.round(t.heal * 100) + '% MAX HP EACH TURN');
  if (t.burn) bits.push('BURNS ' + Math.round(t.burn * 100) + '% MAX HP EACH TURN');
  if (t.block) bits.push('BLOCKS MOVEMENT AND FIRE');
  var sym = { cover: 'shield mark', node: 'cross mark', dais: 'arrow mark', vent: 'hazard mark' }[S.grid[y][x]];
  return '<div class="ucard">' +
    '<div class="uhead"><span class="unm">' + t.name + '</span><span class="ucls">TERRAIN ' + x + ',' + y + '</span></div>' +
    '<div class="urow small">' + bits.join(' &middot; ') + '</div>' +
    (sym ? '<div class="urow small dim">marked with a ' + sym + '</div>' : '') +
    '</div>';
}

function terInfo(u) {

function attackableFrom(u) {
  if (u.wpn.heal && u.wpn.mt <= 0) return [];
  return foesOf(u.side).filter(function (e) { return canReachTarget(u, e); });

function healableFrom(u) {

/* ---------------- squad select ---------------- */
var MAXSQUAD = 6;
function squadKeys() {
  var out = [];
  for (var i = 0; i < ALLCHARS.length; i++) if (S.pick[ALLCHARS[i].key]) out.push(ALLCHARS[i].key);
  return out;
}
function renderSquad() {
  var t = $('squad-screen');
  var chosen = squadKeys();
  var cards = ALLCHARS.map(function (r) {
    var lk = lookOf(r.key, r), on = !!S.pick[r.key];
    var w = WPN[r.wpn];
    var cells = STATK.map(function (k) {
      return '<div class="tsc"><b>' + STATN[k] + '</b><span>' + r.base[k] + '</span><small class="grow-label">GROWTH</small><em>' + r.grow[k] + '%</em></div>';
    }).join('');
    return '<div class="sqc' + (on ? ' on' : '') + '">' +
      '<div class="sqtop">' +
      '<canvas class="tspr" data-spr="' + lk.spr + '" data-pal="' + lk.pal + '"></canvas>' +
      '<div class="sqid"><b>' + esc(lk.name) + '</b><span>' + esc(r.cls) + '</span>' +
      '<i>' + esc(w.name) + ' &middot; ' + (w.heal ? 'REPAIR' : (w.mag ? 'MAG' : 'PHYS')) +
      ' &middot; RNG ' + w.rmin + '-' + (w.rmax+(r.key==='onyx'?1:0)) + ' &middot; MOV ' + r.mov + '</i></div></div>' +
      '<div class="tsg">' + cells + '</div>' +
      '<p class="sqbio">' + esc(r.bio) + '</p>' +
      '<div class="sqbtns">' +
      '<button class="' + (on ? '' : 'ghost') + '" data-act="toggle" data-key="' + r.key + '">' + (on ? 'IN SQUAD' : 'ADD') + '</button>' +
      '<button class="ghost" data-act="skin" data-key="' + r.key + '">APPEARANCE</button>' +
      '</div></div>';
  }).join('');
  t.innerHTML =
    '<div class="sqbox">' +
    '<div class="sqhead"><h2>SELECT SQUAD</h2>' +
    '<p class="osub">Choose one to ' + MAXSQUAD + ' operatives. A smaller squad faces fewer hostiles ' +
    'but has fewer bodies and levels faster. One- and two-unit squads face reduced enemy counts and slower scaling. Customize your squad for this run. New runs reset names and appearances to defaults.</p></div>' +
    difficultyPicker() + '<div class="sqgrid">' + cards + '</div>' +
    '<div class="sqbar"><span class="sqcount">SQUAD <b>' + chosen.length + '</b> / ' + MAXSQUAD + '</span>' +
    '<button class="ghost" data-act="totitle">BACK</button>' +
    '<button ' + (chosen.length ? '' : 'disabled ') + 'data-act="deploy">DEPLOY</button></div>' +
    '</div>';
  paintPortraits(t);
}

/* ---------------- online lobby ---------------- */
function coopCards(mineKeys, actName) {
  return ALLCHARS.map(function (r) {
    var lk = lookOf(r.key, r);
    var owner = takenBy(r.key);
    var mine = mineKeys.indexOf(r.key) >= 0;
    var other = owner && !mine;
    if(other && owner.looks && owner.looks[r.key]) lk=safeLook(owner.looks[r.key],r);
    var cells = STATK.map(function (k) {
      return '<div class="tsc"><b>' + STATN[k] + '</b><span>' + r.base[k] + '</span><small class="grow-label">GROWTH</small><em>' + r.grow[k] + '%</em></div>';
    }).join('');
    return '<div class="sqc' + (mine ? ' on' : '') + (other ? ' taken' : '') + '">' +
      '<div class="sqtop"><canvas class="tspr" data-spr="' + lk.spr + '" data-pal="' + lk.pal + '"></canvas>' +
      '<div class="sqid"><b>' + esc(lk.name) + '</b><span>' + esc(r.cls) + '</span>' +
      '<i>' + esc(WPN[r.wpn].name) + ' &middot; ' + (WPN[r.wpn].heal ? 'REPAIR' : (WPN[r.wpn].mag ? 'MAG' : 'PHYS')) +
      ' &middot; MOV ' + r.mov + '</i></div></div>' +
      '<div class="tsg">' + cells + '</div>' +
      '<div class="sqbtns">' + (other
        ? '<button disabled' + (!NET.local ? ' style="color:' + ownerHpInfo(owner.id).color + ';filter:none;opacity:.85"' : '') + '>TAKEN BY ' + esc(owner.name) + '</button>'
        : '<button class="' + (mine ? '' : 'ghost') + '" data-act="' + actName + '" data-key="' + r.key + '">' +
          (mine ? 'YOURS' : 'PICK') + '</button><button class="ghost" data-act="skin" data-key="' + r.key + '">CUSTOMIZE</button>') +
      '</div></div>';
  }).join('');
}

function renderNet() {
  var t = $('squad-screen'), h = '';

  if (!NET.mode) {
    h = '<div class="sqbox"><div class="sqhead"><h2>CO-OP</h2>' +
      '<p class="osub">One shared endless run. Everyone picks their own operatives and moves only those. ' +
      'Enemy counts scale with the total starting squad across all players and increase each chapter.</p></div>' +
      '<div class="vsmenu">' +
      '<button class="vopt" data-act="netmode" data-v="create"><b>CREATE LOBBY</b>' +
      '<span>Start a room and get a code to send your friends.</span></button>' +
      '<button class="vopt" data-act="netmode" data-v="join"><b>JOIN LOBBY</b>' +
      '<span>Type the code a friend sent you.</span></button>' +
      '<button class="vopt" data-act="netmode" data-v="local"><b>SAME DEVICE</b>' +
      '<span>Everyone shares one screen, passing it round each turn. Works offline.</span></button>' +
      '</div>' +
      (NET.available
        ? '<p class="netnote">' + (NET.transport === 'p2p'
            ? 'Online here runs browser to browser. Everyone needs to be online at the same time.'
            : "Online here runs on this page's live rooms.") + '</p>'
        : '<p class="netnote">Online is unavailable on this page. SAME DEVICE still works.</p>') +
      '<div class="acts"><button class="ghost" data-act="totitle">BACK</button></div></div>';
    t.innerHTML = h; return;
  }

  /* ---- same device ---- */
  if (NET.mode === 'local') {
    if (!NET.localPlayers.length) {
      h = '<div class="sqbox"><div class="sqhead"><h2>SAME DEVICE</h2>' +
        '<p class="osub">How many of you are playing? You will take turns picking, then pass the device round ' +
        'each round so everyone moves their own operatives.</p></div>' +
        '<div class="vsmenu">' +
        [2, 3, 4].map(function (n) {
          return '<button class="vopt" data-act="localcount" data-v="' + n + '"><b>' + n + ' PLAYERS</b>' +
            '<span>Up to ' + Math.min(PER_PLAYER, Math.floor(SQUAD_CAP / n)) + ' operatives each.</span></button>';
        }).join('') +
        '</div><div class="acts"><button class="ghost" data-act="netmenu">BACK</button></div></div>';
      t.innerHTML = h; return;
    }
    var me = NET.localPlayers[NET.localStep];
    var last = NET.localStep >= NET.localPlayers.length - 1;
    h = '<div class="sqbox"><div class="sqhead"><h2>' + esc(me.name) + ', PICK YOUR OPERATIVES</h2>' +
      '<p class="osub">Up to ' + PER_PLAYER + ' each, ' + SQUAD_CAP + ' in the squad all told. ' +
      'Anyone already taken is greyed out. Hand the device on when you are done.</p></div>' +
      '<div class="plrs">' + NET.localPlayers.map(function (p, i) {
        return '<div class="plr' + (i === NET.localStep ? ' you' : '') + '"><b>' + esc(p.name) + '</b>' +
          '<span>' + (p.keys.length ? p.keys.length + ' PICKED' : 'NOT PICKED') + '</span></div>';
      }).join('') + '</div>' +
      difficultyPicker() + '<div class="sqgrid">' + coopCards(me.keys, 'localpick') + '</div>' +
      '<div class="sqbar"><span class="sqcount">SQUAD <b>' + squadTotal() + '</b> / ' + SQUAD_CAP + '</span>' +
      '<button class="ghost" data-act="netmenu">BACK</button>' +
      '<button ' + (me.keys.length ? '' : 'disabled ') + 'data-act="localnext">' +
      (last ? 'START RUN' : 'PASS ON') + '</button></div></div>';
    t.innerHTML = h; paintPortraits(t); return;
  }

  /* ---- online, before connecting ---- */
  if (!NET.available) {
    h = '<div class="sqbox"><div class="sqhead"><h2>ONLINE LOBBY</h2>' +
      '<p class="osub">This copy cannot reach other players. SAME DEVICE works here either way.</p></div>' +
      '<div class="acts"><button data-act="netmode" data-v="local">PLAY SAME DEVICE</button>' +
      '<button class="ghost" data-act="netmenu">BACK</button></div></div>';
    t.innerHTML = h; return;
  }
  if (NET.phase === 'idle' || NET.phase === 'joining') {
    var creating = NET.mode === 'create';
    h = '<div class="sqbox"><div class="sqhead"><h2>' + (creating ? 'CREATE LOBBY' : 'JOIN LOBBY') + '</h2>' +
      '<p class="osub">' + (creating
        ? 'This is your room code. Send it to your friends, then wait for them here.'
        : 'Type the code your friend gave you.') + '</p></div>' +
      '<div class="netform">' +
      '<label class="sklab">YOUR NAME</label>' +
      '<input id="netname" maxlength="11" value="' + esc(NET.name || '') + '" autocomplete="off" spellcheck="false" placeholder="PLAYER">' +
      '<label class="sklab">ROOM CODE</label>' +
      (creating
        ? '<div class="codebig">' + esc(NET.code) + '</div>' +
          '<div class="acts"><button class="ghost" data-act="netcopy">' + (NET.copied === 'code' ? 'COPIED' : 'COPY CODE') + '</button>' +
          '<button class="ghost" data-act="netroll">NEW CODE</button></div>'
        : '<input id="netcode" maxlength="6" value="' + esc(NET.code || '') + '" autocomplete="off" spellcheck="false" placeholder="ABCD">') +
      (NET.err ? '<p class="neterr">' + esc(NET.err) + '</p>' : '') +
      '<div class="acts">' +
      '<button data-act="netjoin">' + (NET.phase === 'joining' ? 'CONNECTING...' : (creating ? 'OPEN LOBBY' : 'JOIN')) + '</button>' +
      '<button class="ghost" data-act="netmenu">BACK</button></div>' +
      '<p class="netnote">' + (NET.transport === 'room'
        ? 'Your friends open the same page and use JOIN LOBBY with this code. They need edit access to the page, ' +
          'not just view access, or their moves will not send.'
        : 'Your friends open this same site and use JOIN LOBBY with this code. Open your lobby first and leave ' +
          'this page open.') + '</p>' +
      '</div></div>';
    t.innerHTML = h; return;
  }

  /* ---- online lobby ---- */
  var ps = allPlayers();
  var roster = ps.map(function (p) {
    var you = String(p.id) === NET.id;
    return '<div class="plr' + (you ? ' you' : '') + '" style="border-left:4px solid ' + ownerHpInfo(p.id).color + '"><b style="color:' + ownerHpInfo(p.id).color + '">● ' + esc(p.name || 'PLAYER') + '</b>' +
      '<span>' + (you ? 'YOU' : 'PLAYER') + (netHostId() === String(p.id) ? ' &middot; HOST' : '') + '</span>' +
      '<span class="' + (p.ready ? 'rdy' : 'dim') + '">' + ((p.keys || []).length
        ? (p.ready ? 'READY' : (p.keys.length + ' PICKED')) : 'CHOOSING') + '</span></div>';
  }).join('');
  h = '<div class="sqbox"><div class="sqhead"><h2>LOBBY ' + esc(NET.code) + '</h2>' +
    '<p class="osub">' + (ps.length < 2
      ? 'Waiting for someone to join with this code. Leave this page open.'
      : 'Pick up to ' + PER_PLAYER + ' operatives each, ' + SQUAD_CAP + ' in the squad all told, then press READY. ' +
        (NET.host ? 'You are the host and start the run.' : 'The host starts the run.')) + '</p>' +
    '<div class="acts"><button class="ghost" data-act="netcopy">' + (NET.copied === 'code' ? 'COPIED' : 'COPY CODE') + '</button></div></div>' +
    (NET.host?difficultyPicker():'<p class="osub">Difficulty selected by host when deploying.</p>') + '<div class="plrs">' + roster + '</div>' +
    (NET.err ? '<p class="neterr">' + esc(NET.err) + '</p>' : '') +
    '<div class="sqgrid">' + coopCards(NET.keys, 'nettoggle') + '</div>' +
    '<div class="sqbar"><span class="sqcount">SQUAD <b>' + squadTotal() + '</b> / ' + SQUAD_CAP + '</span>' +
    '<button class="ghost" data-act="netleave">LEAVE</button>' +
    '<button class="' + (NET.ready ? 'ghost' : '') + '" data-act="netready">' + (NET.ready ? 'NOT READY' : 'READY') + '</button>' +
    (NET.host ? '<button ' + (lobbyReady() ? '' : 'disabled ') + 'data-act="netstart">START RUN</button>' : '') +
    '</div></div>';
  t.innerHTML = h;
  paintPortraits(t);
}

/* ---------------- appearance ---------------- */
function renderSkin() {
  var key = S.skinKey, def = charByKey(key);
  if (!def) { S.skinKey = null; return; }
  var lk = lookOf(key, def);
  var palette=paletteOf(lk.pal);
  var channels=COLOR_PARTS.map(function(part){var k=part[0], v=palette[k];return '<label class="partpick"><input type="color" data-part="'+k+'" value="'+v+'" aria-label="'+part[1]+'"><span>'+part[1]+'</span><output data-hex="'+k+'">'+v.toUpperCase()+'</output></label>';}).join('');
  var swatches = SCHEMES.map(function (sc) {
    var p = PALS[sc.id];
    return '<button class="sw' + (lk.pal === sc.id ? ' on' : '') + '" data-act="setpal" data-key="' + key + '" data-v="' + sc.id + '">' +
      '<i style="background:' + p.A + '"></i><i style="background:' + p.B + '"></i><i style="background:' + p.V + '"></i>' +
      '<span>' + sc.name + '</span></button>';
  }).join('');
  var frames = CHASSIS.map(function (c) {
    return '<button class="ch' + (lk.spr === c.id ? ' on' : '') + '" data-act="setspr" data-key="' + key + '" data-v="' + c.id + '">' +
      '<canvas class="tspr" data-spr="' + c.id + '" data-pal="' + lk.pal + '"></canvas>' +
      '<span>' + c.name + '</span></button>';
  }).join('');
  $('overlay').innerHTML = '<div class="obox skinbox" data-skin="'+key+'">' +
    '<h2>OPERATIVE CUSTOMIZATION</h2>' +
    '<div class="skprev"><canvas class="tspr big" data-spr="' + lk.spr + '" data-pal="' + lk.pal + '"></canvas>' +
    '<div><b class="skname">' + esc(lk.name) + '</b><span class="dim">' + esc(def.cls) + '</span>' +
    '<p class="dim small">Stats and weapon stay the same. Custom names and colors last for this run only.</p></div></div>' +
    '<label class="sklab" for="skinname">CHARACTER NAME · UP TO 24 CHARACTERS</label>' +
    '<input id="skinname" maxlength="24" value="' + esc(lk.name).replace(/"/g, '&quot;') + '" autocomplete="off" spellcheck="false">' +
    '<label class="sklab">CUSTOM COLOURS · TAP EACH PART TO EDIT</label><div class="partgrid">'+channels+'</div>' +
    '<label class="sklab">PRESET PALETTES</label><div class="swgrid">' + swatches + '</div>' +
    '<label class="sklab">CHASSIS</label><div class="chgrid">' + frames + '</div>' +
    '<div class="acts"><button data-act="skindone">DONE</button>' +
    '<button class="ghost" data-act="skinreset" data-key="' + key + '">RESET</button></div></div>';
  paintPortraits($('overlay'));
}

function renderCodex(){var tabs={classes:'Classes',promotions:'Promotions',enemies:'Enemies',equipment:'Equipment',locations:'Locations',rules:'Rules'},tab=Object.prototype.hasOwnProperty.call(tabs,S.codexTab)?S.codexTab:'classes',h='';

/* Movement is committed when a destination is chosen. Deselecting only
   clears the interface; it never refunds movement or changes position. */
function cancelPendingMove() {
  S.sel=null;S.origin=null;S.target=null;S.reach=null;S.atkTiles=null;S.moveTrace=null;S.mode='idle';
}
function selectUnit(u,quiet) {
  if (!u || u.chp<=0 || S.busy || replayOpen() || S.screen!=='map') return;
  S.tileInfo = null;
  if (S.sel && S.sel!==u) cancelPendingMove();
  if (u.acted || !canAct() || !isMine(u)) { cancelPendingMove(); S.inspect=u; refreshUI(); return; }
  if (S.sel===u && ['act','target','healt'].indexOf(S.mode)>=0) {S.mode='act';S.target=null;refreshUI();return;}
  S.sel = u; S.inspect = null; S.moveTrace=null; S.hoverKey=null; S.origin = { x: u.x, y: u.y };
  S.reach = reachable(u); S.reach[u.x + ',' + u.y] = 0;
  S.atkTiles = attackTiles(u, S.reach);
  S.mode = u.moved?'act':'move'; S.target=null;
  if(!quiet)refreshUI();
}
function deselect(quiet) { S.sel = null; S.origin=null; S.mode = 'idle'; S.reach = null; S.atkTiles = null; S.target = null; S.moveTrace=null; if(!quiet)refreshUI(); }
/* Keep the bonus-action unit selected; otherwise cycle through owned, unspent units. */
var nextUnitRequest=null;
function requestNextUnit(after){nextUnitRequest={epoch:runEpoch,ch:S.chapter,turn:S.turn,owner:activeOwner(),after:after||null};}
function applyAutoSelection(){var r=nextUnitRequest;if(!r)return false;if(r.epoch!==runEpoch||r.ch!==S.chapter||r.turn!==S.turn||S.screen!=='map'||S.phase!=='player'||r.owner!==activeOwner()){nextUnitRequest=null;return false;}if(!canAct())return false;nextUnitRequest=null;if(S.sel||S.inspect||S.tileInfo)return false;var list=allies('ply').filter(isMine),idx=list.findIndex(function(u){return u.id===r.after;}),next=idx>=0&&!list[idx].acted?list[idx]:null;for(var j=1;!next&&j<=list.length;j++){var u=list[(idx+j)%list.length];if(!u.acted)next=u;}if(next){selectUnit(next,true);return true;}return false;}
function submitMovedAction(u,action,target){var intent={t:'act',uid:u.id,x:u.x,y:u.y,a:action,ch:S.chapter,turn:S.turn};if(target)intent.tid=target.id;cancelPendingMove();if(!NET.host&&!NET.local)NET.moveAfter=u.id;netSubmit(intent);}

var autoEndKey='';
function actionsRemaining(){return allies('ply').some(function(p){return !p.autonomous&&!p.acted;});}
function queueAutoEnd(){
 if(netOnline()||S.screen!=='map'||S.phase!=='player'||S.busy||actionsRemaining())return;
 var key=runEpoch+':'+S.chapter+':'+S.turn;if(autoEndKey===key)return;autoEndKey=key;
 schedule(function(){if(autoEndKey===key)autoEndKey='';if(key!==runEpoch+':'+S.chapter+':'+S.turn||S.screen!=='map'||S.phase!=='player'||actionsRemaining())return;endPlayerPhase();refreshUI();},450);
}
function finishAct(u) {
  actionComplete(u);
  deselect(true);
  if (netOnline()) { refreshUI(); return; }
  if (S.danger) computeDanger();
  if (checkEnd()) return;
  saveGame();
  requestNextUnit(u.id);queueAutoEnd();
  refreshUI();
}

function onTile(tx, ty) {
  if (S.screen !== 'map' || S.busy || replayOpen() || !inBounds(tx,ty)) return;
  var u=unitAt(tx,ty);
  if (!canAct()) {
    if (u) { S.inspect=u; S.tileInfo=null; } else { S.inspect=null; S.tileInfo={x:tx,y:ty}; }
    refreshUI();return;
  }
  /* Valid combat and repair targets take priority over switching units. */
  if (S.mode==='target' && S.sel && u && u.side!==S.sel.side && canReachTarget(S.sel,u)) {S.target=u;refreshUI();return;}
  if (S.mode==='healt' && S.sel && u && u.side===S.sel.side && u.id!==S.sel.id && canReachTarget(S.sel,u)) {S.target=u;refreshUI();return;}
  if (S.mode==='moving') return;
  if (u) {
    if (u===S.sel) {S.mode='act';S.target=null;refreshUI();return;}
    /* In target/action mode, tapping a friendly unit switches to it (or
       inspects it if not controllable). Committed movement stays spent. */
    if (u.side==='ply') {selectUnit(u);return;}
    if (S.mode==='target'||S.mode==='healt'||S.mode==='act') return;
    cancelPendingMove();S.inspect=u;S.tileInfo=null;refreshUI();return;
  }
  if (S.mode==='move' && S.sel && !S.sel.moved) {
    var key=tx+','+ty;
    if (S.reach && S.reach[key]!==undefined) {
      var sel=S.sel,path=pathTo(sel,tx,ty);if(!path||!path.length)return;
      if(netOnline()){if(!NET.host&&!NET.local)NET.moveAfter=sel.id;netSubmit({t:'move',uid:sel.id,x:tx,y:ty,ch:S.chapter,turn:S.turn});return;}
      S.moveTrace=path;S.mode='moving';
      moveUnit(sel,path,function(){S.mode='act';S.origin=null;S.reach=null;S.atkTiles=null;S.moveTrace=null;if(S.danger)computeDanger();saveGame();refreshUI();});
      refreshUI();return;
    }
    if(S.mode==='act')return;
    cancelPendingMove();
  } else if (S.mode==='target'||S.mode==='healt') return;
  S.inspect=null;S.tileInfo={x:tx,y:ty};refreshUI();
}

  if (act === 'attack') { S.mode = 'target'; S.target = null; var t = attackableFrom(s); if (t.length === 1) S.target = t[0]; refreshUI(); return; }

  }
  if (act === 'wait') {

    finishAct(s); return;
  }
  if (act === 'back') { S.mode = 'act'; S.target = null; refreshUI(); return; }
  if (act === 'cancel') {

    return;
  }
}

function applyLooks() {
  for (var i = 0; i < S.units.length; i++) {
    var u = S.units[i];
    if (u.side !== 'ply'||u.autonomous) continue;
    var def = charByKey(u.key);
    if (!def) continue;
    var lk = lookOf(u.key, def);
    u.name = lk.name; u.spr = lk.spr; u.pal = lk.pal;
  }
}
