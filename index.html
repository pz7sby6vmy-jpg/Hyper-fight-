    it:u.items||[], fl:u.forgeLv||0, hp: u.chp, mx: u.stats.hp, st: u.stats, gr: u.grow, lv: u.lvl, ex: u.exp || 0,
    cl: u.cls, w: u.wpn.id, wp: u.wpn.plus || 0, a: u.acted ? 1 : 0,
    n: u.name, p: u.pal, sp: u.spr, mv: u.mov, tr: u.traits || [],
    bs: u.boss ? 1 : 0, mk: u.mark || 0, pm: u.promoted ? 1 : 0 };
}
function unitFromWire(r) {
  var u = { id: r.i, key: r.k, side: r.s, owner: r.o || '', x: r.x, y: r.y, px: r.x, py: r.y,
    items:r.it||[], forgeLv:r.fl||0, chp: r.hp, stats: {}, grow: {}, lvl: r.lv, exp: r.ex || 0, cls: r.cl,
    acted: !!r.a, name: cleanName(r.n)||'OPERATIVE', pal: validPal(r.p)?r.p:(r.s==='ply'?'vex':'foe'), spr: Object.prototype.hasOwnProperty.call(SPR,r.sp)?r.sp:'grunt', mov: r.mv,
    traits: r.tr || [], boss: !!r.bs, mark: r.mk || 0, promoted: !!r.pm,
    flash: 0, wpn: mkWpn(r.w, r.wp || 0), ai: 'hunt', promo: null };
  for (var k in r.st) u.stats[k] = r.st[k];
  for (var g in (r.gr || {})) u.grow[g] = r.gr[g];
  u.stats.hp = r.mx;
  return u;
}
function netState() {
  return {
    host: NET.id, ownerColors: NET.ownerColors, ch: S.chapter, site: S.site, ob: S.obj, ot: S.objTurns,
    tn: S.turn, ph: S.phase, t: S.terrain, l: S.layout, kt: S.kits,
    gold:S.gold, route:S.route, shrine:S.shrine, sc: S.screen, rw: S.rewards, lu: S.levelups, dd: S.dead,
    sq: S.squadSize, lg: S.log.slice(0, 6),
    u: S.units.filter(function (x) { return x.chp > 0; }).map(wireUnit)
  };
}
function netSync() {
  if (!netOnline() || NET.local) return;
  if (!NET.host) return;
  NET.lastSend = Date.now();
  netEmit('state', netState());
}
function netBroadcast() { netSync(); }

function onNetState(msg) {
  var d = msg && msg.data ? msg.data : msg;
  if (!d || !d.u) return;
  if (NET.host) return;
  NET.lastHeard = Date.now();
  applyNetState(d);
}
function applyNetState(d) {
  if (d.ownerColors) NET.ownerColors = readOwnerColors(d.ownerColors);
  if (NET.phase === 'lobby' || NET.phase === 'joining') {
    S.skinKey=null;
    NET.phase = 'match'; NET.started = true;
    S.banner = 'CHAPTER ' + d.ch; S.bannerT = 1.4;
  }
  var inspectedId = S.screen === 'map' && d.sc === 'map' && S.chapter === d.ch && S.inspect ? S.inspect.id : null;
  var prev = {}, i;
  for (i = 0; i < S.units.length; i++) prev[S.units[i].id] = { hp: S.units[i].chp, x: S.units[i].x, y: S.units[i].y };
  if (S.terrain !== d.t || S.layout !== d.l || !S.grid) {
    S.terrain = d.t; S.layout = d.l; S.grid = buildGrid(d.t, d.l);
  }
  var seen = {}, list = [];
  for (i = 0; i < d.u.length; i++) {
    var u = unitFromWire(d.u[i]);
    var p = prev[u.id];
    if (p && p.hp > u.chp) fxText(u, p.hp - u.chp, u.side === 'ply' ? '#ff6a6a' : '#ffffff');
    else if (p && p.hp < u.chp) fxText(u, '+' + (u.chp - p.hp), '#54f0c8');
    seen[u.id] = 1;
    list.push(u);
  }
  for (i = 0; i < S.units.length; i++) {
    var old = S.units[i];
    if (old.chp > 0 && !seen[old.id]) fxBoom(old);
  }
  S.units = list;
  S.inspect = inspectedId === null ? null : list.filter(function(u) { return u.id === inspectedId; })[0] || null;
  S.chapter = d.ch; S.site = d.site; S.obj = d.ob; S.objTurns = d.ot;
  S.turn = d.tn; S.phase = d.ph; S.kits = d.kt; S.squadSize = d.sq;
  S.gold=typeof d.gold==='number'?d.gold:60; S.route=d.route||null; S.shrine=d.shrine||null;
  S.rewards = d.rw || null; S.levelups = d.lu || []; S.dead = d.dd || [];

/* ---------------- intents ---------------- */
function netSubmit(intent) {
  if (NET.local) { netApply(intent, activeOwner()); return; }
  if (NET.host) { netApply(intent, NET.id); return; }
  NET.pending = true;
  intent.from = NET.id;
  netEmit('act', intent);
  if (typeof refreshUI === 'function') refreshUI();
  setTimeout(function () { if (NET.pending) { NET.pending = false; refreshUI(); } }, 8000);
}
function onNetAct(msg) {
  if (!NET.host) return;
  var d = msg && msg.data ? msg.data : msg;
  if (!d || !d.t || !d.from) return;
  netApply(d, String(d.from));
}

function netApply(intent, who) {
  if (!netOnline()) return;
  if (intent.t === 'resync') { netSync(); return; }

  if (intent.t === 'route') {
    if(NET.local||String(who)===String(NET.id)||allPlayers().some(function(p){return String(p.id)===String(who);}))routeAction(intent.cmd,intent.arg,intent.id,intent.rev,intent.ch,who);
    netSync();return;
  }
  if (intent.t === 'reward') {
    if (S.screen !== 'clear' || !S.rewards) { netSync(); return; }
    var ri = intent.i | 0;
    if (ri < 0 || ri >= S.rewards.length) { netSync(); return; }
    var r = S.rewards[ri];
    if (r.k === 'recruit') r.owner = who;
    takeReward(ri);
    netSync();
    if (typeof refreshUI === 'function') refreshUI();
    return;
  }
  if (S.screen !== 'map' || S.phase !== 'player') { netSync(); return; }

  if (intent.t === 'end') {
    S.sel = null; S.mode = 'idle';
    endPlayerPhase();
    netSync();
    if (typeof refreshUI === 'function') refreshUI();
    return;
  }
  if (intent.t !== 'act') return;

  var u = null, i;
  for (i = 0; i < S.units.length; i++) if (S.units[i].id === intent.uid) u = S.units[i];
  if (!u || u.chp <= 0 || u.side !== 'ply' || u.acted) { netSync(); return; }
  if (String(u.owner || '') !== String(who)) { netSync(); return; }

  var tx = u.x, ty = u.y;
  if (intent.x !== undefined && intent.y !== undefined) {
    var reach = reachable(u);
    reach[u.x + ',' + u.y] = 0;
    if (reach[intent.x + ',' + intent.y] === undefined) { netSync(); return; }
    tx = intent.x; ty = intent.y;
  }
  u.x = tx; u.y = ty; u.px = tx; u.py = ty;

  if (intent.a === 'attack' || intent.a === 'repair') {
    var t = null;
    for (i = 0; i < S.units.length; i++) if (S.units[i].id === intent.tid) t = S.units[i];
    if (t && t.chp > 0 && canReachTarget(u, t)) {
      if (intent.a === 'attack' && t.side !== u.side) doCombat(u, t);
      else if (intent.a === 'repair' && t.side === u.side && t.id !== u.id) doHeal(u, t);
    }
  } else if (intent.a === 'kit' && S.kits > 0 && u.chp < u.stats.hp) {
    useKit(u);
  }
  u.acted = true;
  if (!checkEnd()) {
    var left = S.units.filter(function (x) { return x.chp > 0 && x.side === 'ply' && !x.acted; });
    if (!left.length && !NET.local) {
      endPlayerPhase();
    } else if (NET.local && !localHasMoves(who)) {
      /* this player is spent: hand the device on, or close out the round */
      if (!localAdvance()) localEndRound();
    }
  }
  netSync();
  if (typeof refreshUI === 'function') refreshUI();
}

/* ---------------- one shared device ---------------- */
function localOwners() {
  var out = [];
  for (var i = 0; i < NET.localPlayers.length; i++) {
    var p = NET.localPlayers[i];
    if ((p.keys || []).length) out.push(p.id);
  }
  return out;
}
function localHasMoves(ownerId) {
  for (var i = 0; i < S.units.length; i++) {
    var u = S.units[i];
    if (u.chp > 0 && u.side === 'ply' && String(u.owner) === String(ownerId) && !u.acted) return true;
  }
  return false;
}
function localAdvance() {
  var owners = localOwners();
  for (var step = 1; step <= owners.length; step++) {
    var idx = (NET.localActive + step) % owners.length;
    var oid = owners[idx];
    if (localHasMoves(oid)) {
      NET.localActive = idx;
      S.handoff = true;
      S.sel = null; S.mode = 'idle';
      if (typeof refreshUI === 'function') refreshUI();
      return true;
    }
  }
  return false;
}
function netHandoffDone() {
  S.handoff = false;
  S.banner = ownerName(activeOwner()); S.bannerT = 1.1;
  if (typeof refreshUI === 'function') refreshUI();
}
function localEndRound() {
  S.sel = null; S.mode = 'idle';

}

/* ---------------- drops ---------------- */

  if (!netOnline() || NET.local) return;
  var now = Date.now();
  if (NET.host) {
    if (now - NET.lastSend > 2500) netSync();
  } else if (now - NET.lastHeard > 5000) {

    '<div class="hmid"><b>' + objTxt + '</b><span>' + (OBJS[S.obj] ? OBJS[S.obj].desc : '') + '</span></div>' +
    '<div class="hright">' +
    '<span class="pill ' + (S.phase === 'player' ? 'ply' : 'foe') + '">' + (S.phase === 'player' ? 'YOUR TURN' : 'ENEMY') + ' &middot; T' + S.turn + '</span>' +
    '<span class="pill" style="color:#ffd166">GOLD ' + S.gold + '</span>' +
    (S.shrine && S.shrine.ch===S.chapter ? '<span class="pill" style="color:#54f0c8">SHRINE '+S.shrine.kind.toUpperCase()+'</span>' : '') +
    '<span class="pill">HOSTILES ' + foes + '</span>' +
    '<span class="pill" title="Enemy scaling uses original deployed squad size">START SQUAD ' + startingSquadSize() + '</span>' +
    (netOnline() ? '<span class="pill' + (canAct() ? ' ply' : '') + '">' +
      (NET.local ? esc(ownerName(activeOwner())) : squadOwners().length + ' PLAYERS') + '</span>' : '') +
    '<button class="mini" data-act="danger">' + (S.danger ? 'ZONE ON' : 'ZONE OFF') + '</button>' +
    netEndButton() +
    '</div>';

  $('owner-legend').innerHTML = ownerHpLegend();
  /* panel */
  var h = '';
  var top = coopPanelTop();
  if (top) {
    panel.innerHTML = top;
    roster.innerHTML = S.handoff ? '' : rosterStrip();
    return;
  }
  if (S.phase !== 'player') {
    h = '<div class="hint">Enemy phase &mdash; hold on.</div>';
  } else if (S.mode === 'act' && S.sel) {
    var u = S.sel;
    var tgts = attackableFrom(u);
    var heals = u.wpn.heal ? healableFrom(u) : [];
    h = '<div class="acts">' +
      (tgts.length ? '<button data-act="attack">ATTACK (' + tgts.length + ')</button>' : '<button disabled>NO TARGET</button>') +
      (u.wpn.heal ? (heals.length ? '<button data-act="repair">REPAIR (' + heals.length + ')</button>' : '<button disabled>NO ALLY</button>') : '') +
      (S.kits > 0 && u.chp < u.stats.hp ? '<button data-act="kit">KIT x' + S.kits + '</button>' : '') +
      '<button data-act="wait">WAIT</button>' +
      '<button class="ghost" data-act="cancel">CANCEL</button>' +
      '</div>' + unitCard(u);
  } else if ((S.mode === 'target' || S.mode === 'healt') && S.sel) {
    if (S.target) {
      h = (S.mode === 'target' ? forecastCard(S.sel, S.target) : healCard(S.sel, S.target)) +
        '<div class="acts"><button data-act="confirm">' + (S.mode === 'target' ? 'ENGAGE' : 'REPAIR') + '</button>' +
        '<button class="ghost" data-act="back">BACK</button></div>';
    } else {
      h = '<div class="hint">' + (S.mode === 'target' ? 'Tap a hostile in range.' : 'Tap an ally in range.') + '</div>' +
        '<div class="acts"><button class="ghost" data-act="back">BACK</button></div>';
    }
  } else if (S.mode === 'move' && S.sel) {
    h = '<div class="hint">Tap a blue tile to move, or tap ' + esc(S.sel.name) + ' again to act in place.</div>' + unitCard(S.sel);
  } else if (S.tileInfo) {
    h = terCard(S.tileInfo.x, S.tileInfo.y) +
      '<div class="acts"><button class="ghost" data-act="cleartile">CLOSE</button></div>';
  } else if (S.inspect) {
    h = unitCard(S.inspect, S.inspect.side === 'foe' ? '<div class="urow small dim">' + esc(terInfo(S.inspect)) + '</div>' : '') +
      '<div class="acts"><button class="ghost" data-act="clearinspect">CLOSE</button></div>';
  } else {
    h = '<div class="hint">Tap one of your units to move. ' + (S.kits ? S.kits + ' repair kits left.' : 'No repair kits left.') + '</div>';
  }
  panel.innerHTML = h;

  roster.innerHTML = rosterStrip();
}

function rosterStrip() {
  var ps = allies('ply'), rh = '';
  if (netOnline()) ps = ps.filter(isMine);
  for (var i = 0; i < ps.length; i++) {
    var p = ps[i], fr = p.chp / p.stats.hp;
    rh += '<button class="rchip' + (p.acted ? ' done' : '') + (S.sel === p ? ' on' : '') + '" data-act="focus" data-id="' + p.id + '">' +
      '<span class="rnm"' + (onlineOwnerHP(p) ? ' style="color:' + ownerHpInfo(p.owner).color + '"' : '') + '>' + esc(p.name) + '</span>' +
      '<span class="rlv">L' + p.lvl + '</span>' + bar(fr, unitHpColor(p, fr, false)) + '</button>';
  }
  return rh;
}

function squadOwners() {
  var seen = {}, out = [];
  for (var i = 0; i < S.units.length; i++) {
    var u = S.units[i];
    if (u.side !== 'ply' || !u.owner) continue;
    if (!seen[u.owner]) { seen[u.owner] = 1; out.push(u.owner); }
  }
  return out;
}
function netEndButton() {
  if (!netOnline()) return '<button class="mini" data-act="end">END TURN</button>';
  if (S.screen !== 'map' || S.phase !== 'player') return '<button class="mini" disabled>END TURN</button>';
  if (NET.local) {
    var owners = localOwners(), more = false;
    for (var i = 0; i < owners.length; i++) if (owners[i] !== activeOwner() && localHasMoves(owners[i])) more = true;
    if (more) return '<button class="mini" data-act="pass">PASS ON</button>';
    return '<button class="mini" data-act="end">END ROUND</button>';
  }
  return '<button class="mini" data-act="end"' + (canAct() ? '' : ' disabled') + '>END TURN</button>';
}
function coopPanelTop() {
  if (!netOnline()) return '';
  if (S.handoff) {
    return '<div class="handoff"><b>' + esc(ownerName(activeOwner())) + '</b>' +
      '<span>Pass the device over, then tap to move your operatives.</span>' +
      '<button data-act="handoff">I AM ' + esc(ownerName(activeOwner())) + '</button></div>';
  }
  if (S.phase !== 'player') return '<div class="hint">Enemy phase.</div>';
  if (NET.pending) return '<div class="hint">Sending your move...</div>';
  return '';
}

function terCard(x, y) {
  var t = ter(x, y), bits = [];
  bits.push('MOVE COST ' + (t.block ? '&mdash;' : t.cost));
  if (t.def) bits.push('+' + t.def + ' DEF');
  if (t.avo) bits.push('+' + t.avo + ' AVOID');
  if (t.heal) bits.push('HEALS ' + Math.round(t.heal * 100) + '% MAX HP EACH TURN');
  if (t.burn) bits.push('BURNS ' + Math.round(t.burn * 100) + '% MAX HP EACH TURN');
  if (t.block) bits.push('BLOCKS MOVEMENT AND FIRE');
  var sym = { cover: 'shield mark', node: 'cross mark', dais: 'arrow mark', vent: 'hazard mark' }[S.grid[y][x]];
  return '<div class="ucard">' +
    '<div class="uhead"><span class="unm">' + t.name + '</span><span class="ucls">TERRAIN ' + x + ',' + y + '</span></div>' +
    '<div class="urow small">' + bits.join(' &middot; ') + '</div>' +
    (sym ? '<div class="urow small dim">marked with a ' + sym + '</div>' : '') +
    '</div>';
}

function terInfo(u) {
  var t = ter(u.x, u.y);
  return t.name + (t.def ? ' +' + t.def + ' DEF' : '') + (t.avo ? ' +' + t.avo + ' AVO' : '');
}
function healCard(a, t) {
  var amt = Math.min(healPower(a), t.stats.hp - t.chp);
  return '<div class="fcast"><div class="fcol"><b>' + esc(a.name) + '</b>' +
    '<div class="frow"><i>REPAIR</i><s>' + healPower(a) + '</s></div></div>' +
    '<div class="fvs">-&gt;</div><div class="fcol"><b>' + esc(t.name) + '</b>' +
    '<div class="frow"><i>HP</i><s>' + t.chp + ' -&gt; ' + (t.chp + amt) + '</s></div></div></div>';
}

function attackableFrom(u) {
  if (u.wpn.heal && u.wpn.mt <= 0) return [];
  return foesOf(u.side).filter(function (e) { return canReachTarget(u, e); });
}
function healableFrom(u) {
  return allies(u.side).filter(function (a) { return a.id !== u.id && canReachTarget(u, a) && a.chp < a.stats.hp; });
}

/* ================= SCREENS ================= */
function paintPortraits(root) {
  if (!root || !root.querySelectorAll) return;
  var cs = root.querySelectorAll('.tspr');
  for (var i = 0; i < cs.length; i++) {
    var c = cs[i];
    c.width = TILE * SC; c.height = TILE * SC;
    var g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(getSpr(c.getAttribute('data-spr'), c.getAttribute('data-pal')), 0, 0);
  }
}

      '<canvas class="tspr" data-spr="' + c.id + '" data-pal="' + lk.pal + '"></canvas>' +
      '<span>' + c.name + '</span></button>';
  }).join('');
  $('overlay').innerHTML = '<div class="obox skinbox" data-skin="'+key+'">' +
    '<h2>OPERATIVE CUSTOMIZATION</h2>' +
    '<div class="skprev"><canvas class="tspr big" data-spr="' + lk.spr + '" data-pal="' + lk.pal + '"></canvas>' +
    '<div><b class="skname">' + esc(lk.name) + '</b><span class="dim">' + esc(def.cls) + '</span>' +
    '<p class="dim small">Stats and weapon stay the same whatever they look like.</p></div></div>' +
    '<label class="sklab" for="skinname">CHARACTER NAME · UP TO 24 CHARACTERS</label>' +
    '<input id="skinname" maxlength="24" value="' + esc(lk.name).replace(/"/g, '&quot;') + '" autocomplete="off" spellcheck="false">' +
    '<label class="sklab">CUSTOM COLOURS · TAP EACH PART TO EDIT</label><div class="partgrid">'+channels+'</div>' +
    '<label class="sklab">PRESET PALETTES</label><div class="swgrid">' + swatches + '</div>' +
    '<label class="sklab">CHASSIS</label><div class="chgrid">' + frames + '</div>' +
    '<div class="acts"><button data-act="skindone">DONE</button>' +
    '<button class="ghost" data-act="skinreset" data-key="' + key + '">RESET</button></div></div>';
  paintPortraits($('overlay'));
}

function renderHelp() {
  $('overlay').innerHTML = '<div class="obox">' +
    '<h2>HOW TO PLAY</h2>' +
    '<ul class="help">' +
    '<li><b>Turns.</b> Move each operative once, then END TURN. The enemy moves, then you go again.</li>' +
    '<li><b>Combat.</b> Physical attacks hit DEF, hex code hits RES. SPD four or more above the target attacks twice. SKL drives hit and crit; SPD and LCK drive dodge.</li>' +
    '<li><b>Triangle.</b> Blade beats Rail, Rail beats Lance, Lance beats Blade: plus or minus 15 hit and 1 damage. Tech is neutral.</li>' +
    '<li><b>Terrain.</b> Barricades and data daises give DEF and avoid. Repair nodes heal. Plasma vents burn. Bulkheads block.</li>' +
    '<li><b>Growth.</b> Each level, every stat rolls its growth percentage. 300% total means about three stat points a level.</li>' +
    '<li><b>Levels.</b> Promotion at ' + PROMOLVL + ' (new class, +MOV, bonus stats), hard cap at ' + MAXLVL + '. ' +
    'At the cap, experience becomes OVERDRIVE instead: single stat points, still weighted by growth.</li>' +
    '<li><b>Marks.</b> Once hostiles hit the cap too they come back as MK-II, MK-III and worse. That part never stops.</li>' +
    '<li><b>Death is permanent</b> unless you rescue a fallen ally at a Recovery Camp. Lose everyone and the run ends.</li>' +
    '<li><b>ZONE</b> shades every tile the enemy can reach and hit this turn. Use it.</li>' +
    '<li><b>Tap any empty tile</b> to read what it does.</li>' +
    '<li><b>Co-op.</b> One shared endless run. Everyone picks their own operatives and moves only those; ' +
    'anyone can end the turn once the squad is done. Lose the whole squad and the run is over for everybody.</li>' +
    '</ul>' +
    '<h3 class="lgh">TILE MARKS</h3><div class="legend">' +
    '<div class="lg"><canvas class="lgc" data-t="node"></canvas><div><b>REPAIR NODE</b><span>cross mark &middot; heals 15% max HP at the start of your turn</span></div></div>' +
    '<div class="lg"><canvas class="lgc" data-t="cover"></canvas><div><b>BARRICADE</b><span>shield mark &middot; +2 DEF, +20 avoid, costs 2 to enter</span></div></div>' +
    '<div class="lg"><canvas class="lgc" data-t="dais"></canvas><div><b>DATA DAIS</b><span>arrow mark &middot; high ground, +1 DEF and +25 avoid</span></div></div>' +
    '<div class="lg"><canvas class="lgc" data-t="vent"></canvas><div><b>PLASMA VENT</b><span>hazard mark &middot; burns 12% max HP at the start of your turn</span></div></div>' +
    '<div class="lg"><canvas class="lgc" data-t="grate"></canvas><div><b>GRATING</b><span>+5 avoid, otherwise ordinary deck</span></div></div>' +
    '<div class="lg"><canvas class="lgc" data-t="wall"></canvas><div><b>BULKHEAD</b><span>blocks movement and line of fire</span></div></div>' +
    '</div><div class="acts"><button data-act="closehelp">BACK</button></div></div>';
}

function renderClear() {
  var h = '<div class="obox">' +
    '<h2>CHAPTER ' + S.chapter + ' CLEAR</h2>';
  if (S.levelups.length) {
    h += '<div class="lvs">' + S.levelups.map(function (l) {
      if (l.over) {
        return '<div class="lv"><b>' + esc(l.name) + '</b><span>OVERDRIVE</span>' +
          '<span class="promo">' + STATN[l.over] + ' +1</span></div>';
      }
      var g = Object.keys(l.gains).filter(function (k) { return k !== 'promo' && k !== 'none'; })
        .map(function (k) { return '<span class="gn">' + STATN[k] + ' +' + l.gains[k] + '</span>'; }).join('');
      return '<div class="lv"><b>' + esc(l.name) + '</b><span>LV ' + l.lvl + '</span>' +
        (g || '<span class="dim">no gains</span>') +
        (l.gains.promo ? '<span class="promo">PROMOTED: ' + esc(l.gains.promo) + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }
  if(S.route){$('overlay').innerHTML=h+routeRender()+'</div>';return;}
  h += '<p class="osub">Pick one upgrade. Next chapter is harder.</p><div class="rews">';
  (S.rewards || []).forEach(function (r, i) {
    h += '<button class="rew" data-act="reward" data-i="' + i + '"><b>' + esc(r.t) + '</b><span>' + esc(r.d) + '</span></button>';
  });
  h += '</div></div>';
  $('overlay').innerHTML = h;
}

function renderOver() {
  $('overlay').innerHTML = '<div class="obox">' +
    '<h2 class="dead">ECHELON LOST</h2>' +
    '<p class="osub">You fell on chapter ' + S.chapter + '. Deepest run: ' + S.best + '.</p>' +
    (S.dead.length ? '<div class="lvs">' + S.dead.map(function (d) {
      return '<div class="lv"><b>' + esc(d.name) + '</b><span>' + esc(d.cls) + ' LV ' + d.lvl + '</span><span class="dim">lost on CH ' + d.chapter + '</span></div>';
    }).join('') + '</div>' : '') +
    '<div class="acts"><button data-act="new">NEW RUN</button><button class="ghost" data-act="totitle">TITLE</button></div></div>';
}

/* ================= INPUT ================= */
function selectUnit(u) {
  S.tileInfo = null;
  if (u.acted || !canAct() || !isMine(u)) { S.inspect = u; S.sel = null; S.mode = 'idle'; refreshUI(); return; }
  S.sel = u; S.inspect = null; S.origin = { x: u.x, y: u.y };
  S.reach = reachable(u); S.reach[u.x + ',' + u.y] = 0;
  S.atkTiles = attackTiles(u, S.reach);
  S.mode = 'move';
  refreshUI();
}
function deselect() { S.sel = null; S.mode = 'idle'; S.reach = null; S.atkTiles = null; S.target = null; refreshUI(); }

function finishAct(u) {
  u.acted = true;
  deselect();
  if (netOnline()) { refreshUI(); return; }
  if (S.danger) computeDanger();
  if (checkEnd()) return;
  if (!allies('ply').filter(function (p) { return !p.acted; }).length) {
    schedule(function () { if (S.screen === 'map' && S.phase === 'player') endPlayerPhase(); }, 450);
  }
  refreshUI();
}

function onTile(tx, ty) {
  if (S.screen !== 'map' || S.busy) return;
  if (!canAct()) {
    var ou = unitAt(tx, ty);
    if (ou) { S.inspect = ou; S.tileInfo = null; } else { S.inspect = null; S.tileInfo = { x: tx, y: ty }; }
    refreshUI(); return;
  }
  var u = unitAt(tx, ty);
  if (S.mode === 'target') {
    if (u && u.side !== S.sel.side && u.chp > 0 && canReachTarget(S.sel, u)) { S.target = u; refreshUI(); }
    return;
  }
  if (S.mode === 'healt') {
    if (u && u.side === S.sel.side && u.id !== S.sel.id && canReachTarget(S.sel, u)) { S.target = u; refreshUI(); }
    return;
  }
  if (S.mode === 'act') return;
  if (S.mode === 'move' && S.sel) {
    if (u === S.sel) { S.mode = 'act'; refreshUI(); return; }
    var key = tx + ',' + ty;
    if (S.reach[key] !== undefined && !u) {
      var path = pathTo(S.sel, tx, ty);
      var sel = S.sel;
      moveUnit(sel, path, function () { S.mode = 'act'; refreshUI(); });
      S.mode = 'moving'; refreshUI();
      return;
    }
    if (u && isMine(u)) { selectUnit(u); return; }
    if (u && u.side === 'ply') { S.inspect = u; deselect(); S.inspect = u; refreshUI(); return; }
    if (u) { S.inspect = u; deselect(); S.inspect = u; refreshUI(); return; }
    deselect(); return;
  }
  if (u) {
    if (isMine(u)) { S.tileInfo = null; selectUnit(u); }
    else { S.inspect = u; S.tileInfo = null; refreshUI(); }
  } else { S.inspect = null; S.tileInfo = { x: tx, y: ty }; refreshUI(); }
}

function doAction(act, el) {
  if (act === 'online') { netInit(); S.screen = 'net'; NET.mode = null; NET.err = ''; refreshUI(); return; }
  if (act === 'netmenu') {
    if (NET.sub) { try { NET.sub.leave(); } catch (e) { } NET.sub = null; }
    NET.mode = null; NET.phase = 'idle'; NET.err = ''; NET.copied = '';
    NET.local = false; NET.localStep = 0; NET.localPlayers = [];
    refreshUI(); return;
  }
  if (act === 'netmode') {
    var m = el.getAttribute('data-v');
    NET.mode = m; NET.err = ''; NET.copied = '';
    if (m === 'create') NET.code = roomCode();
    if (m === 'join') NET.code = '';
    if (m === 'local') { NET.localStep = 0; NET.localPlayers = []; }
    refreshUI(); return;
  }
  if (act === 'localcount') {
    var n = parseInt(el.getAttribute('data-v'), 10) || 2;
    NET.localPlayers = [];
    for (var li = 0; li < n; li++) NET.localPlayers.push({ id: 'P' + (li + 1), name: 'PLAYER ' + (li + 1), keys: [] });
    NET.localStep = 0; NET.local = true;
    refreshUI(); return;
  }
  if (act === 'netcopy') {
    try {
      if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(NET.code).then(function () {
          NET.copied = 'code'; refreshUI();
        }, function () { });
      }
    } catch (e) { }
    return;
  }
  if (act === 'netroll') { NET.code = roomCode(); NET.copied = ''; refreshUI(); return; }
  if (act === 'localpick') { pickKey(el.getAttribute('data-key')); refreshUI(); return; }
  if (act === 'localnext') {
    var cur = NET.localPlayers[NET.localStep];
    if (!cur || !cur.keys.length) return;
    if (NET.localStep < NET.localPlayers.length - 1) { NET.localStep++; refreshUI(); return; }
    netStartLocal(); return;
  }
  if (act === 'pass') { if (!localAdvance()) { localEndRound(); } return; }
  if (act === 'handoff') { netHandoffDone(); return; }
  if (act === 'netjoin') {
    var nEl = $('netname'), cEl = $('netcode');
    netJoin(cEl && cEl.value ? cEl.value : NET.code, nEl && nEl.value ? nEl.value : NET.name);
    return;
  }
  if (act === 'netleave') { netLeave(); return; }
  if (act === 'nettoggle') { pickKey(el.getAttribute('data-key')); refreshUI(); return; }
  if (act === 'netready') { NET.ready = !NET.ready; netPresence(); refreshUI(); return; }
  if (act === 'netstart') { netStartRun(); return; }
  if (act === 'tosquad') {
    S.pick = {};
    for (var pi = 0; pi < ROSTER.length; pi++) S.pick[ROSTER[pi].key] = true;
    S.screen = 'squad'; refreshUI(); return;
  }
  if (act === 'toggle') {
    var tk = el.getAttribute('data-key');
    if (S.pick[tk]) delete S.pick[tk];
    else if (squadKeys().length < MAXSQUAD) S.pick[tk] = true;
    refreshUI(); return;
  }
  if (act === 'deploy') {
    var keys = squadKeys();
    if (!keys.length) return;
    S.screen = 'map'; newRun(keys); refreshUI(); return;
  }
  if (act === 'skin') { S.skinKey = el.getAttribute('data-key'); if(S.screen==='net'&&!NET.local&&NET.phase==='lobby'&&NET.ready){NET.ready=false;netPresence();} refreshUI(); return; }
  if (act === 'skindone') { S.skinKey = null; saveLooks(); if(S.screen==='net'&&!NET.local&&NET.phase==='lobby'){NET.ready=false;netPresence();} refreshUI(); return; }
  if (act === 'skinreset') { delete LOOKS[el.getAttribute('data-key')]; saveLooks(); renderSkin(); return; }
  if (act === 'setpal' || act === 'setspr') {
    var k = el.getAttribute('data-key'), v = el.getAttribute('data-v');
    if (!LOOKS[k]) LOOKS[k] = {};
    LOOKS[k][act === 'setpal' ? 'pal' : 'spr'] = v;
    saveLooks(); renderSkin(); return;
  }
  if (act === 'new') { S.screen = 'squad'; doAction('tosquad', el); return; }
  if (act === 'continue') { if (!loadGame()) { S.screen = 'squad'; doAction('tosquad', el); return; } refreshUI(); return; }
  if (act === 'help') { S.prevScreen = S.screen; S.screen = 'help'; refreshUI(); return; }
  if (act === 'closehelp') { S.screen = S.prevScreen || 'title'; refreshUI(); return; }
  if (act === 'totitle') { S.screen = 'title'; refreshUI(); return; }
  if(act==='route'){if(!S.route)return;var it={t:'route',cmd:el.getAttribute('data-cmd'),arg:el.getAttribute('data-v'),id:Number(el.getAttribute('data-id')),rev:S.route.rev,ch:S.route.ch};if(netOnline())netSubmit(it);else routeAction(it.cmd,it.arg,it.id,it.rev,it.ch,'');return;}
  if (act === 'reward') {
    var rIdx = parseInt(el.getAttribute('data-i'), 10);
    if (netOnline()) { netSubmit({ t: 'reward', i: rIdx }); return; }
    takeReward(rIdx); refreshUI(); return;
  }
  if (S.screen !== 'map') return;
  if (act === 'end') {
    if (netOnline()) {
      if (NET.local) { if (!S.handoff) { deselect(); localEndRound(); } return; }
      if (canAct()) { deselect(); netSubmit({ t: 'end' }); }
      return;
    }
    if (S.phase === 'player' && !S.busy) { deselect(); endPlayerPhase(); refreshUI(); }
    return;
  }
  if (act === 'danger') { S.danger = !S.danger; if (S.danger) computeDanger(); refreshUI(); return; }
  if (act === 'clearinspect') { S.inspect = null; refreshUI(); return; }
  if (act === 'cleartile') { S.tileInfo = null; refreshUI(); return; }
  if (act === 'focus') {
    var id = parseInt(el.getAttribute('data-id'), 10);
    var u = S.units.filter(function (x) { return x.id === id; })[0];
    if (u) { if (u.acted) { S.inspect = u; S.sel = null; S.mode = 'idle'; refreshUI(); } else selectUnit(u); }
    return;
  }
  if (!S.sel) return;
  var s = S.sel;
  if (act === 'attack') { S.mode = 'target'; S.target = null; var t = attackableFrom(s); if (t.length === 1) S.target = t[0]; refreshUI(); return; }
  if (act === 'repair') { S.mode = 'healt'; S.target = null; var hh = healableFrom(s); if (hh.length === 1) S.target = hh[0]; refreshUI(); return; }
  if (act === 'kit') {
    if (netOnline()) { netSubmit({ t: 'act', uid: s.id, x: s.x, y: s.y, a: 'kit' }); deselect(); return; }
    useKit(s); finishAct(s); return;
  }
  if (act === 'wait') {
    if (netOnline()) { netSubmit({ t: 'act', uid: s.id, x: s.x, y: s.y, a: 'wait' }); deselect(); return; }
    finishAct(s); return;
  }
  if (act === 'back') { S.mode = 'act'; S.target = null; refreshUI(); return; }
  if (act === 'cancel') {
    if (S.origin) { s.x = S.origin.x; s.y = S.origin.y; s.px = s.x; s.py = s.y; }
    if (netOnline() && NET.host) netBroadcast();
    deselect(); return;
  }
  if (act === 'confirm' && S.target) {
    var tgt = S.target;
    if (netOnline()) {
      netSubmit({ t: 'act', uid: s.id, x: s.x, y: s.y,
        a: S.mode === 'target' ? 'attack' : 'repair', tid: tgt.id });
      S.target = null; deselect(); return;
    }
    if (S.mode === 'target') { doCombat(s, tgt); }
    else { doHeal(s, tgt); }
    S.target = null;
    if (s.chp <= 0) { deselect(); if (!checkEnd()) refreshUI(); return; }
    finishAct(s);
    return;
  }
}

function applyLooks() {
  for (var i = 0; i < S.units.length; i++) {
    var u = S.units[i];
    if (u.side !== 'ply') continue;
    var def = charByKey(u.key);
    if (!def) continue;
    var lk = lookOf(u.key, def);
    u.name = lk.name; u.spr = lk.spr; u.pal = lk.pal;
  }
}

/* ================= BOOT ================= */
function boot() {
  cv = $('cv');
  cv.width = MAPW * TP; cv.height = MAPH * TP;
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  loadBest(); loadLooks(); netInit();
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    var tx = Math.floor((e.clientX - r.left) / r.width * MAPW);
    var ty = Math.floor((e.clientY - r.top) / r.height * MAPH);
    if (inBounds(tx, ty)) onTile(tx, ty);
  });
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-act')) { doAction(el.getAttribute('data-act'), el); return; }
      el = el.parentNode;
    }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el && (el.id === 'netname' || el.id === 'netcode')) {
      var v2 = String(el.value || '').toUpperCase().replace(/[^A-Z0-9 \-]/g, '');
      if (el.id === 'netname') NET.name = v2.slice(0, 11); else NET.code = v2.replace(/[^A-Z0-9]/g, '').slice(0, 6);
      el.value = (el.id === 'netname') ? NET.name : NET.code;
      return;
    }
    if(el && S.skinKey && el.type==='color' && el.hasAttribute('data-part')) {
      var part=el.getAttribute('data-part'), value=String(el.value||'').toLowerCase(), def=charByKey(S.skinKey);
      if(!def||!COLOR_PARTS.some(function(p){return p[0]===part;})||!/^#[0-9a-f]{6}$/.test(value))return;
      var pal=Object.assign({},paletteOf(lookOf(S.skinKey,def).pal));pal[part]=value;
      if(!LOOKS[S.skinKey])LOOKS[S.skinKey]={};
      var token=paletteId(pal);LOOKS[S.skinKey].pal=token;saveLooks();
      var overlay=$('overlay');overlay.querySelectorAll('.tspr').forEach(function(c){c.setAttribute('data-pal',token);});
      overlay.querySelectorAll('.sw.on').forEach(function(b){b.classList.remove('on');});
      var out=overlay.querySelector('[data-hex="'+part+'"]');if(out)out.textContent=value.toUpperCase();
      paintPortraits(overlay);return;
    }
    if (el && el.id === 'skinname' && S.skinKey) {
      var raw=String(el.value||'').replace(/[^a-zA-Z0-9 ._'\-]/g,'').slice(0,24);if(el.value!==raw)el.value=raw;
      var v=cleanName(raw);
      if (!LOOKS[S.skinKey]) LOOKS[S.skinKey] = {};
      if (v) LOOKS[S.skinKey].name = v; else delete LOOKS[S.skinKey].name;
      saveLooks();
      var lbl = document.querySelector ? document.querySelector('.skname') : null;
      if (lbl) lbl.textContent = v || (charByKey(S.skinKey) || {}).name || '';
    }
  });
  document.addEventListener('keydown', function (e) {
    if(S.skinKey || (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))) return;
    if (e.key === 'e' || e.key === 'E') doAction('end');
    if (e.key === 'd' || e.key === 'D') doAction('danger');
    if (e.key === 'Escape') { if (S.mode === 'act' || S.mode === 'target' || S.mode === 'healt') doAction(S.mode === 'act' ? 'cancel' : 'back'); }
  });
  refreshUI();
  requestAnimationFrame(frame);
}
if (typeof window !== 'undefined' && !HEADLESS) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}
if (typeof window !== 'undefined') {
  window.__GAME = { S: S, newRun: newRun, aiAct: aiAct, endPlayerPhase: endPlayerPhase, allies: allies,
    routeAction:routeAction, routeChoices:routeChoices, routeItem:routeItem, itemRarity:itemRarity, saveGame:saveGame, loadGame:loadGame, routeRender:routeRender, takeReward: takeReward, startChapter: startChapter, forecast: forecast, reachable: reachable, ROSTER: ROSTER,
    foeLevel: foeLevel, foeCount: foeCount, mkUnit: mkUnit, FOES: FOES, checkEnd: checkEnd,
    doCombat: doCombat, doHeal: doHeal, pathTo: pathTo, moveUnit: moveUnit, attackTiles: attackTiles,
    canReachTarget: canReachTarget, wRange: wRange, dist: dist, ter: ter, foesOf: foesOf,
    healableFrom: healableFrom, useKit: useKit, wpnPlus: wpnPlus, inBounds: inBounds,
    refreshUI: refreshUI, selectUnit: selectUnit, squadKeys: squadKeys, applyLooks: applyLooks,
    NET: NET, netJoin: netJoin, netStartRun: netStartRun, netSubmit: netSubmit, netApply: netApply,
    netStartLocal: netStartLocal, netHandoffDone: netHandoffDone, roomCode: roomCode,
    onNetPeers: onNetPeers, onNetState: onNetState, onNetAct: onNetAct, netState: netState,
    applyNetState: applyNetState, canAct: canAct, isMine: isMine, netTick: netTick, netSync: netSync,
    PER_PLAYER: PER_PLAYER, SQUAD_CAP: SQUAD_CAP, distField: distField, pickKey: pickKey,
    takenBy: takenBy, squadTotal: squadTotal, allPlayers: allPlayers, lobbyReady: lobbyReady,
    localOwners: localOwners, localAdvance: localAdvance, localEndRound: localEndRound,
    activeOwner: activeOwner, ownerName: ownerName, buildSquad: buildSquad, rosterStrip: rosterStrip,
    ALLCHARS: ALLCHARS, charByKey: charByKey, SCHEMES: SCHEMES, CHASSIS: CHASSIS, LOOKS: LOOKS, paletteOf:paletteOf, paletteId:paletteId, lookOf:lookOf, getSpr:getSpr, netLooks:netLooks, wireUnit:wireUnit, unitFromWire:unitFromWire,
    MAXLVL: MAXLVL, PROMOLVL: PROMOLVL, foeMark: foeMark, atMax: atMax,
    LAYOUTS: LAYOUTS, THEMES: THEMES, themeIdx: themeIdx, buildGrid: buildGrid, openTiles: openTiles,
    cvRef: function () { return cv; },
    renderInto: function (target) {
      var oc = cv, octx = ctx;
      cv = target; ctx = target.getContext('2d'); ctx.imageSmoothingEnabled = false;
      bgCanvas = null; draw();
      cv = oc; ctx = octx; bgCanvas = null;
    }, computeDanger: computeDanger, rollRewards: rollRewards,
    saveGame: saveGame, loadGame: loadGame, levelUp: levelUp, doAction: doAction, onTile: onTile,
    draw: draw, update: update, finishAct: finishAct, deselect: deselect, gameOver: gameOver };
}
